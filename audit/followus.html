<!doctype html>
<html><head><meta charset="utf-8" />
<style>
  /* Square 1080 for Instagram/Facebook; the renderer also shoots a 1080x1920
     story crop from the same markup. Handles are taken from the site footer,
     not from memory — one wrong handle on a shareable graphic sends people to
     an impersonator, which for an election tool is the whole risk. */
  @import url('');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 0;
    font-family: Inter, 'Segoe UI', system-ui, sans-serif; color: #fff;
    background:
      radial-gradient(1000px 620px at 50% 0%, #0f4d33 0%, transparent 62%),
      linear-gradient(160deg, #0a3a26 0%, #06251a 52%, #0a3247 100%);
    position: relative; overflow: hidden;
  }
  /* Faint hash field, same motif as the X header — signed, public, verifiable. */
  .hash { position: absolute; inset: 0; opacity: .05; font-family: ui-monospace, Menlo, monospace;
    font-size: 21px; line-height: 2.05; word-break: break-all; color: #9ff5c6; padding: 18px 12px; }
  .crest { width: 168px; height: 168px; margin-bottom: 18px; position: relative; }
  .name { font-size: 74px; font-weight: 800; letter-spacing: 7px; position: relative; }
  .sub { font-size: 25px; letter-spacing: 5px; color: #7fd6a8; font-weight: 600;
    margin-top: 6px; text-transform: uppercase; position: relative; }
  .rule { width: 132px; height: 4px; background: #2ee08a; border-radius: 3px; margin: 34px 0 30px; position: relative; }
  .follow { font-size: 34px; font-weight: 700; letter-spacing: 2px; margin-bottom: 28px; position: relative; }
  .rows { display: flex; flex-direction: column; gap: 15px; position: relative; }
  .row { display: flex; align-items: center; gap: 20px; background: rgba(255,255,255,.07);
    border: 1px solid rgba(120,230,175,.26); border-radius: 18px; padding: 17px 34px; width: 640px; }
  .ic { width: 46px; height: 46px; flex: none; display: flex; align-items: center; justify-content: center; }
  .ic svg { width: 40px; height: 40px; fill: #eafff3; }
  .handle { font-size: 33px; font-weight: 700; letter-spacing: .3px; }
  .plat { margin-left: auto; font-size: 20px; color: #86caa6; font-weight: 600; letter-spacing: 1.6px; }
  .site { margin-top: 40px; font-size: 33px; font-weight: 800; letter-spacing: 1px; position: relative; }
  .site span { color: #2ee08a; }
  /* The disclaimer is pinned to the bottom while the rest is vertically
     centred, so on the square crop it collided with the URL. Reserving the
     footer's own height at the bottom of the flex box keeps them apart at both
     aspect ratios instead of nudging one and breaking the other. */
  body { padding-bottom: 96px; }
  .foot { position: absolute; bottom: 30px; left: 0; right: 0; font-size: 19px;
    color: #6fae8d; letter-spacing: .5px; text-align: center; }
</style></head>

<script>
  // Deterministic filler so the backdrop never renders empty or differently
  // between shots (Math.random would change every render).
  // Lehmer RNG. The obvious `seed * 1103515245 + 12345` overflows 2^53 in JS
  // floats, so the low bits — the only ones used here — degenerate and the
  // backdrop rendered as a wall of "aaaa". 16807 * 2^31 stays inside float
  // precision, so the digits actually vary.
  let s = 'abcdef0123456789', out = '', seed = 20260815;
  for (let i = 0; i < 4200; i++) { seed = (seed * 16807) % 2147483647; out += s[seed % 16]; }
  document.getElementById('hash').textContent = out;
</script>

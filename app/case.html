<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#00482b" />
  <meta name="description" content="Hawkeye case file — one flagged result, its full evidence, and the crowd's verdicts." />
  <title data-i18n="case.hawkeye-case-file">Hawkeye — Case File</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg?v=101" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <script>/*hk-theme-init*/(function(){try{var t=localStorage.getItem("hawkeye_theme");if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";}document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme="dark";}})();</script>
  <link rel="stylesheet" href="styles.css?v=194" />
  <script src="native.js?v=122"></script>
  <script src="/monitor.js?v=3" defer></script>
  <style>
    .chipst { font-weight: 700; padding: 2px 10px; border-radius: 999px; font-size: 0.78rem; }
    .chipst.open { background: var(--tint-danger); color: var(--text-danger); }
    .chipst.upheld { background: #7a1f1f; color: #fff; }
    .chipst.cleared { background: var(--tint-ok); color: var(--link); }
    .chipst.unresolved { background: var(--tint-warn); color: var(--text-warn); }
    .flag { background: var(--tint-danger); border-left: 4px solid var(--danger); padding: 10px 12px; margin: 8px 0; font-size: 0.9rem; }
    .flag b { text-transform: uppercase; font-size: 0.78rem; letter-spacing: 0.03em; }
    .ev { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
    .ev a img { width: 100%; border: 1px solid var(--border); display: block; }
    .ev .cap { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; margin: 8px 0; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e6e6e5; }
    .mono { font-family: monospace; font-size: 0.78rem; word-break: break-all; color: var(--muted); }
    .q { margin: 14px 0; }
    .q p { font-weight: 700; margin: 0 0 6px; }
    .q label { display: inline-flex; align-items: center; gap: 6px; margin-right: 16px; font-size: 0.92rem; }
    .q input { width: auto; margin: 0; }
    .tallybar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); margin: 8px 0; }
    .tallybar i { display: block; }
    .verdict-box { border-top: 4px solid var(--green); }
    .note { font-size: 0.85rem; color: var(--muted); }
  </style>
  <script src="authgate.js?v=4"></script>
</head>
<body>
  <header class="gov-header">
    <div class="wrap brand-row">
      <a class="brand" href="index.html"><span class="crest" aria-hidden="true"><img src="logo.svg?v=101" alt="" width="30" height="30" style="display:block" /></span>
        <div class="brand-text"><strong>HAWKEYE</strong><span data-i18n="common.independent-election-results-monitor">Independent Election Results Monitor</span></div></a>
      <button data-i18n-attr="aria-label:common.menu" class="menu-btn" aria-label="Menu" aria-expanded="false"
        onclick="const m=document.getElementById('menu-panel');const o=m.hidden;m.hidden=!o;this.setAttribute('aria-expanded',String(o));">&#9776;</button>
      <nav id="menu-panel" class="menu-panel" hidden>
        <a data-i18n="common.report-a-result" href="observe.html">Report a Result</a>
        <a data-i18n="common.leaderboard" href="results.html">Leaderboard</a>
        <a data-i18n="common.public-reports-log" href="dashboard.html">Public Reports Log</a>
        <a data-i18n="common.verify-the-ledger" href="ledger.html">Verify the Ledger</a>
        <a data-i18n="common.election-integrity" href="integrity.html">Election Integrity</a>
        <a data-i18n="common.public-docket" href="docket.html">Public Docket</a>
        <a href="faq.html">FAQ</a>
        <a data-i18n="common.about-contact" href="about.html">About & Contact</a>
      </nav>
    </div>
  </header>
<main class="wrap">
    <p data-i18n-html="case.all-cases-2"><a href="docket.html">← All cases</a></p>
    <h1 data-i18n="case.case" id="title">Case</h1>
    <p class="hint" id="meta"></p>
    <div id="flags"></div>

    <div class="card">
      <h2 data-i18n="case.evidence">Evidence</h2>
      <div id="evidence"><div class="skel" style="height:80px"></div></div>
    </div>

    <div class="card verdict-box">
      <h2 data-i18n="case.the-crowd-s-verdict">The Crowd's Verdict</h2>
      <div class="tallybar" id="tallybar"></div>
      <p class="note" id="tallytext"></p>
      <div id="judge"></div>
      <div id="notes"></div>
    </div>
  </main>

  <script src="device.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    // ENCODED ONCE, HERE. Every /api/docket/… call below drops this straight into
    // the path, so a raw value would not stay a case id: `../` or a bare `#` in
    // ?id= escapes the segment and re-aims those requests at any other path on
    // this origin — including the POST that carries the observer's bearer token.
    // The URLs stay relative either way, so nothing can be pointed off-origin;
    // this pins them to the one endpoint they are meant to hit. Real case ids are
    // numeric, so encoding changes nothing for a genuine link.
    const qid = encodeURIComponent(new URLSearchParams(location.search).get('id'));
    const token = localStorage.getItem('hawkeye_token');
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    /* TRANSLATED AT PAINT, NEVER AT LOAD. i18n.js loads after this block, so a
       string resolved when the fetch lands can still be English. Everything
       below is painted by functions that run again on 'hawkeye-lang' (bound at
       the bottom), and {name} placeholders are filled AFTER the lookup so they
       land in the translation as well as in the English — in ONE pass, so a
       juror's note that happens to contain "{v1}" is never itself substituted. */
    const T = (k, en, p) => {
      const s = String(window.HawkeyeI18n ? window.HawkeyeI18n.t(k, en) : en);
      return p ? s.replace(/\{(\w+)\}/g, (m, a) => (a in p ? String(p[a]) : m)) : s;
    };
    // The server's words for a case's status and a verdict. Functions, so each
    // paint reads the language of the moment.
    const statusWord = (s) => ({
      open: T('case.status-open', 'open'),
      upheld: T('case.status-upheld', 'upheld'),
      cleared: T('case.status-cleared', 'cleared'),
      unresolved: T('case.status-unresolved', 'unresolved'),
    })[s] || s;
    const verdictWord = (v) => ({
      fraudulent: T('case.verdict-fraudulent', 'fraudulent'),
      legit: T('case.verdict-legit', 'legit'),
      inconclusive: T('case.verdict-inconclusive', 'inconclusive'),
    })[v] || v;

    /**
     * A URL on its way into href or src needs more than esc().
     *
     * esc() stops a value closing the attribute it sits in, which is the whole
     * job for text. A URL has a second way to be dangerous that needs no quotes
     * at all: `javascript:...` in an href runs on click. So the scheme is
     * checked first and only then is the value attribute-escaped.
     *
     * Relative paths pass — they cannot carry a scheme. An absolute URL must be
     * http or https; anything else returns empty, which renders a dead link
     * rather than a live one.
     *
     * sheetUrl is backend-supplied today, so this is not a live hole. It was
     * the one field in this template not going through esc(), and a photo URL
     * is exactly the kind of value that later grows a user-influenced path.
     */
    const safeUrl = (u) => {
      const s = String(u ?? '').trim();
      if (/^[a-z][a-z0-9+.-]*:/i.test(s) && !/^https?:/i.test(s)) return '';
      return esc(s);
    };
    let CASE = null;   // the case as fetched, or { missing: true }
    let TALLY = null;  // the case's tally, replaced by the one a verdict returns
    let MINE = null;   // /mine's answer, once it has come back
    let MSG = null;    // the line under Cast my verdict, as { k, en, p } — repainted, not frozen
    let DONE = false;  // a verdict was recorded on this visit: the form stays disabled

    function paintTally() {
      const t = TALLY;
      if (!t) return;
      const tot = Math.max(1, t.total);
      $('tallybar').innerHTML =
        `<i style="width:${(t.fraudulent / tot) * 100}%;background:var(--danger)"></i>`
        + `<i style="width:${(t.legit / tot) * 100}%;background:var(--green)"></i>`
        + `<i style="width:${(t.inconclusive / tot) * 100}%;background:#b45309"></i>`;
      $('tallytext').textContent = T('case.tally', '{v0} verdict(s): {v1} fraudulent · {v2} legit · {v3} inconclusive.',
        { v0: t.total, v1: t.fraudulent, v2: t.legit, v3: t.inconclusive });
    }
    function tally(t) { TALLY = t; paintTally(); }

    async function load() {
      const c = await fetch(`/api/docket/${qid}`).then((r) => r.json());
      if (c.error) { CASE = { missing: true }; paint(); return; }
      CASE = c;
      TALLY = c.tally;
      paint();
      judgeUi(c);
    }

    function paint() {
      const c = CASE;
      if (!c) return;
      const title = $('title');
      // The markup key comes off: this page paints the title itself (and again
      // on every language change), while menu.js re-runs apply() AFTER this
      // page's listener and would otherwise put the bare "Case" back.
      title.removeAttribute('data-i18n');
      if (c.missing) {
        title.textContent = T('case.case-not-found', 'Case Not Found');
        $('meta').textContent = T('case.case-not-found-body', 'This case doesn’t exist, or the link is out of date.');
        // Hide the empty Evidence / Verdict skeleton cards on the not-found path.
        for (const el of document.querySelectorAll('.card')) el.hidden = true;
        return;
      }
      title.innerHTML = `${esc(T('case.title', 'Case #{v0}', { v0: c.id }))} — ${esc(c.unit.name)} <span class="chipst ${esc(c.status)}">${esc(String(statusWord(c.status)).toUpperCase())}</span>`;
      const bits = [c.contest, T('case.meta-place', '{v0} ward, {v1}, {v2}', { v0: c.unit.ward, v1: c.unit.lga, v2: c.unit.state })];
      if (c.unit.registeredVoters) bits.push(T('case.registered-voters', '{v0} registered voters', { v0: c.unit.registeredVoters.toLocaleString() }));
      bits.push(c.status === 'open'
        ? T('case.closes', 'closes {v0}', { v0: new Date(c.closesAt).toLocaleString() })
        : T('case.resolved', 'resolved'));
      $('meta').textContent = bits.join(' · ');
      $('flags').innerHTML = c.flags.map((f) =>
        `<div class="flag"><b>${esc(f.type)}</b> — ${esc(f.detail.summary || '')}<br>
         <span class="note">${esc(f.detail.reason || '')}</span></div>`).join('');
      $('evidence').innerHTML = c.submissions.map((s) => `
        <h3>${esc(s.locationVerified
          ? T('case.report-heading-verified', 'Report #{v0} · {v1} · location verified ✅', { v0: s.id, v1: new Date(s.capturedAt).toLocaleString() })
          : T('case.report-heading-unverified', 'Report #{v0} · {v1} · location unverified', { v0: s.id, v1: new Date(s.capturedAt).toLocaleString() }))}</h3>
        <div class="ev">
          ${s.photoOnDevice || !s.sheetUrl
            // D1 hash-only report: the hash is on the ledger, the photo stayed on the observer's phone.
            ? `<div><div class="cap">${esc(T('case.photo-kept-on-observer-phone', "Photo kept on the observer's phone. The report is on the ledger."))}</div></div>`
            : `<div><a href="${safeUrl(s.sheetUrl)}" target="_blank" rel="noopener"><img loading="lazy" src="${safeUrl(s.sheetUrl)}" alt="${esc(T('dashboard.result-sheet-photo', 'Result sheet photo'))}"></a><div class="cap">${esc(T('case.result-sheet-tap', 'Result sheet (tap to open full size)'))}</div></div>`}
        </div>
        <table><thead><tr><th>${esc(T('results.party', 'Party'))}</th><th>${esc(T('case.reported-count', 'Reported Count'))}</th></tr></thead><tbody>
          ${s.votes.filter((v) => v.count > 0).map((v) => `<tr><td>${esc(v.party)}</td><td>${v.count.toLocaleString()}</td></tr>`).join('') || `<tr><td colspan="2">${esc(T('case.all-zeros', 'all zeros'))}</td></tr>`}
        </tbody></table>
        ${s.vision?.counts ? `<p class="note">${T('case.ai-read-back', 'AI read-back from the sheet: {v0} <em>(advisory)</em>', { v0: s.vision.counts.map((x) => `${esc(x.party)} ${x.count}`).join(', ') })}</p>` : ''}
        ${s.ocr ? `<p class="note">${esc(T('case.ocr-found', 'OCR: {v0}/{v1} typed counts found on the sheet.', { v0: s.ocr.matched, v1: s.ocr.total }))}</p>` : ''}
        <p class="mono">${T('case.ledger-entry-line', 'ledger entry {v0} — re-verify the whole chain on <a href="ledger.html">the ledger page</a>.', { v0: esc(s.entryHash) })}</p>`).join('<hr>');
      paintTally();
      const noted = (c.verdicts || []).filter((v) => v.comment);
      $('notes').innerHTML = noted.length
        ? `<h3>${esc(T('case.what-jurors-noted', 'What Jurors Noted'))}</h3>` + noted.map((v) =>
          `<p class="note">${T('case.juror-note', '“{v0}” — observer #{v1}, judged <b>{v2}</b>, {v3}',
            { v0: esc(v.comment), v1: esc(v.observer), v2: esc(verdictWord(v.verdict)), v3: esc(new Date(v.at).toLocaleString()) })}</p>`).join('')
        : '';
      paintJudge();
    }

    async function judgeUi(c) {
      if (c.status === 'open' && token) {
        MINE = await fetch(`/api/docket/${qid}/mine`, { headers: { authorization: `Bearer ${token}` } }).then((r) => r.json()).catch(() => ({}));
      }
      paintJudge();
    }

    /* The line under the button. A value may be a function, so a verdict word
       is resolved in the language of the paint, not of the moment it came back. */
    const msgText = () => (MSG
      ? T(MSG.k, MSG.en, Object.fromEntries(Object.entries(MSG.p || {}).map(([a, b]) => [a, typeof b === 'function' ? b() : b])))
      : '');

    function paintJudge() {
      const c = CASE;
      if (!c || c.missing) return;
      const box = $('judge');
      if (c.status !== 'open') { box.innerHTML = `<p class="note">${esc(T('case.closed', 'This case is closed. The record above is permanent.'))}</p>`; return; }
      if (!token) {
        box.innerHTML = `<p>${esc(T('case.only-verified-can-judge', 'Only verified observers can judge — one verdict per person, on the public record.'))} <a href="observe.html">${esc(T('common.become-an-observer', 'Become an observer →'))}</a></p>`;
        return;
      }
      if (!MINE) return; // /mine has not answered yet; judgeUi paints again when it does
      if (MINE.verdict) {
        box.innerHTML = `<p class="note">${T('case.you-judged', 'You judged this case: <b>{v0}</b>. One verdict per person.', { v0: esc(verdictWord(MINE.verdict)) })}</p>`;
        return;
      }
      // A language change repaints the form: keep what the juror has answered.
      const kept = {};
      for (const el of box.querySelectorAll('input[type="radio"]:checked')) kept[el.name] = el.value;
      const note = $('comment') ? $('comment').value : '';
      const q = (name, text) => `<div class="q"><p>${text}</p>
        <label><input type="radio" name="${name}" value="yes"> ${esc(T('case.yes', 'Yes'))}</label>
        <label><input type="radio" name="${name}" value="no"> ${esc(T('case.no', 'No'))}</label>
        <label><input type="radio" name="${name}" value="unsure"> ${esc(T('case.cant-tell', "Can't Tell"))}</label></div>`;
      // One question PER flag — each can be wrong (or right) in its own way.
      const flagQs = c.flags.map((f, i) =>
        q(`flag_${f.id}`, T('case.q-flag', '{v0}. This result was flagged: <em>“{v1}”</em>. Looking at the evidence yourself, is that specific reason correct?',
          { v0: `3${c.flags.length > 1 ? String.fromCharCode(97 + i) : ''}`, v1: esc(f.detail.summary || f.type) }))).join('');
      box.innerHTML =
        q('sheet', esc(T('case.q-sheet', '1. Is the photographed sheet an official INEC EC8A result form?')))
        + q('counts', esc(T('case.q-counts', '2. Do the figures written on the sheet match the reported counts above?')))
        + flagQs
        + `<div class="q"><p>${esc(T('case.optional-note', 'Optional note — what did you see? (public, max 280 chars)'))}</p>`
        + `<textarea id="comment" maxlength="280" rows="2" placeholder="${esc(T('case.note-placeholder', 'e.g. the INEC stamp is missing; figures column reads 108 not 180'))}"></textarea></div>`
        + `<button id="cast">${esc(T('case.cast-my-verdict', 'Cast my verdict'))}</button><p class="note" id="msg"></p>`
        + `<p class="note">${esc(T('case.answers-compute', 'Your answers compute the verdict by a published rule — you never pick a side directly. Notes are public but never counted.'))}</p>`;
      for (const [n, v] of Object.entries(kept)) {
        const el = box.querySelector(`input[name="${n}"][value="${v}"]`);
        if (el) el.checked = true;
      }
      $('comment').value = note;
      $('msg').textContent = msgText();
      if (DONE) box.querySelectorAll('input,button').forEach((el) => { el.disabled = true; });
      const say = (k, en, p) => { MSG = { k, en, p }; $('msg').textContent = msgText(); };
      $('cast').onclick = async () => {
        const val = (n) => document.querySelector(`input[name="${n}"]:checked`)?.value;
        const flags = {};
        for (const f of c.flags) { flags[f.id] = val(`flag_${f.id}`); }
        const body = { sheet: val('sheet'), counts: val('counts'), flags, comment: $('comment').value.trim() };
        if (!body.sheet || !body.counts || Object.values(flags).some((v) => !v)) { say('case.answer-every-question', 'Answer every question.'); return; }
        $('cast').disabled = true;
        const r = await fetch(`/api/docket/${qid}/verdict`, {
          method: 'POST',
          headers: { 'content-type': 'application/json', authorization: `Bearer ${token}`, 'x-device-id': await getDeviceId() },
          body: JSON.stringify(body),
        }).then((x) => x.json()).catch(() => ({ error: 'network' }));
        if (r.ok) {
          DONE = true;
          say('case.recorded-verdict', 'Recorded — computed verdict: {v0}.', { v0: () => verdictWord(r.verdict) });
          tally(r.tally);
          $('judge').querySelectorAll('input,button').forEach((el) => { el.disabled = true; });
        } else {
          if (r.error === 'already_judged') say('case.already-judged', 'You already judged this case.');
          else say('case.could-not-record', 'Could not record ({v0}).', { v0: r.error || 'error' });
          $('cast').disabled = false;
        }
      };
    }
    document.addEventListener('hawkeye-lang', paint);
    load();
  </script>
  <script src="/i18n.js?v=10"></script>
  <script src="/lang.js?v=9"></script>
  <script src="menu.js?v=190"></script>
  <script src="shell.js?v=2" defer></script>
</body>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#00482b" />
  <title data-i18n="my-groups.title">Hawkeye — My Groups</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg?v=101" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <script>/*hk-theme-init*/(function(){try{var t=localStorage.getItem("hawkeye_theme");if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";}document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme="dark";}})();</script>
  <link rel="stylesheet" href="styles.css?v=199" />
  <script src="native.js?v=126"></script>
  <script src="dialog.js?v=1"></script>
  <script src="/monitor.js?v=3" defer></script>
  <meta name="robots" content="noindex" />
  <script src="authgate.js?v=6"></script>
<style>
.mg { max-width: 560px; margin: 0 auto; padding: 28px 18px 64px; }
.mg button { display: inline-block; width: auto; margin: 0; box-shadow: none; }
.mg button:hover { filter: none; }
.mg h1 { font-family: var(--display); font-size: 1.3rem; margin: 0 0 6px; letter-spacing: -0.01em; }
.mg .lede { color: var(--muted); font-size: 0.88rem; line-height: 1.55; margin: 0 0 22px; }
.mg .g { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 17px; margin-bottom: 12px; }
.mg .g h2 { font-size: 1rem; margin: 0 0 2px; font-family: var(--display); }
.mg .g .sub { color: var(--muted); font-size: 0.78rem; }
.mg .unit { margin: 13px 0 0; padding: 11px 12px; background: var(--bg); border-radius: 9px; border: 1px solid var(--line); }
.mg .unit .lab { color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; }
.mg .unit .nm { font-weight: 600; font-size: 0.92rem; margin-top: 2px; }
.mg .unit .cd { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.76rem; color: var(--muted); }
.mg .acts { display: flex; gap: 8px; margin-top: 13px; flex-wrap: wrap; }
.mg .g.ask { border-left: 3px solid var(--accent); }
.mg .g.ask .fine { font-size: 0.82rem; color: var(--muted); line-height: 1.45; margin: 8px 0 0; }
.mg .btn.go { background: var(--accent); color: var(--on-accent); border-color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; font-weight: 600; }
.mg .btn { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; min-height: 44px; font: inherit; font-size: 0.82rem; cursor: pointer; }   /* 44px: was 34 (audit X7) */
.mg .btn:hover { border-color: var(--accent); }
.mg .btn.warn:hover { border-color: #c4463a; color: #c4463a; }
.mg .declined { color: var(--muted); font-size: 0.8rem; margin-top: 9px; }
.mg .none { text-align: center; padding: 40px 16px; color: var(--muted); font-size: 0.9rem; line-height: 1.6; }
/* `.mg button` above resets display and margin for the page's own buttons, and
   at (0,1,1) it outranks styles.css's `.info-i` — whose box, centring and gap
   from the text are what make the dot a circle. Put those three back. */
.mg .info-i { display: inline-flex; width: 20px; margin: 0 0 0 6px; }
.mg .paste { margin-top: 22px; }
.mg .paste input { display: block; width: 100%; box-sizing: border-box; margin: 11px 0 0; padding: 10px 12px; min-height: 44px;
  background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 9px; font: inherit; font-size: 0.88rem; }
.mg .paste .bad-link { color: #c4463a; font-size: 0.8rem; margin: 8px 0 0; }
</style>
</head>
<body>
  <header class="gov-header">
    <div class="wrap brand-row">
      <a class="brand" href="index.html">
        <span class="crest" aria-hidden="true"><img src="logo.svg?v=101" alt="" width="30" height="30" style="display:block" /></span>
        <div class="brand-text"><strong>HAWKEYE</strong><span data-i18n="my-groups.your-groups">My Groups</span></div>
      </a>
    </div>
  </header>

  <main class="mg" id="mg"><div class="hk-skel-page" role="status" aria-busy="true"><span class="sr-only" data-i18n="index.loading">Loading…</span><span class="hk-skel card"></span><span class="hk-skel card"></span></div></main>

<script src="/i18n.js?v=10"></script>
<script>
/**
 * The observer's side of a group membership.
 *
 * This page exists because join.html PROMISES it. The consent notice there says
 * a suggested unit can be declined and that a membership can be left; a promise
 * with no screen behind it is the worst kind of untrue, because it reads as
 * handled in review. Every verb offered at consent time is offered here.
 *
 * Its own page rather than a section of profile.html, which is fully keyed and
 * translated — an English block inside a Hausa profile is worse than an English
 * page. It joins the i18n tranche with situation-room.html and join.html.
 */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'content-type': 'application/json', authorization: 'Bearer ' + (localStorage.getItem('hawkeye_token') || ''), ...(opts.headers || {}) },
  });
  const body = await res.json().catch(() => ({}));
  /* Only our server refusing the token ends the session, and the refused token
     is DROPPED (as situation-room.html does): kept, observe.html read it as
     signed in and sent the observer straight back here, to another 401 — a
     loop of 8-9 page loads a second that never showed the sign-in form. */
  if (window.HAWKEYE && window.HAWKEYE.authRejected ? window.HAWKEYE.authRejected(res.status, body) : res.status === 401) {
    try { localStorage.removeItem('hawkeye_token'); } catch { /* storage blocked */ }
    location.replace('observe.html?intent=signin&next=my-groups.html');
    throw new Error('signed out');
  }
  return { status: res.status, body };
}

/* Painted by script, so every string goes through T() and the page REPAINTS on
   'hawkeye-lang' — i18n.js fires that after every bundle load, including the
   one that lands after the first paint. */
const T = (k, en, vars) => {
  let s = window.HawkeyeI18n ? window.HawkeyeI18n.t(k, en) : en;
  for (const [a, b] of Object.entries(vars || {})) s = s.split('{' + a + '}').join(b);
  return s;
};
let repaint = () => {};
/* ON `document`, NOT `window` — i18n.js dispatches a non-bubbling CustomEvent
   there, so a window listener never hears it. See join.html. */
document.addEventListener('hawkeye-lang', () => repaint());

let GROUPS = [];

async function load() {
  const { status, body } = await api('/api/groups');
  // A 5xx or a proxy's HTML 502 is not "you have no groups": throw to the
  // failure card below instead of telling a member they belong to nothing.
  if (status !== 200) throw new Error('groups ' + status);
  GROUPS = (body && body.member) || [];
  repaint = render;
  render();
}

function render() {
  if (!GROUPS.length) {
    $('mg').innerHTML = `<h1>${T('my-groups.your-groups', 'My Groups')}</h1>
      <p class="none">${T('my-groups.none', 'You have not joined any campaign or observer group.<br />You do not need one — you can report on your own, exactly as you do now.')}</p>
      ${pasteBox()}`;
    bindPaste();
    return;
  }
  $('mg').innerHTML = `
    <h1>${T('my-groups.your-groups', 'My Groups')}</h1>
    <p class="lede">${T('my-groups.lede-short', 'Groups see reports you filed since you joined them.')}<button type="button" class="info-i" id="mg-about" aria-label="${esc(T('common.more-information', 'More information'))}"></button></p>
    ${GROUPS.map(card).join('')}
    ${pasteBox()}`;
  /* THE ROOM IS ON THE LIVE SITE, NOT IN THE APP. Hawkeye Lite strips
     situation-room.html from its bundle (mobile/scripts/strip_web_assets.sh),
     and a root-relative /room/<slug> resolved INSIDE the shell
     (https://localhost/room/…), where nothing answers — native.js rewrites
     only img/video/source, and only on nodes added directly, never an anchor
     inside a card. Absolute here, so the shell hands it to the browser. The
     markup keeps href="/room/…": the strip script's gate looks for exactly that. */
  if (window.HAWKEYE && window.HAWKEYE.native) {
    const live = window.HAWKEYE_LIVE_ORIGIN || 'https://hawkeye.com.ng';
    document.querySelectorAll('#mg a[href^="/room/"]').forEach((a) => { a.href = live + a.getAttribute('href'); });
  }
  $('mg-about').addEventListener('click', about);
  document.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => act(b)));
  bindPaste();
}

/**
 * JOIN FROM A PASTED LINK — the native My Groups' box, ported (app/my-groups.tsx).
 *
 * An invite normally opens by itself. When it did not — a messenger rewrote
 * the link, or it opened the website in a browser instead of Hawkeye Lite —
 * Lite has no address bar to paste it into, so the only way in was a browser:
 * a separate, signed-out session. Same token rules as native's inviteToken()
 * (lib/web-routes.ts): the whole link, the join.html?t= form, or the bare token.
 */
const TOKEN = /^[A-Za-z0-9_-]{16,64}$/;
let LINK = '';
let LINK_BAD = false;
function inviteToken(text) {
  const s = String(text || '').trim();
  if (TOKEN.test(s)) return s;
  let own;
  const m = /^([a-z][a-z0-9+.-]*):\/\/([^/?#]*)(.*)$/i.exec(s);
  if (!m) own = s.replace(/^(?:www\.)?hawkeye\.com\.ng(?=[/?]|$)/i, '').replace(/^\/+/, '');
  else if (/^https?$/i.test(m[1])) {
    if (!/^(?:www\.)?hawkeye\.com\.ng$/i.test(m[2])) return null;
    own = m[3].replace(/^\/+/, '');
  } else if (/^hawkeye$/i.test(m[1])) own = (m[2] + m[3]).replace(/^\/+/, '');
  else return null;
  const [pathPart, query = ''] = own.split('#')[0].split('?');
  const p = pathPart.replace(/\/+$/, '');
  const j = /^join\/([^/]+)$/i.exec(p);
  if (j) return TOKEN.test(j[1]) ? j[1] : null;
  if (p.toLowerCase() !== 'join.html') return null;
  let tok = '';
  try { tok = decodeURIComponent((/(?:^|&)t=([^&]+)/.exec(query) || [])[1] || ''); } catch (e) { tok = ''; }
  return TOKEN.test(tok) ? tok : null;
}
function pasteBox() {
  return `<form class="g paste" id="mg-paste" novalidate>
    <h2>${T('my-groups.have-link', 'Have an invite link?')}</h2>
    <div class="sub">${T('my-groups.have-link-sub', 'Paste the link a campaign or observer group sent you.')}</div>
    <input id="mg-link" type="text" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false"
      value="${esc(LINK)}" placeholder="https://hawkeye.com.ng/join/…" aria-label="${esc(T('my-groups.have-link', 'Have an invite link?'))}" />
    ${LINK_BAD ? `<p class="bad-link" role="alert">${T('my-groups.bad-link', 'That is not a Hawkeye invite link. Copy the whole link and try again.')}</p>` : ''}
    <div class="acts"><button class="btn go" type="submit">${T('my-groups.open-link', 'Open invite')}</button></div>
  </form>`;
}
function bindPaste() {
  const f = $('mg-paste');
  if (!f) return;
  $('mg-link').addEventListener('input', (e) => { LINK = e.target.value; });
  f.addEventListener('submit', (e) => {
    e.preventDefault();
    const tok = inviteToken($('mg-link').value);
    if (!tok) { LINK_BAD = true; LINK = $('mg-link').value; repaint(); $('mg-link').focus(); return; }
    LINK_BAD = false;
    LINK = '';
    // The query form: it is a bundled page in Lite, and the form sign-in hands back.
    location.href = 'join.html?t=' + encodeURIComponent(tok);
  });
}

/* THE RACE BY ITS NAME, not its code ("GOV · Lagos") — the same map join.html
   uses, over the contest.* keys situation-room.html already has. */
const CONTEST = {
  PRES: ['contest.presidential', 'Presidential'],
  SEN: ['contest.senate', 'Senate'],
  REP: ['contest.house-of-representatives', 'House of Representatives'],
  GOV: ['contest.governorship', 'Governorship'],
  SHA: ['contest.state-house-of-assembly', 'State House of Assembly'],
};
function contestName(code) {
  const c = String(code || '');
  if (CONTEST[c]) return T(CONTEST[c][0], CONTEST[c][1]);
  const bye = c.match(/^([A-Z]+)_BYE_/);
  if (bye && CONTEST[bye[1]]) return T('contest.by-election', '{v0} By-Election', { v0: contestName(bye[1]), v1: '' });
  return c;
}

/* ONE LINE, AND THE REST BEHIND THE ⓘ. The page used to open with two sentences
   on what a group can see and close with a third paragraph on where you may
   report from; neither is an instruction, so both now live in this one modal
   (the info-dot rule — see infoDots() in app/menu.js). Their keys are reused
   unchanged, so every language keeps its reviewed wording. hkAlert (dialog.js)
   rather than menu.js's info modal because this page never loads menu.js; its
   message keeps the blank line as a paragraph break (white-space: pre-line). */
function about() {
  hkAlert(T('my-groups.lede', 'These groups can see the reports you have filed since you joined them. They cannot see anything the public cannot, and they cannot change how your reports are checked or counted.')
    + '\n\n' + T('my-groups.note', 'Being in a group never limits where you can report from. If you are sent somewhere else on the day, report from where you actually are — that report still counts, and your group will see where it came from.'),
  { title: T('my-groups.your-groups', 'My Groups'), ok: T('common.close', 'Close') });
}

function card(g) {
  const kind = g.kind === 'cso' ? T('my-groups.kind-cso', 'Observer group') : T('my-groups.kind-campaign', 'Campaign');
  /* ASKED, NOT JOINED. A campaign copied this person over from another roster
     of theirs, or imported a shared one. Nothing about them has reached that
     campaign yet and nothing will until they answer here — so this card is a
     question, not a membership, and it does not offer the things a membership
     offers (the room, leaving, declining a unit they have not been given). */
  if (g.member_state === 'invited') return inviteCard(g, kind);
  const role = g.manages === 'owner' ? T('my-groups.you-own', 'You own this group — open the situation room above.')
    : g.manages === 'coordinator' ? T('my-groups.you-coordinate', 'You coordinate an area of this group — open the situation room above.')
      : T('my-groups.you-manage', 'You manage this group — open the situation room above.');
  const declined = g.assign_state === 'declined';
  /* Linked for EVERY member now, not only managers. The room used to refuse
     anyone without a role, so a link would have been a dead end; it now opens
     read-only for the people on the roster, which is the screen they most need
     — it is where they can see whether the campaign they joined is actually
     covering the race. */
  const title = `<a href="/room/${esc(g.slug || '')}" style="color:var(--link)">${esc(g.name)}</a>`;
  return `<div class="g">
    <h2>${title}</h2>
    <div class="sub">${esc(kind)} &middot; ${esc(contestName(g.contest))}${g.scope ? ' &middot; ' + esc(g.scope_label || g.scope) : ''}</div>
    ${g.manages ? `<div class="sub" style="margin-top:3px">${role}</div>` : ''}
    ${g.assigned_pu ? `<div class="unit">
      <div class="lab">${declined ? T('my-groups.unit-declined', 'Unit you declined') : T('my-groups.unit-assigned', 'Unit they have you down for')}</div>
      <div class="nm">${esc(g.assigned_name || T('race.polling-unit', 'Polling unit'))}</div>
      <div class="cd">${esc(g.assigned_pu)}${g.assigned_ward ? ' &middot; ' + esc(g.assigned_ward) : ''}${g.assigned_lga ? ' &middot; ' + esc(g.assigned_lga) : ''}</div>
    </div>` : `<div class="declined">${T('my-groups.no-unit', 'They have not given you a polling unit.')}</div>`}
    ${declined ? `<div class="declined">${T('my-groups.declined-note', 'You told them this is not where you will be. They can suggest another one.')}</div>` : ''}
    <div class="acts">
      ${/* A HIGHLIGHTED HEADING IS NOT A BUTTON: the room was reachable only by
           tapping the campaign name, and a coloured heading reads as a heading,
           so people who had access never found the room they had access to. */''}<a class="btn go" href="/room/${esc(g.slug || '')}">${T('my-groups.open-room', 'Open situation room')}</a>
      ${g.assigned_pu && !declined ? `<button class="btn" data-act="decline" data-gid="${g.id}" data-name="${esc(g.name)}">${T('my-groups.not-where', 'That is not where I will be')}</button>` : ''}
      <button class="btn warn" data-act="leave" data-gid="${g.id}" data-name="${esc(g.name)}">${T('my-groups.leave', 'Leave this group')}</button>
    </div>
  </div>`;
}

function inviteCard(g, kind) {
  return `<div class="g ask">
    <h2>${esc(g.name)}</h2>
    <div class="sub">${esc(kind)} &middot; ${esc(contestName(g.contest))}${g.scope ? ' &middot; ' + esc(g.scope_label || g.scope) : ''}</div>
    <div class="sub" style="margin-top:6px">${T('my-groups.invited-lede',
    'They have asked you to observe with them.')}</div>
    <p class="fine">${T('my-groups.invited-body',
    'They cannot see you or your reports unless you accept. Accepting tells them which of your published reports are yours, from now on — nothing before today, and nothing the public cannot already see.')}</p>
    <div class="acts">
      <button class="btn go" data-act="accept" data-gid="${g.id}">${T('my-groups.accept', 'Accept')}</button>
      <button class="btn" data-act="refuse" data-gid="${g.id}" data-name="${esc(g.name)}">${T('my-groups.no-thanks', 'No thanks')}</button>
    </div>
  </div>`;
}

async function act(b) {
  const gid = b.dataset.gid;
  const verb = b.dataset.act;
  const name = { name: b.dataset.name };
  /* Asked BEFORE anything is sent, and outside the busy window below. */
  /* Refusing REMOVES the row rather than marking it refused: a campaign that
     could keep a list of the people who said no would have been handed exactly
     the fact the person withheld. Same endpoint as leaving, for that reason. */
  if (verb === 'refuse' && !(await hkConfirm(T('my-groups.refuse-confirm', 'Tell {name} no? They will not be told who declined, and they can ask again later.', name), { ok: T('my-groups.no-thanks', 'No thanks') }))) return;
  /* CONFIRMED, because there is no way back from here: the member has no
     "un-decline" (the coordinator reassigns), so a mis-tap left them marked
     declined until somebody noticed. */
  if (verb === 'decline' && !(await hkConfirm(T('my-groups.decline-confirm', 'Tell {name} you will not be at this unit? They can suggest another one. You cannot undo this here.', name), { ok: T('my-groups.decline-ok', 'Decline this unit') }))) return;
  /* Confirmed, because leaving is not reversible from here — the invite link
     may be spent, revoked, or simply not to hand any more. */
  if (verb === 'leave' && !(await hkConfirm(T('my-groups.leave-confirm', 'Leave {name}? They will stop seeing which reports are yours. You will need a fresh invite to rejoin.', name), { ok: T('my-groups.leave', 'Leave this group'), danger: true }))) return;

  const req = verb === 'accept' ? ['/accept', 'POST', 'my-groups.accept-failed', 'Could not accept just now.']
    : verb === 'decline' ? ['/decline', 'POST', 'my-groups.send-failed', 'Could not send that just now.']
      : verb === 'refuse' ? ['/membership', 'DELETE', 'my-groups.refuse-failed', 'Could not do that just now.']
        : ['/membership', 'DELETE', 'my-groups.leave-failed', 'Could not leave just now.'];
  /* ONE REQUEST AT A TIME. With no busy state a double tap on Accept sent two
     POSTs; the second met 404 nothing_to_accept and said "Could not accept"
     while the list showed them accepted. */
  const btns = [...document.querySelectorAll('[data-act]')];
  btns.forEach((x) => { x.disabled = true; });
  let status = 0;
  let body = {};
  try {
    ({ status, body } = await api('/api/groups/' + gid + req[0], { method: req[1] }));
  } catch (e) {
    // api() is already on its way to the sign-in form: say nothing over it.
    if (e && e.message === 'signed out') return;
    /* NO SIGNAL. The fetch rejects, and with no catch the tap looked ignored —
       no dialog, the card unchanged. status 0 says so below. */
  }
  btns.forEach((x) => { x.disabled = false; });
  // 409 on accept: the room's party label is still being verified — it admits nobody yet.
  if (verb === 'accept' && status === 409) return void hkAlert(T('join.held-body', 'It is not accepting observers yet. Try the link again later, or ask whoever sent it.'));
  // Already accepted (a tap that got through before this one): that is done, not failed.
  const done = status === 200 || (verb === 'accept' && status === 404 && body && body.error === 'nothing_to_accept');
  if (!done) {
    return void hkAlert(T(req[2], req[3])
      + (status === 0 ? ' ' + T('my-groups.check-connection', 'Check your connection and try again.') : ''));
  }
  /* The change is made; a list that cannot be re-read right now is stale, not
     failed — the next visit shows it. */
  await load().catch(() => {});
}

/* THE WAY BACK, IN THE APP. menu.js gives every non-tab page in the app shell a
   close (x) that goes back — an iPhone gives a web view no back gesture — but
   this page never loads menu.js, so in Hawkeye Lite it had no way out at all.
   This is that same control wired by hand, the way situation-room.html wires
   the language button: same classes (so .theme-btn's box and header colours),
   same glyph, same key, same rule — app shell only, the website is unchanged —
   and the same fallback, because a deep link or a cold start has nothing for
   history.back() to go back TO. Native's twin is ScreenHeader's onClose. */
(function closeButton() {
  const shell = !!(window.HAWKEYE && window.HAWKEYE.native)
    || window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  const row = document.querySelector('.gov-header .brand-row');
  if (!shell || !row || row.querySelector('.close-btn')) return;
  const cb = document.createElement('button');
  cb.type = 'button';
  cb.className = 'theme-btn close-btn';
  cb.setAttribute('data-i18n-attr', 'aria-label:nav.close-and-go-back');
  cb.setAttribute('aria-label', T('nav.close-and-go-back', 'Close and go back'));
  cb.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  cb.addEventListener('click', () => {
    if (window.history.length > 1) window.history.back();
    else location.href = 'index.html';
  });
  row.appendChild(cb);
})();

load().catch(() => {
  // A way back in (design audit X9): the same offline card as every page.
  repaint = () => {
    $('mg').innerHTML = `<div class="hk-offline" role="status"><span>${T('my-groups.load-failed', 'Could not load your groups. Check your connection and try again.')}</span><button type="button" id="mg-retry">${T('common.try-again', 'Try again')}</button></div>`;
    $('mg-retry').onclick = () => location.reload();
  };
  repaint();
});
</script>
  <script src="shell.js?v=2" defer></script>
</body>
</html>

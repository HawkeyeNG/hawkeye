# CodeQL — GitHub's own static analysis, free on public repositories.
#
# WHY THIS EXISTS. The Secure Open Source Fund application (submitted
# 2026-09-17) listed secret scanning, push protection and private vulnerability
# reporting as enabled, and code scanning as absent. Secret scanning finds
# credentials that were committed; it says nothing about the code. CodeQL is the
# part that reads the source, and it is the tool GitHub Security Lab itself uses
# — so an open-source security application with no code scanning is arguing for
# support it has not taken for free.
#
# LANGUAGES. javascript-typescript covers app/ (the site and Lite's bundle),
# native/src and scripts/; python covers the tooling under scripts/ and tmp/;
# actions lints these workflows themselves, which matters because they hold the
# signing and publishing steps. The Kotlin and Swift under native/android and
# native/ios are generated by `expo prebuild` on every build, so scanning them
# reports on code nobody edits — left out deliberately, not overlooked.
#
# build-mode none: none of these need compiling for CodeQL to read them, and a
# build here would drag in the whole Gradle/CocoaPods chain for no extra finding.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, because a dependency's newly-disclosed pattern can make existing
    # code vulnerable without anyone touching it. Sunday 03:17 UTC — off the
    # hour, so it does not pile into GitHub's busiest scheduling minute.
    - cron: '17 3 * * 0'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write     # REQUIRED: this is what uploads the results
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false           # one language failing must not hide the others
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended adds the lower-severity and less-certain queries.
          # For a project whose whole claim is that its results can be trusted,
          # the extra noise is worth reading once.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

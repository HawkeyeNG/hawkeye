const STATUS = {
  /* The KEY travels beside the English, and the render site resolves it. This
     object is built once at import — before the stored language is known — so
     a T() call here would freeze in English however often the page repaints. */
  /* Four of these reuse the column-header keys: the same word, translated once.
     The render site resolves wordKey, so the extractor cannot see these pairs —
     they are catalogued by hand (scripts/i18n/batches/room_status_catalogue.json). */
  on_unit:             { cls: 'ok',   glyph: '&#9679;', word: 'On unit',   wordKey: 'situation-room.on-unit',          rank: 3 },
  mismatch:            { cls: 'off',  glyph: '&#9670;', word: 'Elsewhere', wordKey: 'situation-room.elsewhere',        rank: 1 },
  reported_unassigned: { cls: 'off',  glyph: '&#9670;', word: 'Reported',  wordKey: 'situation-room.reported',         rank: 2 },
  silent:              { cls: 'wait', glyph: '&#9632;', word: 'Silent',    wordKey: 'situation-room.silent',           rank: 0 },
  declined:            { cls: 'idle', glyph: '&#9633;', word: 'Declined',  wordKey: 'situation-room.status-declined',  rank: 4 },
  unassigned:          { cls: 'idle', glyph: '&#9633;', word: 'No unit',   wordKey: 'situation-room.status-no-unit',   rank: 5 },
};

function renderTeam() {
  const t = S.team || { members: [] };
  const ms = t.members.slice().sort((a, b) =>
    (STATUS[a.status].rank - STATUS[b.status].rank) || (a.joined_at - b.joined_at));
  const count = (s) => t.members.filter((m) => m.status === s).length;
  const proposed = t.members.filter((m) => m.assign_state === 'proposed').length;

  $('sr-body').innerHTML = `
    <div class="sr-heads">
      <div class="sr-head"><b class="num">${n(t.members.length)}</b><span>${T('situation-room.observers', 'Observers')}</span></div>
      <div class="sr-head ok"><b class="num">${n(count('on_unit'))}</b><span>${T('situation-room.on-their-unit', 'On their unit')}</span></div>
      <div class="sr-head off"><b class="num">${n(count('mismatch') + count('reported_unassigned'))}</b><span>${T('situation-room.reported-elsewhere', 'Reported elsewhere')}</span></div>
      <div class="sr-head wait"><b class="num">${n(count('silent'))}</b><span>${T('situation-room.yet-to-report', 'Yet to report')}</span></div>
      <div class="sr-head"><b class="num">${n(count('unassigned') + count('declined'))}</b><span>${T('situation-room.no-unit-set', 'No unit set')}</span></div>
    </div>
    ${rosterToolsHtml()}
    ${iManage() ? '' : `<div class="sr-note">
      <strong>${T('situation-room.read-only-title', "You are on this campaign’s roster.")}</strong>
      ${T('situation-room.read-only-body', "This is the campaign’s own view of the race. You can read everything here; only its managers can change anything in it.")}
    </div>`}
    ${managersHtml()}
    ${(() => {
      /* Pointed out ONCE at the top, not only per row: in a roster of hundreds a
         marker on row 214 is not pointing anything out. */
      const doubled = new Set(t.members.filter((m) => m.shared && m.assigned).map((m) => m.assigned.pu_code));
      return doubled.size ? `<div class="sr-note" style="border-left-color:var(--wait)">
        ${doubled.size === 1
    ? T('situation-room.doubled-one', '<strong>{n} unit has more than one observer down for it.</strong>', { n: n(doubled.size) })
    : T('situation-room.doubled-many', '<strong>{n} units have more than one observer down for it.</strong>', { n: n(doubled.size) })}
        ${T('situation-room.doubled-note', 'One unit covered twice usually means another unit is not covered at all. They are marked &#9650; below — use <em>{change}</em> to move someone, if you see fit.', { change: T('situation-room.change-unit', 'Change unit') })}</div>` : '';
    })()}
    ${proposed && iManage() ? `<div class="sr-bar" style="border:0;padding:0 0 10px">
      <span class="meta">${proposed === 1
    ? T('situation-room.proposed-one', "{v0} observer joined with a unit already saved.", { v0: n(proposed) })
    : T('situation-room.proposed-many', "{v0} observers joined with a unit already saved.", { v0: n(proposed) })}</span>
      <div class="spacer"></div>
      <button class="sr-btn" id="confirm-proposed">${T('situation-room.accept-all', "Accept all {v0}", { v0: n(proposed) })}</button>
    </div>` : ''}
    ${t.members.length ? `
    <div class="sr-wrap"><table class="sr-tbl text">
      <thead><tr><th>${T('profile.observer', 'Observer')}</th><th>${T('race.status', 'Status')}</th><th>${T('situation-room.assigned-unit', 'Assigned unit')}</th><th>${T('situation-room.reported-from', 'Reported from')}</th><th></th></tr></thead>
      <tbody>${ms.map(memberRow).join('')}</tbody>
    </table></div>
    <div class="sr-note">
      <strong>${T('situation-room.a-different-unit-is-a-discrepancy-to', 'A different unit is a discrepancy to explain, not a verdict.')}</strong>
      ${T('situation-room.observers-get-moved',
    'Observers get moved by their own party, turned away at the gate, or sent to a unit that was merged or relocated — and an assignment can simply have been wrong. Ask before you conclude.')}
    </div>` : emptyTeamHtml()}`;

  document.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => runAction(b)));
  if ($('confirm-proposed')) $('confirm-proposed').addEventListener('click', confirmProposed);
  bindRosterTools();
}

async function runAction(b) {
  const id = b.dataset.obs;
  if (b.dataset.act === 'rename') return rename(id);
  if (b.dataset.act === 'promote') return promote(id, b.dataset.name || ('Observer #' + id));
  if (b.dataset.act === 'demote') {
    if (!await ask(T('situation-room.remove-this-manager-they-keep-their-place', 'Remove this manager? They keep their place on the roster as an observer.'))) return;
    const { status, body } = await api('/api/groups/' + S.gid + '/managers/' + id, { method: 'DELETE' });
    if (status !== 200) return alert(roleError(body.error));
    return afterRoleChange();
  }
  if (b.dataset.act === 'remove') return removeObserver(id, b.dataset.name || ('Observer #' + id));
  if (b.dataset.act === 'clear') return assign(id, null);
  if (b.dataset.act === 'move' || b.dataset.act === 'confirm') return assign(id, b.dataset.pu);
  if (b.dataset.act === 'set') {
    const code = await askText(T('situation-room.pu-code-prompt', "Polling unit code for this observer (for example 24-14-01-020):"),
      '', { code: true, placeholder: '24-14-01-020' });
    if (code && code.trim()) assign(id, code.trim());
  }
}

/* One place the server's refusals are turned into sentences, because three
   screens raise the same three of them. */
const roleError = (e) => e === 'owner_only'
  ? T('situation-room.only-the-owner-can-manage', 'Only the owner can change who manages this room.')
  : e === 'above_your_level'
    ? T('situation-room.above-your-level', "That is above the level you can give. You can only appoint coordinators below your own, inside your own area.")
    : e === 'outside_your_scope'
      ? T('situation-room.outside-your-area', "That is outside the area you cover.")
      : e === 'bad_scope'
        ? T('situation-room.bad-area-for-coordinator', "That is not an area a coordinator can be given.")
        : e === 'ambiguous_area'
          ? T('situation-room.ambiguous-area', 'More than one place has that name. Choose its state and local government.')
          : e === 'unknown_area'
            ? T('situation-room.unknown-area', 'That area is not in the register.')
            : T('situation-room.could-not-change-that', "Could not change that.");

/**
 * Take an observer off the roster. Owner only, and it says what survives.
 *
 * Every report they filed stays in the public stream and the ledger and still
 * counts — a campaign removing somebody cannot remove their work from the
 * record of the election, and the person about to do it should be told so in
 * the same breath they are asked to confirm.
 */
async function removeObserver(observerId, who) {
  if (!await ask(T('situation-room.remove-observer-confirm', "Remove {who} from this campaign? Every report they have filed stays in the public record and still counts. They can rejoin with a new invite.", { who }))) return;
  const { status, body } = await api('/api/groups/' + S.gid + '/members/' + observerId, { method: 'DELETE' });
  if (status !== 200) return alert(roleError(body.error));
  S.team = S.coverage = null;
  await loadGroup();
}

/**
 * Rename the campaign.
 *
 * THE ADDRESS DOES NOT MOVE. /room/<slug> has already been pasted into the
 * group chat the campaign runs on, and possibly installed as an app; the name
 * on the header is what changes. Said in the prompt, because a manager who
 * expected the link to follow would go and re-share a link that still works.
 */
async function renameRoom() {
  const g = S.group;
  const name = await askText(T('situation-room.rename-room-prompt', "What should this campaign be called? The room’s address does not change, so links you have already shared keep working."), g.name || '');
  if (name === null) return;
  if (!name.trim()) return;
  const { status, body } = await api('/api/groups/' + S.gid, {
    method: 'PATCH', body: JSON.stringify({ name: name.trim() }),
  });
  if (status !== 200) {
    return alert(body.error === 'owner_only'
      ? T('situation-room.only-owner-can-rename', "Only the owner can rename this room.")
      : T('situation-room.could-not-rename-room', "Could not rename this room."));
  }
  const row = S.groups.find((x) => x.id === S.gid);
  if (row) row.name = body.name;
  await loadGroup();
}

/* Accepting a proposal moves nobody — it is the observer's OWN saved unit — so
   the server sends no notification for it. Telling several hundred people they
   have been assigned to the unit they themselves chose is the notification that
   teaches them to ignore the next one, which will be the one that moved them. */
async function confirmProposed() {
  const { body } = await api('/api/groups/' + S.gid + '/assignments/confirm-proposed', { method: 'POST' });
  S.team = S.coverage = null;
  loadTab(true);
  return body;
}

/**
 * Who manages this room, and over what.
 *
 * The endpoint has returned this list since the first commit and nothing showed
 * it — so a room with four managers looked exactly like a room with one, and
 * the only way to learn who could reassign your observers was to watch it
 * happen. Names come off the roster where the person is also a member; an owner
 * who never joined as an observer has no label, and shows as their id.
 */
/* The three role words are DATA off the API, so they are keyed here rather
   than left to the markup sweep, which never sees them. */
const roleWord = (r) => r === 'owner' ? T('situation-room.role-owner', "owner")
  : r === 'manager' ? T('situation-room.role-manager', "manager")
    : r === 'coordinator' ? T('situation-room.role-coordinator', "coordinator") : esc(r || '');

function managersHtml() {
  const list = (S.group.managers || []);
  if (list.length < 2) return '';
  const label = (o) => {
    const m = (S.team && S.team.members || []).find((x) => x.observer_id === o.observer_id);
    return (m && m.label) || 'Observer #' + o.observer_id;
  };
  return `<div class="sr-card" style="margin-bottom:16px">
    <div class="sr-h2" style="margin:0 0 8px">${T('situation-room.who-manages-this-room', 'Who manages this room')}</div>
    ${list.map((o) => `<div class="sr-act">
      <span class="pill ${o.role === 'owner' ? 'ok' : 'idle'}"><i>&#9679;</i>${roleWord(o.role)}</span>
      <div class="sr-act-t"><b>${esc(label(o))}</b>${o.observer_id === S.group.me_id ? ' &mdash; ' + T('situation-room.you', "you") : ''}
        <span class="sr-sub">${o.scope_value
          ? T('situation-room.manages-area-only', "{area} · manages only observers there, sees the whole race", { area: esc(o.scope_value) })
          : T('situation-room.manages-everything', "the whole race, and everyone in it")}</span></div>
    </div>`).join('')}
  </div>`;
}

/**
 * MOVING PEOPLE BETWEEN CAMPAIGNS, and the consent that governs it.
 *
 * The same person runs the presidential room in January and a governorship room
 * for the same party a month later, and party offices share observers between
 * campaigns as a matter of course. Rebuilding a roster of several hundred by
 * re-sending invites one at a time is not a task anyone finishes, so the roster
 * moves — but the PEOPLE decide.
 *
 * Nobody is ever added. They are INVITED, and until each of them accepts, this
 * campaign cannot see them at all: not their name, not their unit, not which
 * published reports are theirs. That is not a nicety bolted on the side — it is
 * the thing joining a group consents to, and consent given to one campaign is
 * not consent given to the next one. The wording below says so plainly, because
 * a manager who expects several hundred new rows and gets a pending count needs
 * to know that is the feature working.
 */
function rosterToolsHtml() {
  if (!iAmOwner()) return '';
  const pend = (S.group && S.group.pending) || 0;
  /* HIDING THE PICKER WHEN IT WOULD BE EMPTY LOOKED LIKE A MISSING FEATURE.
     An owner whose newest campaign already contains everyone from their other
     ones got no control and no reason — the same screen a bug would produce.
     The rooms are still listed, with the count that makes the case. */
  const all = S.sources || [];
  const srcs = all.filter((x) => x.copyable > 0);
  const nothingToCopy = !srcs.length && all.length;
  return `<div class="sr-card" style="margin-bottom:16px">
    <div class="sr-h2" style="margin:0 0 4px">${T('situation-room.share-observers', "Share observers")}</div>
    <p class="sr-fine" style="margin:0 0 12px">${T('situation-room.share-observers-note', "Everyone you bring over is asked first. Until they accept, they are not on this roster and you cannot see them or their reports.")}</p>
    <div class="sr-tools">
      ${srcs.length ? `<select class="sr-sel" id="copy-from">
        <option value="">${T('situation-room.copy-from-placeholder', "Copy observers from…")}</option>
        ${srcs.map((x) => `<option value="${x.id}">${esc(x.name)} &mdash; ${T('situation-room.n-available', "{v0} available", { v0: n(x.copyable) })}</option>`).join('')}
      </select>
      <button class="sr-btn" id="copy-go">${T('situation-room.invite-them', "Invite them")}</button>
      <div class="spacer"></div>` : ''}
      <button class="sr-btn" id="roster-dl">${T('situation-room.download-roster', "Download roster (CSV)")}</button>
      <button class="sr-btn" id="roster-up">${T('situation-room.import-roster', "Import roster (CSV)")}</button>
      <input type="file" id="roster-file" accept=".csv,text/csv" hidden />
    </div>
    ${nothingToCopy ? `<p class="sr-fine" style="margin:0 0 10px">${all.length === 1
    ? T('situation-room.nothing-to-copy-one', "Everyone in your other campaign ({v0}) is already on this roster.", { v0: esc(all[0].name) })
    : T('situation-room.nothing-to-copy-many', "Everyone in your other campaigns ({v0}) is already on this roster.", { v0: all.map((x) => esc(x.name)).join(', ') })}</p>` : ''}
    ${pend ? `<p class="sr-fine" style="margin:0">${pend === 1
    ? T('situation-room.pending-one', "{v0} person has been asked and has not answered yet.", { v0: n(pend) })
    : T('situation-room.pending-many', "{v0} people have been asked and have not answered yet.", { v0: n(pend) })}</p>` : ''}
  </div>`;
}

/* Bound after every Team repaint, like every other control on this tab. */
function bindRosterTools() {
  if ($('copy-go')) $('copy-go').addEventListener('click', copyMembers);
  if ($('roster-dl')) $('roster-dl').addEventListener('click', downloadRoster);
  if ($('roster-up')) $('roster-up').addEventListener('click', () => $('roster-file').click());
  if ($('roster-file')) $('roster-file').addEventListener('change', importRoster);
}

async function copyMembers() {
  const from = $('copy-from') && $('copy-from').value;
  if (!from) return alert(T('situation-room.pick-a-campaign', "Pick the campaign to bring observers from."));
  const src = (S.sources || []).find((x) => String(x.id) === String(from));
  if (!await ask(T('situation-room.copy-confirm', "Ask everyone on {name} to observe with {target} as well? Each of them decides. Nobody who is already here is asked twice.", { name: (src && src.name) || '', target: S.group.name }))) return;
  const { status, body } = await api('/api/groups/' + S.gid + '/copy-members', {
    method: 'POST', body: JSON.stringify({ from_group_id: Number(from) }),
  });
  if (status !== 200) return alert(roleError(body.error));
  await afterInvite(body.invited);
}

/* The file is built by the SERVER — it is the only side that can mint a share
   code — so this is a plain authenticated fetch turned into a download rather
   than a CSV assembled here from what the page happens to be holding. */
async function downloadRoster() {
  const res = await fetch('/api/groups/' + S.gid + '/roster.csv', {
    headers: { authorization: 'Bearer ' + (localStorage.getItem('hawkeye_token') || '') },
  });
  if (!res.ok) return alert(T('situation-room.could-not-build-roster', "Could not build that roster file."));
  const url = URL.createObjectURL(await res.blob());
  const a = document.createElement('a');
  a.href = url;
  a.download = 'hawkeye-roster-' + (S.group.slug || 'campaign') + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/**
 * Read a roster file and turn it into invitations.
 *
 * Parsed HERE rather than uploaded: all the server needs is the share codes,
 * and posting the whole file would send it the labels one campaign privately
 * wrote about its own people. The column is found by NAME, so a file someone
 * opened in Excel and re-saved with the columns reordered still works.
 */
async function importRoster(e) {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const text = await file.text();
  const rows = text.split(/\r?\n/).filter((l) => l.trim() && !l.startsWith('#'));
  const head = (rows.shift() || '').split(',').map((h) => h.trim().replace(/^"|"$/g, '').toLowerCase());
  let col = head.indexOf('share_code');
  /* A file with no header at all is a column of codes somebody pasted. Treat
     the first line as data rather than refusing — but only if it looks like a
     code, so a mis-picked file does not silently import its first row. */
  if (col < 0) {
    if (/^[0-9A-HJKMNP-TV-Z]{12}$/i.test(head[0] || '')) { rows.unshift(head.join(',')); col = 0; } else {
      return alert(T('situation-room.no-share-code-column', "That file has no share_code column. Use a roster downloaded from Hawkeye."));
    }
  }
  const codes = rows.map((l) => (l.split(',')[col] || '').trim().replace(/^"|"$/g, '')).filter(Boolean);
  if (!codes.length) return alert(T('situation-room.roster-empty', "There are no observers in that file."));
  if (!await ask(codes.length === 1
    ? T('situation-room.import-confirm-one', "Ask {v0} observer from that file to join {target}? They decide.", { v0: n(codes.length), target: S.group.name })
    : T('situation-room.import-confirm-many', "Ask {v0} observers from that file to join {target}? Each of them decides.", { v0: n(codes.length), target: S.group.name }))) return;
  const { status, body } = await api('/api/groups/' + S.gid + '/import-roster', {
    method: 'POST', body: JSON.stringify({ codes }),
  });
  if (status !== 200) return alert(roleError(body.error));
  await afterInvite(body.invited, body.unknown);
}

/* Says what happened, including the nothing-happened cases — "0 invited" with
   no reason is how a manager concludes the feature is broken. */
async function afterInvite(invited, unknown) {
  const bits = [invited === 1
    ? T('situation-room.invited-one', "{v0} person has been asked.", { v0: n(invited) })
    : T('situation-room.invited-many', "{v0} people have been asked.", { v0: n(invited) })];
  if (!invited) bits.push(T('situation-room.nobody-new', "Everyone in that list is already on this roster."));
  if (unknown) bits.push(T('situation-room.unknown-codes', "{v0} row(s) were not recognised and were skipped.", { v0: n(unknown) }));
  bits.push(T('situation-room.asked-note', "They appear here once they accept."));
  alert(bits.join(' '));
  S.team = S.sources = null;
  await loadGroup();
}

function memberRow(m) {
  const s = STATUS[m.status];
  const place = (u) => u ? `${esc(u.name)}<span class="sr-sub num">${esc(u.pu_code)}</span>` : '<span class="z">&mdash;</span>';
  const mismatched = m.status === 'mismatch';
  return `<tr>
    <td>${esc(m.label || 'Observer #' + m.observer_id)}${m.role ? ` <span class="pill idle" style="font-size:.68rem">${roleWord(m.role)}</span>` : ''}${m.label ? `<span class="sr-sub num">#${m.observer_id}</span>` : ''}</td>
    <td><span class="pill ${s.cls}"><i>${s.glyph}</i>${T(s.wordKey, s.word)}</span></td>
    <td>${place(m.assigned)}${m.shared ? `<span class="sr-sub" style="color:var(--wait)">&#9650; ${m.shared === 1
      ? T('situation-room.shared-one', "{v0} other is down for this unit too", { v0: n(m.shared) })
      : T('situation-room.shared-many', "{v0} others are down for this unit too", { v0: n(m.shared) })}</span>` : ''}</td>
    <td>${place(m.reported)}${mismatched ? `<span class="sr-sub" style="color:var(--off)">${T('situation-room.not-the-assigned-unit', 'not the assigned unit')}</span>` : ''}</td>
    <td>${actionsHtml(m)}</td>
  </tr>`;
}

/**
 * The exception queue, one row at a time.
 *
 * ONE contextual action per row, not a menu of five. A manager works this
 * screen at speed on election night; the question a row raises is almost always
 * singular, and offering every verb next to every row is how the right one gets
 * missed.
 *
 * "Move here" is the valuable one and the reason mismatch is a state rather
 * than an error: the observer is demonstrably standing at a unit, so make that
 * their assignment in one tap instead of asking anyone to type a 12-character
 * code for a unit the system already knows.
 */
function actionsHtml(m) {
  /* A reader who manages nothing gets no column of buttons at all, rather than
     a row of controls that answer with a refusal. */
  if (!iManage()) return '';
  const btn = (act, label, extra = '') =>
    `<button class="sr-btn mini" data-act="${act}" data-obs="${m.observer_id}" ${extra}>${label}</button>`;
  let main = '';
  if (m.status === 'mismatch' && m.reported) main = btn('move', T('situation-room.move-here', "Move here"), `data-pu="${esc(m.reported.pu_code)}"`);
  // A shared unit outranks Confirm: confirming one of two people down for the
  // same unit would lock in the very collision the banner above points out.
  else if (m.shared) main = btn('set', T('situation-room.change-unit', 'Change unit'));
  else if (m.assign_state === 'proposed' && m.assigned) main = btn('confirm', T('situation-room.confirm', 'Confirm'), `data-pu="${esc(m.assigned.pu_code)}"`);
  else if (!m.assigned) main = btn('set', T('situation-room.set-unit', "Set unit"));
  else main = btn('clear', T('situation-room.clear', 'Clear'));
  /* Delegation sits BESIDE the person, because that is the only place anyone
     can be sure who they are promoting. A box you type an observer id into
     would let one mistyped digit hand another campaign's observer the keys.
     Offered only for someone this reader actually outranks — the ladder is
     enforced on the server, and a button that always failed would read as a
     broken room rather than as a limit. */
  const mine = m.observer_id !== S.group.me_id;
  const role = mine && iDelegate() && iOutrank(m.observer_id)
    ? (m.role ? btn('demote', T('situation-room.remove-manager', 'Remove manager'))
      : btn('promote', T('situation-room.give-access', 'Give access'), 'data-name="' + esc(m.label || 'Observer #' + m.observer_id) + '"'))
    : '';
  /* Removal is the OWNER's alone: it is the one roster action with no row left
     to undo it from. Last in the row and unstyled, because it is the one nobody
     should reach for by accident. */
  const drop = iAmOwner() && mine && !(m.role === 'owner')
    ? btn('remove', T('situation-room.remove-observer', "Remove"),
      'title="' + T('situation-room.title-remove-observer', "Take this observer off the campaign roster") + '" data-name="' + esc(m.label || 'Observer #' + m.observer_id) + '"')
    : '';
  return `<div class="sr-acts">${main}${role}${btn('rename', T('situation-room.rename', 'Rename'))}${drop}</div>`;
}

async function assign(observerId, puCode) {
  const { status, body } = await api('/api/groups/' + S.gid + '/members/' + observerId + '/assignment', {
    method: 'PATCH', body: JSON.stringify({ pu_code: puCode }),
  });
  if (status !== 200) {
    alert(body.error === 'no_such_unit' ? T('situation-room.no-such-unit', "No polling unit has that code.")
      : body.error === 'outside_your_scope' ? T('situation-room.outside-your-unit-area', "That unit is outside the area you cover.")
      : T('situation-room.could-not-save-assignment', "Could not save that assignment."));
    return false;
  }
  S.team = S.coverage = null;
  loadTab(true);
  return true;
}

function emptyTeamHtml() {
  return `<div class="sr-empty">
    <h2>${T('situation-room.no-observers-yet', 'No observers yet')}</h2>
    <p>${T('situation-room.invite-share', 'Share your invite link however you already talk to your people. Anyone who taps it, signs in and joins appears here.')}</p>
    <p>${T('situation-room.invite-deliberate',
    '<strong>Joining is always a deliberate tap</strong> — a link forwarded into a group chat never enrols whoever opens it.')}</p>
    <button class="sr-btn primary" onclick="showInvite()" style="margin-top:12px">${T('situation-room.get-the-invite-link', 'Get the invite link')}</button>
  </div>`;
}

async function afterRoleChange() {
  S.team = S.coverage = S.overview = null;
  S.group = (await api('/api/groups/' + S.gid)).body;
  render();
}

/**
 * Promote to manager, or to a coordinator over one area.
 *
 * THE AREA IS PICKED, NEVER TYPED, and the values come from the group's own
 * coverage tree — the same list the console is already showing. A free-text
 * area would let one typo scope a coordinator to a place that does not exist,
 * and the failure is silent: their console simply reports an empty election.
 *
 * A coordinator sees the whole race's numbers and only their own area's people
 * (see scopeClause in routes/groups.js), and the dialog says so, because a role
 * whose limits are discovered by bumping into them is a role nobody trusts.
 */
/* The levels on offer, and the hierarchy each one has to walk to reach a value.
   A group already scoped to one area has no state step — the group IS that
   area, and a "state" coordinator inside it would just be a manager. */
/* Resolved at CALL time, not here: a module-level constant is evaluated once at
   import, before the stored language is known, and would freeze in English. */
const LABEL_STEP = {
  zone: () => T('situation-room.choose-a-zone', 'Choose a zone…'),
  state: () => T('situation-room.choose-a-state', 'Choose a state…'),
  lga: () => T('situation-room.choose-a-local-government', 'Choose a local government…'),
  ward: () => T('situation-room.choose-a-ward', 'Choose a ward…'),
};

async function promote(observerId, who) {
  const g = S.group;
  const NAT = !g.scope;
  const ALL = [
    ['zone', T('situation-room.area-zone', "Geopolitical zone")],
    ['state', T('common.state', 'State')],
    ['lga', T('situation-room.area-lga', "Local government")],
    ['ward', T('common.ward', 'Ward')],
  ];
  /* Only the levels BELOW this reader's own, so the picker cannot offer a
     promotion the server is going to refuse: a state coordinator sees Local
     government and Ward, and nothing above them. */
  const KINDS = ALL.filter(([v]) => (RANKS[v] || 0) > myRank() && (NAT || (v !== 'zone' && v !== 'state')));
  const STEPS = {
    zone: ['zone'],
    state: ['state'],
    lga: NAT ? ['state', 'lga'] : ['lga'],
    ward: NAT ? ['state', 'lga', 'ward'] : ['lga', 'ward'],
  };
  const level = S.coverage && S.coverage.level === 'unit' ? 'ward' : (S.overview || S.coverage || {}).level || 'state';
  const sheet = openSheet(T('situation-room.give-more-access', "Give {who} more access", { who }));
  const wrap = sheet.body;
  /* Only the owner appoints managers — everyone else delegates coordinators
     alone, so the Role select collapses to one option for them and the area
     picker is open from the start. */
  const CAN_MANAGER = iAmOwner();
  wrap.innerHTML = `<div class="sr-form" style="max-width:none">
      <div><label for="pr-role">${T('situation-room.role', 'Role')}</label>
        <select id="pr-role">
          ${CAN_MANAGER ? `<option value="manager">${T('situation-room.role-opt-manager', "Manager — the whole race, and everyone in it")}</option>` : ''}
          <option value="coordinator">${T('situation-room.role-opt-coordinator', "Coordinator — one area’s people")}</option>
        </select></div>
      <div id="pr-where"${CAN_MANAGER ? ' hidden' : ''}>
        <label for="pr-kind">${T('situation-room.area', 'Area')}</label>
        <select class="sr-sel" id="pr-kind" style="width:100%">
          ${KINDS.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}
        </select>
        <div class="sr-chain" id="pr-chain"></div>
        <p class="sr-fine">${T('situation-room.coordinator-fine', "A coordinator sees the whole race’s totals — so their own area means something — but manages only the observers inside it.")}</p>
      </div>
      <div style="display:flex;gap:8px">
        <button class="sr-btn primary" id="pr-go">${T('situation-room.confirm', 'Confirm')}</button>
        <button class="sr-btn" id="pr-cancel">${T('common.cancel', 'Cancel')}</button>
      </div>
    </div>`;

  /**
   * The area picker, as a CASCADE.
   *
   * The first version showed one level select and one value select, and filled
   * the value list from S.path — the manager's own drill position on the
   * Coverage tab. So picking "Ward" offered the wards of wherever that manager
   * happened to be standing, or nothing at all, and there was no way to reach a
   * ward in a state you had not already drilled into. A picker that depends on
   * where you last clicked is not a picker.
   *
   * Now the steps are the hierarchy: choosing Ward walks state, then local
   * government, then ward, each list fetched for the choice above it. Every
   * option comes off the same /coverage endpoint the tree uses, so an area
   * offered here is one the tree can actually count.
   */
  const picked = {};
  /* ANCESTORS ONLY. Passing the step's own value narrows the list to the level
     BELOW it — asking for states with ?state=Borno returns Borno's LGAs, so the
     "Choose a state" select filled up with local governments and its stored
     value matched nothing, falling back to the placeholder while the levels
     underneath stayed answered. The list for a step is defined by what sits
     above it, never by itself. */
  const ABOVE = { zone: [], state: [], lga: ['state'], ward: ['state', 'lga'] };
  /* Fetched once per question. Every list is keyed by the choices above it, so
     going back to a state already visited costs nothing. The PROMISE is cached,
     not the result, so a second ask while the first is in flight waits for it
     instead of firing another request. */
  const lists = new Map();
  const optionsFor = (step) => {
    if (step === 'zone') return Promise.resolve((g.zones || []).map((z) => ({ key: z, name: z })));
    const q = new URLSearchParams();
    for (const a of ABOVE[step]) if (picked[a]) q.set(a, picked[a]);
    const key = step + '?' + q;
    if (!lists.has(key)) {
      lists.set(key, api('/api/groups/' + S.gid + '/coverage' + (q.toString() ? '?' + q : ''))
        .then(({ body }) => (body && body.nodes) || []));
    }
    return lists.get(key);
  };

  /**
   * Redraw the chain FROM the step that changed, never from the top.
   *
   * This used to clear every select and re-fetch each list in turn on every
   * choice, so the answers already given vanished and came back one network
   * round-trip at a time — the flicker between one dropdown and the next. Now
   * the selects above the change stay exactly where they are, and only the
   * steps below it are replaced, each appearing first as a disabled "Loading…"
   * that fills in place.
   *
   * `drawn` guards the race: pick a state, then change it before its LGAs land,
   * and the slower answer must not draw a list under the wrong state.
   */
  let drawn = 0;
  async function renderChain(from = 0) {
    const mine = ++drawn;
    const steps = STEPS[$('pr-kind').value] || [];
    for (const k of Object.keys(picked)) if (!steps.includes(k)) delete picked[k];
    const chain = $('pr-chain');
    [...chain.children].slice(from).forEach((el) => el.remove());
    for (let i = from; i < steps.length; i++) {
      const step = steps[i];
      // Stop at the first unanswered step: the next list has no basis yet.
      if (i > 0 && !picked[steps[i - 1]]) break;
      const sel = document.createElement('select');
      sel.className = 'sr-sel sr-chain-in';
      sel.dataset.step = step;
      sel.disabled = true;
      sel.innerHTML = `<option>${T('index.loading', 'Loading…')}</option>`;
      chain.appendChild(sel);
      const rows = await optionsFor(step);
      if (mine !== drawn) return;
      sel.innerHTML = `<option value="">${LABEL_STEP[step]()}</option>`
        + rows.map((x) => `<option value="${esc(x.key)}"${picked[step] === x.key ? ' selected' : ''}>${esc(x.name)}</option>`).join('');
      sel.disabled = false;
      sel.addEventListener('change', () => {
        picked[step] = sel.value;
        // Anything below this step is now stale — a ward chosen under the old
        // local government would quietly stay selected and be submitted.
        for (const later of steps.slice(i + 1)) delete picked[later];
        renderChain(i + 1);
      });
    }
  }

  $('pr-role').addEventListener('change', () => {
    $('pr-where').hidden = $('pr-role').value !== 'coordinator';
    if (!$('pr-where').hidden) renderChain();
  });
  if (!CAN_MANAGER) renderChain();
  $('pr-kind').addEventListener('change', () => renderChain(0));
  $('pr-cancel').addEventListener('click', sheet.close);
  $('pr-go').addEventListener('click', async () => {
    const role = $('pr-role').value;
    const payload = role === 'coordinator'
      ? {
        role,
        scope_kind: $('pr-kind').value,
        scope_value: picked[(STEPS[$('pr-kind').value] || []).slice(-1)[0]] || '',
        /* The parents the picker walked through. Hints only — the server
           settles them against the register — but without them a ward name
           shared by several states (Garki, Sabon Gari) cannot be settled. */
        scope_state: picked.state || '',
        scope_lga: picked.lga || '',
      }
      : { role };
    if (role === 'coordinator' && !payload.scope_value) return alert(T('situation-room.pick-the-area-they-will-cover', 'Pick the area they will cover.'));
    const { status, body } = await api('/api/groups/' + S.gid + '/managers/' + observerId, {
      method: 'POST', body: JSON.stringify(payload),
    });
    if (status !== 200) return alert(roleError(body.error));
    sheet.close();
    afterRoleChange();
  });
}

async function rename(observerId) {
  const cur = (S.team.members.find((m) => String(m.observer_id) === String(observerId)) || {}).label || '';
  const label = await askText(T('situation-room.rename-observer-prompt', "Name for this observer on your roster (only your group sees it):"), cur);
  if (label === null) return;
  const { status } = await api('/api/groups/' + S.gid + '/members/' + observerId, {
    method: 'PATCH', body: JSON.stringify({ label: label.trim() }),
  });
  if (status !== 200) return alert(T('situation-room.could-not-save-that-name', 'Could not save that name.'));
  S.team = null;
  loadTab(true);
}

/* --- invites ----------------------------------------------------------- */

/**
 * Stepping back from a room you help manage.
 *
 * The OWNER cannot, and the button says why rather than failing on the tap: a
 * group whose last owner walked away has nobody who can add a manager, revoke
 * a link, or answer for it. Handing them a "leave" that orphans the room would
 * be offering a door that locks behind everyone.
 */
/**
 * Delete the room. Owner only, and the confirmation is proportional.
 *
 * An empty room — no observers, nobody's work in it — is a mistake somebody
 * made two minutes ago, and making them type its name to undo that would be
 * ceremony for its own sake. A room with people in it asks for the name,
 * because there is no undo and the manager needs a moment where the thing they
 * are about to lose is written down in front of them.
 *
 * What deletion CANNOT touch is worth saying to them: every report those
 * observers filed stays in the public record, still counted. Deleting a
 * campaign cannot delete an election.
 */
async function deleteRoom() {
  const g = S.group;
  const n_ = g.members || 0;
  if (n_ === 0) {
    if (!await ask(T('situation-room.confirm-delete-empty', 'Delete {name}? It has no observers in it, so nothing is lost.', { name: g.name }))) return;
  } else {
    const typed = await askText(n_ === 1
      ? T('situation-room.delete-prompt-one', 'Deleting {name} removes its roster, assignments and invite links for {n} observer. Their reports stay in the public record and still count.\n\nType the room name to confirm:', { name: g.name, n: n_ })
      : T('situation-room.delete-prompt-many', 'Deleting {name} removes its roster, assignments and invite links for {n} observers. Their reports stay in the public record and still count.\n\nType the room name to confirm:', { name: g.name, n: n_ }));
    if (typed === null) return;
    if (typed.trim() !== g.name) return alert(T('situation-room.that-did-not-match-the-name-nothing', 'That did not match the name. Nothing was deleted.'));
  }
  const { status, body } = await api('/api/groups/' + S.gid, { method: 'DELETE' });
  if (status !== 200) {
    return alert(body.error === 'owner_only'
      ? T('situation-room.only-the-owner-can-delete', 'Only the owner can delete this room.')
      : T('situation-room.could-not-delete-that-room', 'Could not delete that room.'));
  }
  history.replaceState(null, '', '/situation-room.html');
  S.gid = null; S.group = null; S.groups = [];
  boot();
}

async function leaveRoom() {
  if (!await ask(T('situation-room.confirm-stop-managing', 'Stop managing {name}? You will lose access to this room unless the owner adds you back.', { name: S.group.name }))) return;
  const { status } = await api('/api/groups/' + S.gid + '/managers/' + S.group.me_id, { method: 'DELETE' });
  if (status !== 200) return alert(T('situation-room.could-not-step-back-from-this-room', 'Could not step back from this room.'));
  S.gid = null; S.group = null;
  boot();
}

/**
 * The invite panel — every link, with the revoke the copy promises.
 *
 * The first version said "you can revoke it at any time" and offered no way to.
 * A promise with no control behind it is the same failure as a consent notice
 * describing a screen that does not exist: it reads as handled.
 */
async function showInvite(sheet) {
  const { body } = await api('/api/groups/' + S.gid + '/invites');
  const all = Array.isArray(body) ? body : [];
  const live = all.filter((t) => !t.revoked && t.expires_at > Date.now());
  if (!live.length) {
    await api('/api/groups/' + S.gid + '/invites', { method: 'POST' });
    return showInvite(sheet);
  }
  const days = (t) => Math.max(1, Math.round((t.expires_at - Date.now()) / 86400000));
  /* A dialog, redrawn in place after a revoke or a new link rather than opened
     again — reopening would stack a second one over the first. */
  const s = sheet || openSheet(T('situation-room.invite-links', 'Invite links'));
  const panel = s.body;
  panel.innerHTML = `${live.map((t) => `<div class="sr-link">
      <code>${esc(location.origin + '/join/' + t.token)}</code>
      <span class="sr-sub num" style="white-space:nowrap">${T('situation-room.n-used', '{v0} used', { v0: n(t.uses) })} &middot; ${days(t)}d</span>
      <button class="sr-btn mini" data-copy="${esc(t.token)}">${T('support.copy', 'Copy')}</button>
      <button class="sr-btn mini" data-revoke="${esc(t.token)}">${T('situation-room.revoke', 'Revoke')}</button>
    </div>`).join('')}
    <div class="sr-inv-note">${T('situation-room.anyone-with-a-live-link',
    'Anyone with a live link can join your roster after signing in.')}</div>
    <button class="sr-btn" id="inv-new">${T('situation-room.create-another-link', 'Create another link')}</button>`;

  panel.querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', () => {
    navigator.clipboard.writeText(location.origin + '/join/' + b.dataset.copy)
      .then(() => { b.textContent = T('support.copied', 'Copied'); });
  }));
  panel.querySelectorAll('[data-revoke]').forEach((b) => b.addEventListener('click', async () => {
    if (!await ask(T('situation-room.revoke-this-link-anyone-who-has-not', 'Revoke this link? Anyone who has not used it yet will not be able to join with it.'))) return;
    await api('/api/groups/' + S.gid + '/invites/' + b.dataset.revoke, { method: 'DELETE' });
    showInvite(s);
  }));
  $('inv-new').addEventListener('click', async () => {
    await api('/api/groups/' + S.gid + '/invites', { method: 'POST' });
    showInvite(s);
  });
}

/* --- boot -------------------------------------------------------------- */

/**
 * SWITCHING CAMPAIGNS RELOADS THE ROOM.
 *
 * This used to swap S.gid and clear the caches by hand, and the hand-written
 * list went stale: S.sources was added later and never added here, so picking
 * another campaign left the previous one's "Copy observers from…" list on
 * screen — offering rooms measured against a target that was no longer the
 * target. Every cache this console keeps is another chance to miss one, and the
 * miss is silent: the page looks switched and is showing the old campaign's
 * numbers.
 *
 * A reload cannot miss one. The room already lives at its own address, so this
 * is a navigation rather than a cache-invalidation problem, and the address is
 * the thing that should change anyway — a manager who switches campaigns and
 * then copies the link should be sending the campaign they are looking at.
 *
 * The tab rides along, so switching from one campaign's Team tab lands on the
 * other's rather than dropping back to Overview.
 */
function pickGroup(id) {
  const g = (S.groups || []).find((x) => x.id === id);
  if (g && g.slug) {
    location.assign('/room/' + encodeURIComponent(g.slug)
      + (S.tab && S.tab !== 'overview' ? '?tab=' + encodeURIComponent(S.tab) : ''));
    return;
  }
  /* A room with no slug cannot be addressed, so it still switches in place —
     and this list must name EVERY cache, which is the fragility above. */
  S.gid = id;
  S.coverage = S.team = S.overview = S.activity = S.incidents = null;
  S.sources = S.tally = S.areaTally = null;
  S.path = { state: '', lga: '', ward: '' };
  loadGroup();
}

async function loadGroup() {
  const { body } = await api('/api/groups/' + S.gid);
  S.group = body;
  syncUrl(body);
  render();
}

/* Party code -> emblem path, from the manifest the ballot boards already use.
   Fetched once; a failure just means no emblem, never a broken console. */
let LOGOS = {};
/* Every registered party, so the table can list them all before a single
   result exists. Failure is not fatal: the table falls back to whoever has
   votes, which is what it did before. */
let PARTIES = [];

/* The slug in the address bar, if we arrived at /room/<slug>. */
/* ?room= is how sign-in hands the room back: the /room/<slug> path cannot
   survive app.js's `next` guard, so authgate re-expresses it this way and
   syncUrl() below restores the pretty address once the room loads. */
const URL_SLUG = (location.pathname.match(/^\/room\/([^/]+)/) || [])[1]
  || new URLSearchParams(location.search).get('room') || '';

/**
 * Keep the address bar pointing at the room being looked at.
 *
 * replaceState, not a navigation: switching rooms should leave a shareable URL
 * behind without adding a history entry per switch, so Back still leaves the
 * console rather than walking through every room visited.
 */
function syncUrl(g) {
  if (!g || !g.slug) return;
  const want = '/room/' + g.slug;
  if (location.pathname !== want) history.replaceState(null, '', want);
}

/* The taskbar jump list (manifest "shortcuts") opens ?tab=team and the like.
   Read once, before the first render, so the room opens on the tab that was
   asked for rather than flashing Overview first. */
/* See the scrollbar rules in the stylesheet above. Capture phase, because a
   scroll inside .sr-wrap or the coverage pane does not bubble. */
(() => {
  let idle;
  addEventListener('scroll', () => {
    document.documentElement.classList.add('scrolling');
    clearTimeout(idle);
    idle = setTimeout(() => document.documentElement.classList.remove('scrolling'), 900);
  }, { passive: true, capture: true });
})();

/**
 * THE INSTALLED WINDOW IS NAMED ONCE.
 *
 * A browser composes an installed window's title as
 * "<manifest name> - <document.title>", so the two halves showed the product
 * name twice: "Hawkeye Situation Room - Situation Room".
 *
 * The manifest supplies the name and this clears the other half, leaving the
 * browser to show the app name alone. Clearing rather than repeating the name:
 * the composition only runs when the document has a title, so an empty one
 * cannot produce "X - X", whereas setting it to the same string relies on the
 * browser noticing they match.
 *
 * NOT TRANSLATED, deliberately. The name is the product's, identical in every
 * language — see the <title> above, which carries no data-i18n for the same
 * reason — so unlike the rest of this page there is nothing here to repaint on
 * a language change.
 *
 * A browser TAB has no app name in front of it, so it keeps the full title and
 * this does nothing.
 */
function syncTitle() {
  if (matchMedia('(display-mode: standalone)').matches) document.title = '';
}
syncTitle();

function tabFromUrl() {
  const t = new URLSearchParams(location.search).get('tab');
  if (['overview', 'coverage', 'team', 'incidents'].includes(t)) S.tab = t;
}

async function boot(preferId) {
  tabFromUrl();
  LOGOS = await (window.fetchData ? window.fetchData('logos/manifest.json') : fetch('logos/manifest.json'))
    .then((r) => r.json()).catch(() => ({}));
  PARTIES = await api('/api/parties').then((r) => (Array.isArray(r.body) ? r.body : [])).catch(() => []);
  const { body } = await api('/api/groups');
  /* MEMBERS REACH THE ROOM TOO. The list was built from 'managing' alone, so an
     observer who followed the room's link landed on the setup form and was
     invited to create a campaign of their own — the roster they had actually
     joined was not on the page anywhere. Managed rooms stay first: somebody who
     both runs one and observes in another opens their own. */
  const managing = (body && body.managing) || [];
  const seen = new Set(managing.map((x) => x.id));
  S.groups = managing.concat(((body && body.member) || []).filter((x) => !seen.has(x.id)));
  if (!S.groups.length) return renderWelcome();
  /* A slug in the address wins over "whatever was first": that link is how a
     manager or coordinator who did not create the room reaches it at all. */
  const bySlug = URL_SLUG && S.groups.find((x) => x.slug === URL_SLUG);
  if (URL_SLUG && !bySlug) {
    $('sr').innerHTML = `<div class="sr-msg">${T('situation-room.not-your-room', "That room is not one you are part of, or the link is wrong.")}</div>`;
    return;
  }
  S.gid = preferId || (bySlug && bySlug.id) || S.groups[0].id;
  await loadGroup();
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('#crumbs button');
  if (!b) return;
  if (b.dataset.lvl === 'root') S.path = { state: '', lga: '', ward: '' };
  else if (b.dataset.lvl === 'state') S.path = { state: S.path.state, lga: '', ward: '' };
  else if (b.dataset.lvl === 'lga') S.path = { ...S.path, ward: '' };
  S.coverage = null;
  toTop();
  loadTab(true);
});

/* The crest reloads. Everywhere else it goes home; here home is the public
   site, and a manager watching a live room who taps the logo lost the room. */
document.getElementById("sr-brand").addEventListener("click", (e) => {
  e.preventDefault();
  location.reload();
});

boot().catch((e) => {
  $('sr').innerHTML = `<div class="sr-msg">${T('situation-room.could-not-load-the-room', 'Could not load the situation room. {error}', { error: esc(e.message) })}</div>`;
});
</script>
</body>

apply plugin: 'com.android.application'

// Release signing: keystore lives OUTSIDE the repo (~/hawkeye-secrets/), creds in
// android/keystore.properties (gitignored). Absent file = unsigned release build,
// so debug builds and CI never need the secrets.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace = "ng.com.hawkeye.observer"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ng.com.hawkeye.lite"
        minSdkVersion rootProject.ext.minSdkVersion
        // The website serves a single APK as a direct download, so every ABI in
        // it is bytes every user pays for. The Play BUNDLE must keep them all —
        // Play ships each device only its own slice — so this is opt-in with
        // -PwebApk and never applies to bundleRelease.
        // x86/x86_64 are emulators; arm64 + armeabi-v7a covers every real phone.
        if (project.hasProperty('webApk')) { ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' } }
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Release 3. VERSION CODE 2 IS LIVE ON PLAY as of 2026-08-27 — Play
        // rejects a duplicate versionCode outright, so every build from here
        // must be 3 or higher or it cannot be uploaded at all. Bump this BEFORE
        // building anything intended for the store, not after the upload fails.
        //
        // Release 2 (live) carried native.js's fetchData(), so Lite reads
        // political_data.json and the logo manifest from the LIVE site instead
        // of the copy frozen in the APK (INEC amended its 2023 candidate list
        // seven times AFTER publication — that would have been seven store
        // releases for a JSON file). Plus the slimming: 13.7 MB -> 9.68 MB.
        //
        // What release 3 carries: the incident-media work — a 2-video cap with
        // an acknowledged refusal, a 45s duration cap that is the gate for
        // recordings (size limits apply to gallery files only), client-side
        // compression before upload, real video thumbnails, and upload
        // feedback that reports only what it actually knows.
        versionCode 3
        versionName "1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            // The DEBUG apk is what the website serves as a direct download, so
            // unlike the Play bundle (which ships each device only its own ABI)
            // every architecture in here is downloaded by every user. Dropping
            // the ABI restriction for the AAB doubled this file from 31 MB to
            // 61 MB. x86/x86_64 are emulators only; arm64 and armeabi-v7a cover
            // every real phone, including the 32-bit devices the Play bundle was
            // fixed to keep supporting.
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

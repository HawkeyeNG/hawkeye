  }).join('')}
        </tbody>
      </table></div>
      ${cast ? '' : `<div class="sr-msg">${T('situation-room.no-results-published-yet-for',
        'No results published yet for {v0}.', { v0: areaNote })}</div>`}
      <div class="sr-foot">
        <div class="sr-count">${t.unitsReporting === 1
    ? T('situation-room.one-unit-counted', '1 unit counted')
    : T('situation-room.n-units-counted', '{v0} units counted', { v0: n(t.unitsReporting || 0) })}
        ${t.inDispute ? '&middot; ' + T('situation-room.n-disputed-left-out',
    '{v0} disputed and left out, as on the public docket', { v0: n(t.inDispute) }) : ''}
        &middot; ${T('situation-room.same-figures-public-board', 'the same figures the public board shows')}</div>
        <button class="sr-btn" data-party-csv="${esc(area)}">${
    T('situation-room.download-party-totals', 'Download party totals (CSV)')}</button>
      </div>
    </div>`;
}

/**
 * One filed report. TEAM AND PUBLIC BOTH APPEAR, and are told apart.
 *
 * A unit somebody else already covered is not a gap — sending an agent there
 * spends effort where the count exists. But the two are different calls, so
 * they cannot look the same: ours are named and carry the on-unit check, public
 * ones say only that the unit was covered. A public report is never attributed;
 * its unit is already public, who filed it is not the campaign's business.
 */
function activityRow(r) {
  const off = r.on_unit === false;
  const cls = !r.ours ? 'idle' : off ? 'off' : 'ok';
  const glyph = !r.ours ? '&#9633;' : off ? '&#9670;' : '&#9679;';
  const word = !r.ours ? 'Public' : off ? 'Elsewhere' : 'Ours';
  return `<div class="sr-act">
    <span class="pill ${cls}"><i>${glyph}</i>${word}</span>
    <div class="sr-act-t">
      ${r.ours ? `<b>${esc(r.label || 'Observer #' + r.observer_id)}</b> &mdash; ` : ''}${esc(r.name)}
      <span class="sr-sub">${esc(r.lga || '')}${r.ward ? ' &middot; ' + esc(r.ward) : ''}${off ? ' &middot; not the unit they were down for' : ''}${!r.ours ? ' &middot; covered by someone outside your team' : ''}</span>
    </div>
    <span class="sr-act-w">${timeAgo(r.at)}</span>
  </div>`;
}

/**
 * A choropleth cut from the national layers the site already ships.
 *
 * app/states_geo.json and app/lga_geo.json hold every shape as a PRE-PROJECTED
 * SVG path on one shared 800x660 viewBox, so this is a filter over a file that
 * is already there and already cached — no projection, no library, no new
 * geometry. Same reasoning as the seat maps on the race pages.
 *
 * Names are matched on a folded key because the INEC register and the geo files
 * disagree by a letter or two on shapes that are plainly the same place
 * ("Somolu" / "Shomolu", "Danbata" / "Dambatta"). An unmatched shape is simply
 * not drawn — a map that quietly mislabels an LGA is worse than one with a gap.
 */
/**
 * The area this viewer's console is rooted at, and its name.
 *
 * A coordinator's room IS their area: the tree, the map and the gap list all
 * start there. The group's own scope is the fallback for everyone else.
 */
/**
 * The results table shows THE WHOLE RACE, exactly as the public board does.
 *
 * It used to crop to the viewer's own area, which made it a different table for
 * every coordinator and forced a label explaining which slice you were looking
 * at. But a result is a property of the RACE, not of who is reading: the
 * presidency is one national count, a governorship is its state's count. So the
 * crop is the group's own race scope and nothing else — a coordinator sees the
 * same totals as their owner, which is also what makes the number comparable
 * when two of them talk.
 *
 * The crop itself is done server-side by /groups/:id/tally, so a Senate or Reps
 * room gets its own district, not the contest's national figure. This only
 * names it.
 */
function raceArea() {
  return (S.group && S.group.scope) || T('common.nigeria', 'Nigeria');
}

function homeArea() {
  const me = (S.group && S.group.me) || {};
  if (me.scope_kind && me.scope_value) return { name: me.scope_value, kind: me.scope_kind, mine: true };
  return { name: S.group.scope || T('common.nigeria', 'Nigeria'), kind: S.group.scope_kind || '', mine: false };
}

async function drawMap(nodes) {
  const host = $('sr-map');
  if (!host) return;

  /**
   * Draw at the level of the ROWS, not the level of the group.
   *
   * The shipped layers are pre-projected states and LGAs. Wards exist only as
   * raw lat/lng GeoJSON and polling units have no polygon at all, so those two
   * levels are drawn by drawWardMap — never as a map of somewhere larger than
   * the viewer's area with nothing highlighted.
   */
  const lvl = ((S.overview || S.coverage || {}).level) || 'state';
  if (lvl === 'ward' || lvl === 'unit') return drawWardMap(host, nodes, lvl);
  // At LGA level every row sits in one state, so the layer is keyed by it.
  const scope = lvl === 'lga'
    ? (S.path.state || (homeArea().kind === 'state' ? homeArea().name : '') || S.group.scope || '')
    : '';
  const file = scope ? 'lga_geo.json' : 'states_geo.json';
  // fetchData, not fetch: Lite does not bundle the geo layers and native.js's
  // helper pulls them from the live site. A no-op on hawkeye.com.ng.
  const geo = await (window.fetchData ? window.fetchData(file) : fetch(file))
    .then((r) => r.json()).catch(() => null);
  if (!geo) { host.innerHTML = `<div class="sr-msg">${T('situation-room.map-unavailable-offline', 'Map unavailable offline.')}</div>`; return; }

  const fold = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
  const shapes = scope ? geo.lgas : geo.states;
  const byKey = new Map();
  for (const s of shapes) {
    const k = scope ? String(s.key || '').split('|') : [String(s.key || '')];
    if (scope && fold(k[0]) !== fold(scope)) continue;
    byKey.set(fold(scope ? k[1] : k[0]), s.path);
  }

  const drawn = nodes.map((x) => ({ node: x, path: byKey.get(fold(x.name)) })).filter((x) => x.path);

  /**
   * The near-misses, and ONLY where there is exactly one of them.
   *
   * The register and the geo file disagree by a letter or two on shapes that
   * are plainly the same place — Lagos alone loses Somolu/Shomolu, and about
   * fifty of the 774 LGAs differ this way nationally. Dropping them leaves a
   * hole in the middle of a state, which reads as "nothing happened there".
   *
   * Bounded three ways, because a mislabelled LGA is worse than a missing one:
   * an edit distance of at most two, only against shapes NOTHING else matched,
   * and only when exactly one candidate qualifies. Two candidates means the
   * name is genuinely ambiguous and the shape stays undrawn.
   */
  const dist = (a, b) => {
    if (Math.abs(a.length - b.length) > 2) return 99;
    let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[b.length];
  };
  const usedPaths = new Set(drawn.map((d) => d.path));
  const spare = [...byKey.entries()].filter(([, p]) => !usedPaths.has(p));
  for (const x of nodes) {
    if (drawn.some((d) => d.node === x)) continue;
    const near = spare.filter(([k]) => dist(fold(x.name), k) <= 2);
    if (near.length === 1) drawn.push({ node: x, path: near[0][1] });
  }

  if (!drawn.length) { host.innerHTML = `<div class="sr-msg">${T('situation-room.no-map-for-this-area', 'No map for this area.')}</div>`; return; }

  const nums = [];
  for (const d of drawn) for (const m of d.path.match(/-?\d+(?:\.\d+)?/g) || []) nums.push(+m);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let i = 0; i + 1 < nums.length; i += 2) {
    if (nums[i] < x0) x0 = nums[i];
    if (nums[i] > x1) x1 = nums[i];
    if (nums[i + 1] < y0) y0 = nums[i + 1];
    if (nums[i + 1] > y1) y1 = nums[i + 1];
  }
  const pad = Math.max(x1 - x0, y1 - y0) * 0.05 || 1;

  host.innerHTML = `<svg viewBox="${(x0 - pad).toFixed(1)} ${(y0 - pad).toFixed(1)} ${(x1 - x0 + pad * 2).toFixed(1)} ${(y1 - y0 + pad * 2).toFixed(1)}"
      role="img" aria-label="${T('situation-room.map-aria-coverage', 'Coverage across {place}', { place: esc(scope || T('common.nigeria', 'Nigeria')) })}" class="sr-map">
    ${drawn.map(({ node, path }) => {
      const p = pct(node.reported, node.units);
      /* Coverage is the FILL and our people are the STROKE, so the two facts do
         not compete for one channel: a well-covered place we have nobody in and
         a bare place full of our observers are the two the manager most needs
         to tell apart at a glance. */
      return `<path d="${path}" fill="var(--ok)" fill-opacity="${(0.05 + (p / 100) * 0.8).toFixed(3)}"
        stroke="${node.assigned ? 'var(--accent)' : 'currentColor'}"
        stroke-opacity="${node.assigned ? 0.95 : 0.35}" stroke-width="${node.assigned ? 1.6 : 0.9}"
        stroke-linejoin="round" vector-effect="non-scaling-stroke"
        ><title>${T('situation-room.map-tooltip', '{place} — {pct}% reported ({rep} of {units})', { place: esc(node.name), pct: p, rep: n(node.reported), units: n(node.units) })}${node.assigned
          ? T('situation-room.map-tooltip-ours', ', {n} of ours', { n: n(node.assigned) })
          : T('situation-room.map-tooltip-nobody', ', nobody assigned')}</title></path>`;
    }).join('')}
  </svg>
  <div class="sr-legend" style="margin-top:10px">
    <span>${T('situation-room.legend-deeper-green', 'Deeper green — more units reported')}</span>
    <span><b style="color:var(--accent)">&#9633;</b> ${T('situation-room.legend-outlined', 'outlined — we have observers there')}</span>
  </div>`;
  wireMapTaps(host);
}

/**
 * Ward-level maps, for LGA and ward coordinators (and anyone who drills there).
 *
 * LGA level: the LGA's wards, filled and outlined exactly as the maps above.
 * Ward level: the ward outline and its polling units as POINTS, filled once
 * reported. Most units have no trustworthy position, so ward-map.js scatters
 * them inside the ward — deterministically — and flags them, and the tooltip
 * says "position approximate" instead of asserting a location.
 */
async function drawWardMap(host, nodes, lvl) {
  const WM = window.HawkeyeWardMap;
  const a = (S.overview || S.coverage || {}).area;
  const note = (html) => {
    host.innerHTML = `<div class="sr-msg">${html}<br />${T('situation-room.list-is-full-picture', 'The list beside this is the full picture for {place}.', { place: esc(homeArea().name) })}</div>`;
  };
  if (!WM || !a) return note(T('situation-room.no-map-for-this-area', 'No map for this area.'));
  const r = await api('/api/groups/' + S.gid + '/wards-geo?state=' + encodeURIComponent(a.state) + '&lga=' + encodeURIComponent(a.lga));
  const wards = (r.status === 200 && r.body && r.body.wards) || [];
  if (!wards.length) return note(T('situation-room.no-ward-map-for-lga', 'No ward map for {lga} yet.', { lga: esc(a.lga) }));
  const box = (m) => `viewBox="0 0 ${m.W} ${Math.ceil(m.H)}" role="img" class="sr-map"`;

  if (lvl === 'ward') {
    const m = WM.wardShapes(wards, nodes);
    host.innerHTML = `<svg ${box(m)} aria-label="${T('situation-room.map-aria-coverage', 'Coverage across {place}', { place: esc(a.lga) })}">
      ${m.shapes.map(({ d, node, name }) => {
        if (!node) {
          return `<path d="${d}" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-width="0.8"
            vector-effect="non-scaling-stroke"><title>${esc(name)}</title></path>`;
        }
        const p = pct(node.reported, node.units);
        return `<path d="${d}" fill="var(--ok)" fill-opacity="${(0.05 + (p / 100) * 0.8).toFixed(3)}"
          stroke="${node.assigned ? 'var(--accent)' : 'currentColor'}" stroke-opacity="${node.assigned ? 0.95 : 0.35}"
          stroke-width="${node.assigned ? 1.6 : 0.9}" stroke-linejoin="round" vector-effect="non-scaling-stroke"
          ><title>${T('situation-room.map-tooltip', '{place} — {pct}% reported ({rep} of {units})', { place: esc(node.name), pct: p, rep: n(node.reported), units: n(node.units) })}${node.assigned
          ? T('situation-room.map-tooltip-ours', ', {n} of ours', { n: n(node.assigned) })
          : T('situation-room.map-tooltip-nobody', ', nobody assigned')}</title></path>`;
      }).join('')}
    </svg>
    <div class="sr-legend" style="margin-top:10px">
      <span>${T('situation-room.legend-deeper-green', 'Deeper green — more units reported')}</span>
      <span><b style="color:var(--accent)">&#9633;</b> ${T('situation-room.legend-outlined', 'outlined — we have observers there')}</span>
    </div>`;
    wireMapTaps(host);
    wireMapZoom(host);
    return;
  }

  const ward = WM.match(a.ward, wards);
  if (!ward) return note(T('situation-room.no-boundary-for-ward', 'The map layer has no boundary we can match to {ward} ward.', { ward: esc(a.ward) }));
  const m = WM.unitPoints(ward.geometry, nodes);
  const R = (m.W / 100).toFixed(1);
  host.innerHTML = `<svg ${box(m)} aria-label="${T('situation-room.map-aria-units', 'Polling units in {ward}', { ward: esc(a.ward) })}">
    <path d="${m.outline}" fill="var(--ok)" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.45"
      stroke-width="1" vector-effect="non-scaling-stroke" />
    ${m.points.map(({ x, y, node, approx }) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${R}"
      fill="${node.reported ? 'var(--ok)' : 'none'}"
      stroke="${node.assigned ? 'var(--accent)' : 'currentColor'}" stroke-opacity="${node.reported || node.assigned ? 0.95 : 0.5}"
      stroke-width="${node.reported ? 2 : 1}" vector-effect="non-scaling-stroke"
      ><title>${esc(node.name)} — ${node.reported ? T('situation-room.unit-reported', 'reported') : T('situation-room.unit-no-report-yet', 'no report yet')}${node.assigned ? T('situation-room.map-tooltip-ours', ', {n} of ours', { n: n(node.assigned) }) : ''}${approx ? ' · ' + T('situation-room.position-approximate', 'position approximate') : ''}</title></circle>`).join('')}
  </svg>
  <div class="sr-legend" style="margin-top:10px">
    <span>${T('situation-room.legend-filled-reported', 'Filled — reported')}</span>
    <span><b style="color:var(--accent)">&#9675;</b> ${T('situation-room.legend-ringed-ours', 'ringed — one of ours is assigned')}</span>
    <span>${T('situation-room.legend-positions-approximate', 'Most positions are approximate — placed inside the ward')}</span>
  </div>`;
  wireMapTaps(host);
  wireMapZoom(host);
}

// Uppercased by the stylesheet, so no mixed-case acronym would survive here.
/* A FUNCTION, not a constant: a map built at load froze in whatever language
   the page opened with, and the coverage tab kept it for the whole session. */
const LEVEL_WORD_KEY = { state: 'unit.state.many', lga: 'situation-room.local-governments',
  ward: 'situation-room.wards', unit: 'situation-room.polling-units' };
const LEVEL_WORD_EN = { state: 'States', lga: 'Local governments', ward: 'Wards', unit: 'Polling units' };
const LEVEL_WORD = new Proxy({}, {
  get: (_t, k) => (typeof k === 'string' && LEVEL_WORD_EN[k]
    ? T(LEVEL_WORD_KEY[k], LEVEL_WORD_EN[k]) : undefined),
});

/* OUR OWN CONFIRM. window.confirm renders the browser's dialog: it is grey,
   it is titled "hawkeye.com.ng says", and its OK/Cancel are the platform's
   words in the platform's language. None of that can be translated, and this
   page asks four destructive questions. */
function ask(message) {
  return new Promise((resolve) => {
    const box = document.createElement('div');
    box.className = 'sr-ask';
    box.innerHTML = `<div class="sr-ask-card" role="alertdialog" aria-modal="true">
      <p></p>
      <div class="sr-ask-btns">
        <button type="button" class="sr-btn" data-no>${T('common.cancel', 'Cancel')}</button>
        <button type="button" class="sr-btn primary" data-yes>${T('common.ok', 'OK')}</button>
      </div></div>`;
    box.querySelector('p').textContent = message;
    const done = (v) => { box.remove(); document.documentElement.classList.remove('modal-open'); resolve(v); };
    box.addEventListener('click', (e) => { if (e.target === box) done(false); });
    box.querySelector('[data-no]').addEventListener('click', () => done(false));
    box.querySelector('[data-yes]').addEventListener('click', () => done(true));
    document.addEventListener('keydown', function esc(e) {
      if (e.key === 'Escape') { document.removeEventListener('keydown', esc); done(false); }
    });
    document.body.appendChild(box);
    document.documentElement.classList.add('modal-open');
    box.querySelector('[data-yes]').focus();
  });
}

/* The same dialog with a field in it. window.prompt is the other grey box —
   "hawkeye.com.ng says", an unstyleable input, OK/Cancel in the platform's
   language — and this page asks for a unit code, two names and a typed
   confirmation through it. Resolves to the string, or null if they backed out,
   so every call site reads exactly like the prompt() it replaced. */
function askText(message, value = '', opts = {}) {
  return new Promise((resolve) => {
    const box = document.createElement('div');
    box.className = 'sr-ask';
    box.innerHTML = `<div class="sr-ask-card" role="dialog" aria-modal="true">
      <p id="sr-ask-label"></p>
      <input class="sr-ask-input" id="sr-ask-input" type="text" aria-labelledby="sr-ask-label"
        autocomplete="off" autocapitalize="${opts.code ? 'off' : 'sentences'}" ${opts.code ? 'spellcheck="false"' : ''} />
      <div class="sr-ask-btns">
        <button type="button" class="sr-btn" data-no>${T('common.cancel', 'Cancel')}</button>
        <button type="button" class="sr-btn primary" data-yes>${T('common.ok', 'OK')}</button>
      </div></div>`;
    box.querySelector('p').textContent = message;
    const field = box.querySelector('input');
    field.value = value;
    if (opts.placeholder) field.placeholder = opts.placeholder;
    if (opts.code) field.classList.add('num');
    const done = (v) => { box.remove(); document.documentElement.classList.remove('modal-open'); resolve(v); };
    box.addEventListener('click', (e) => { if (e.target === box) done(null); });
    box.querySelector('[data-no]').addEventListener('click', () => done(null));
    box.querySelector('[data-yes]').addEventListener('click', () => done(field.value));
    /* Enter submits. A one-field dialog that needs a mouse to accept it is a
       form pretending to be a prompt. */
    field.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); done(field.value); } });
    document.addEventListener('keydown', function esc(e) {
      if (e.key === 'Escape') { document.removeEventListener('keydown', esc); done(null); }
    });
    document.body.appendChild(box);
    document.documentElement.classList.add('modal-open');
    field.focus();
    field.select();
  });
}

/**
 * A dialog with a title, a close button and a scrolling body.
 *
 * For the flows askText is too small for — Give access, Invite links. Both used
 * to be panels PREPENDED to the top of the page, and both buttons live where a
 * manager has often scrolled well down, so the tap opened something off-screen
 * and looked like it had done nothing at all.
 *
 * Only the topmost dialog answers Escape: a confirmation opened over this one
 * (revoking a link asks first) must close alone, not take its parent with it.
 */
function openSheet(title) {
  const box = document.createElement('div');
  box.className = 'sr-ask';
  box.innerHTML = `<div class="sr-ask-card sr-sheet" role="dialog" aria-modal="true" aria-labelledby="sr-sheet-title" tabindex="-1">
      <div class="sr-sheet-head"><h2 id="sr-sheet-title"></h2>
        <button type="button" class="sr-sheet-x" aria-label="${T('common.close', 'Close')}"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
      <div class="sr-sheet-body"></div>
    </div>`;
  box.querySelector('#sr-sheet-title').textContent = title;
  const before = document.activeElement;
  const onKey = (e) => {
    if (e.key === 'Escape' && document.body.lastElementChild === box) close();
  };
  function close() {
    document.removeEventListener('keydown', onKey);
    box.remove();
    if (!document.querySelector('.sr-ask')) document.documentElement.classList.remove('modal-open');
    // Back to the button that opened it, so a keyboard user is not dropped at the top.
    if (before && before.isConnected && before.focus) before.focus();
  }
  box.addEventListener('click', (e) => { if (e.target === box) close(); });
  box.querySelector('.sr-sheet-x').addEventListener('click', close);
  document.addEventListener('keydown', onKey);
  document.body.appendChild(box);
  document.documentElement.classList.add('modal-open');
  // The DIALOG takes focus, not the close button: focusing the x lit its ring
  // the moment the dialog opened, so it looked pre-selected. Tab still walks in.
  box.querySelector('.sr-sheet').focus();
  return { box, body: box.querySelector('.sr-sheet-body'), close };
}

/**
 * Make a drawn map answer a TAP.
 *
 * Every shape already carries its numbers in a <title>, which a mouse shows on
 * hover and a phone never shows at all. Read the same <title> back rather than
 * restating the numbers, so the tapped text can never drift from the hovered.
 */
function wireMapTaps(host) {
  const svg = host.querySelector('svg');
  if (!svg) return;
  const info = document.createElement('div');
  info.className = 'sr-map-info';
  info.setAttribute('aria-live', 'polite');
  info.textContent = T('situation-room.map-tap-hint', 'Tap an area to see its numbers.');
  svg.after(info);
  svg.addEventListener('click', (e) => {
    const shape = e.target.closest('path, circle');
    const title = shape && shape.querySelector('title');
    if (!title) return;
    svg.querySelectorAll('.is-picked').forEach((el) => el.classList.remove('is-picked'));
    shape.classList.add('is-picked');
    info.textContent = title.textContent;
  });
}

/**
 * Zoom and pan a ward map.
 *
 * A ward's polling units bunch where people live — Garki's 171 sit in a few
 * streets — and on a phone card they draw as one grey smudge no finger can tap
 * apart. Three ways in, because a phone and a laptop want different ones: the
 * buttons (always there, and "+" zooms onto whatever unit was last tapped, so
 * tap a bunch and press +), a pinch or drag once zoomed, and the wheel or a
 * trackpad pinch on a desktop.
 *
 * Dots keep their size on SCREEN as the map grows — that is what pulls a bunch
 * apart. And the page scrolls normally until the map is zoomed: a map that
 * swallows every swipe traps the thumb of someone only scrolling past it.
 */
function wireMapZoom(host) {
  const svg = host.querySelector('svg');
  const vb = svg && svg.viewBox && svg.viewBox.baseVal;
  if (!vb || !vb.width || !vb.height) return;
  const base = { x: vb.x, y: vb.y, w: vb.width, h: vb.height };
  const MAX = 16;
  const dots = [...svg.querySelectorAll('circle')].map((c) => [c, +c.getAttribute('r') || 0]);
  const v = { s: 1, cx: base.x + base.w / 2, cy: base.y + base.h / 2 };
  host.classList.add('sr-zoomable');
  const bar = document.createElement('div');
  bar.className = 'sr-zoom';
  bar.innerHTML = `<button type="button" data-z="in" aria-label="${T('situation-room.zoom-in', 'Zoom in')}">+</button>`
    + `<button type="button" data-z="out" aria-label="${T('situation-room.zoom-out', 'Zoom out')}">&minus;</button>`
    + `<button type="button" data-z="all" aria-label="${T('situation-room.zoom-reset', 'Show the whole map')}">&#8634;</button>`;
  host.appendChild(bar);

  const apply = () => {
    const w = base.w / v.s;
    const h = base.h / v.s;
    v.cx = Math.min(base.x + base.w - w / 2, Math.max(base.x + w / 2, v.cx));
    v.cy = Math.min(base.y + base.h - h / 2, Math.max(base.y + h / 2, v.cy));
    svg.setAttribute('viewBox', `${(v.cx - w / 2).toFixed(2)} ${(v.cy - h / 2).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)}`);
    for (const [c, r] of dots) c.setAttribute('r', (r / v.s).toFixed(2));
    svg.classList.toggle('is-zoomed', v.s > 1);
    svg.style.touchAction = v.s > 1 ? 'none' : 'pan-y';
    bar.querySelector('[data-z="in"]').disabled = v.s >= MAX;
    bar.querySelector('[data-z="out"]').disabled = v.s <= 1;
    bar.querySelector('[data-z="all"]').disabled = v.s <= 1;
  };
  const toMap = (x, y) => {
    const m = svg.getScreenCTM();
    return m ? new DOMPoint(x, y).matrixTransform(m.inverse()) : null;
  };
  // Change scale while keeping the map point under (x, y) exactly where it is.
  const zoomAt = (scale, x, y) => {
    const before = x == null ? null : toMap(x, y);
    v.s = Math.min(MAX, Math.max(1, scale));
    apply();
    const after = before && toMap(x, y);
    if (after) { v.cx += before.x - after.x; v.cy += before.y - after.y; apply(); }
  };

  bar.addEventListener('click', (e) => {
    const b = e.target.closest('[data-z]');
    if (!b) return;
    if (b.dataset.z === 'all') { v.s = 1; apply(); return; }
    if (b.dataset.z === 'in') {
      const picked = svg.querySelector('.is-picked');
      if (picked) { const bb = picked.getBBox(); v.cx = bb.x + bb.width / 2; v.cy = bb.y + bb.height / 2; }
    }
    zoomAt(v.s * (b.dataset.z === 'in' ? 2 : 0.5));
  });

  svg.addEventListener('wheel', (e) => {
    // A plain wheel over an unzoomed map scrolls the page; ctrl+wheel is also
    // what a trackpad pinch sends.
    if (!e.ctrlKey && v.s <= 1) return;
    e.preventDefault();
    zoomAt(v.s * Math.exp(-e.deltaY * 0.0025), e.clientX, e.clientY);
  }, { passive: false });

  /* No pointer capture: it would retarget the closing click to the <svg>, and
     tapping a unit would stop selecting it. Move and up are watched on window
     for the life of one gesture instead. */
  const down = new Map();
  let g = null;
  let moved = false;
  const onMove = (e) => {
    if (!down.has(e.pointerId)) return;
    down.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const pts = [...down.values()];
    if (pts.length >= 2 && g && g.pinch) {
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      zoomAt(g.s * (d / g.d), (pts[0].x + pts[1].x) / 2, (pts[0].y + pts[1].y) / 2);
      moved = true;
    } else if (pts.length === 1 && g && !g.pinch && v.s > 1) {
      const dx = e.clientX - g.x;
      const dy = e.clientY - g.y;
      if (!moved && Math.hypot(dx, dy) < 6) return;
      moved = true;
      const m = svg.getScreenCTM();
      if (!m) return;
      v.cx = g.cx - dx / m.a;
      v.cy = g.cy - dy / m.d;
      apply();
    }
  };
  const onUp = (e) => {
    down.delete(e.pointerId);
    if (down.size) {
      const [p] = [...down.values()];
      g = { pinch: false, x: p.x, y: p.y, cx: v.cx, cy: v.cy };
      return;
    }
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    g = null;
    if (moved) {
      // A drag ends in a click on whatever was under the finger. Swallow it, or
      // panning the map would also pick the unit you let go over.
      const swallow = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
      svg.addEventListener('click', swallow, { capture: true, once: true });
      setTimeout(() => svg.removeEventListener('click', swallow, { capture: true }), 0);
    }
  };
  svg.addEventListener('pointerdown', (e) => {
    down.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (down.size === 1) {
      moved = false;
      g = { pinch: false, x: e.clientX, y: e.clientY, cx: v.cx, cy: v.cy };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    } else if (down.size === 2) {
      const pts = [...down.values()];
      g = { pinch: true, s: v.s, d: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1 };
    }
  });
  apply();
}

function renderCoverage() {
  const c = S.coverage || { nodes: [] };
  const nodes = c.nodes || [];
  const tot = nodes.reduce((a, x) => ({
    units: a.units + x.units, reported: a.reported + x.reported,
    assigned: a.assigned + x.assigned, on_unit: a.on_unit + x.on_unit, mismatched: a.mismatched + x.mismatched,
  }), { units: 0, reported: 0, assigned: 0, on_unit: 0, mismatched: 0 });
  const silent = tot.assigned - tot.on_unit - tot.mismatched;

  const shown = nodes.filter((x) => {
    if (S.filter === 'gaps') return x.reported < x.units;
    if (S.filter === 'silent') return x.assigned - x.on_unit - x.mismatched > 0;
    if (S.filter === 'ours') return x.assigned > 0 || x.member_reported > 0;
    return true;
  });

  $('sr-body').innerHTML = `
    <div class="sr-heads">
      <div class="sr-head"><b class="num">${n(tot.reported)}</b><span>of ${n(tot.units)} units reported</span></div>
      <div class="sr-head"><b class="num">${finePct(tot.reported, tot.units)}</b><span>${T('situation-room.coverage', 'Coverage')}</span></div>
      <div class="sr-head ok"><b class="num">${n(tot.on_unit)}</b><span>${T('situation-room.on-their-unit', 'On their unit')}</span></div>
      <div class="sr-head off"><b class="num">${n(tot.mismatched)}</b><span>${T('situation-room.filed-elsewhere', 'Filed elsewhere')}</span></div>
      <div class="sr-head wait"><b class="num">${n(silent > 0 ? silent : 0)}</b><span>${T('situation-room.yet-to-report', 'Yet to report')}</span></div>
    </div>
    ${crumbsHtml()}
    <div class="sr-tools">
      <select class="sr-sel" id="cov-filter">
        <option value="all"${S.filter === 'all' ? ' selected' : ''}>${T('situation-room.show-everything', 'Show everything')}</option>
        <option value="gaps"${S.filter === 'gaps' ? ' selected' : ''}>${T('situation-room.only-where-units-are-unreported', 'Only where units are unreported')}</option>
        <option value="silent"${S.filter === 'silent' ? ' selected' : ''}>${T('situation-room.only-where-our-observers-are-silent', 'Only where our observers are silent')}</option>
        <option value="ours"${S.filter === 'ours' ? ' selected' : ''}>${T('situation-room.only-where-we-have-people', 'Only where we have people')}</option>
      </select>
      <button class="sr-btn" id="csv">${T('situation-room.export-csv', 'Export CSV')}</button>
    </div>
    <div class="sr-wrap"><table class="sr-tbl">
      <thead><tr>
        <th>${LEVEL_WORD[c.level] || 'Places'}</th>
        <th>${T('situation-room.units', 'Units')}</th><th>${T('situation-room.reported', 'Reported')}</th><th>${T('situation-room.coverage', 'Coverage')}</th>
        <th>${T('situation-room.ours', 'Ours')}</th><th>${T('situation-room.on-unit', 'On unit')}</th><th>${T('situation-room.elsewhere', 'Elsewhere')}</th><th>${T('situation-room.silent', 'Silent')}</th>
      </tr></thead>
      <tbody>${shown.length ? shown.map((x) => rowHtml(x, c)).join('') :
        `<tr><td colspan="8" class="sr-msg">${T('situation-room.nothing-matches-that-filter-here', 'Nothing matches that filter here.')}</td></tr>`}</tbody>
    </table></div>
    <div class="sr-legend">
      <span><b style="color:var(--ok)">&#9679;</b> ${T('situation-room.legend-on-unit', 'On unit')}</span>
      <span><b style="color:var(--off)">&#9670;</b> ${T('situation-room.legend-elsewhere', 'Elsewhere')}</span>
      <span><b style="color:var(--wait)">&#9632;</b> ${T('situation-room.legend-silent', 'Silent')}</span>
    </div>
    ${c.level !== 'unit' ? `<div class="sr-note">${T('situation-room.select-a-row-to-open-the-places', 'Select a row to open the places inside it.')}</div>` : ''}`;

  $('cov-filter').addEventListener('change', (e) => { S.filter = e.target.value; renderCoverage(); });
  $('csv').addEventListener('click', () => exportCsv(c.level, shown));
  document.querySelectorAll('.sr-tbl .drill').forEach((b) =>
    b.addEventListener('click', () => drill(c.level, b.dataset.key)));
}

/* Whose area is this, and is it mine? `mine` may be a single key or a list of
   them — a zone coordinator owns every state in their zone. */
const isMine = (cov, key) => (Array.isArray(cov.mine) ? cov.mine.includes(key) : cov.mine === key);
const ownerOf = (cov, key) => ((cov.coordinators || {})[key] || [])
  .map((c) => c.label || 'Observer #' + c.observer_id);

function rowHtml(x, cov) {
  const silent = Math.max(0, x.assigned - x.on_unit - x.mismatched);
  const p = pct(x.reported, x.units);
  const cell = (v, cls) => `<td class="num${v ? (cls ? ' ' + cls : '') : ' z'}">${n(v)}</td>`;
  const who = ownerOf(cov, x.key);
  return `<tr${isMine(cov, x.key) ? ' class="mine"' : ''}>
    <td>${x.key === x.name ? `<button class="drill" data-key="${esc(x.key)}">${esc(x.name)}</button>`
      : `<button class="drill" data-key="${esc(x.key)}">${esc(x.name)}</button><span class="sr-sub num">${esc(x.key)}</span>`}
      ${who.length ? `<span class="sr-who">${isMine(cov, x.key) ? `<b>${T('situation-room.yours', 'yours')}</b>` : esc(who.join(', '))}</span>` : ''}</td>
    <td class="num">${n(x.units)}</td>
    <td class="num${x.reported ? '' : ' z'}">${n(x.reported)}</td>
    <td><div class="sr-bar-cell"><span class="num">${p}%</span>
      <span class="sr-track"><span class="sr-fill" style="width:${p}%"></span></span></div></td>
    ${cell(x.assigned)}
    ${cell(x.on_unit, 'ok-t')}
    ${cell(x.mismatched, 'off-t')}
    ${cell(silent, 'wait-t')}
  </tr>`;
}

function crumbsHtml() {
  const p = S.path;
  const parts = [`<button data-lvl="root">${esc(homeArea().name)}</button>`];
  for (const k of ['state', 'lga', 'ward']) if (p[k]) parts.push(`<button data-lvl="${k}">${esc(p[k])}</button>`);
  const last = parts.pop().replace(/^<button[^>]*>/, '<span class="now">').replace('</button>', '</span>');
  return `<div class="sr-crumbs" id="crumbs">${parts.map((x) => x + '<span>&rsaquo;</span>').join('')}${last}</div>`;
}

/* Drilling replaces the table under a scroll position set by the PREVIOUS,
   longer list — go down two levels and the new list can be entirely above the
   viewport, which reads as a blank screen. */
/* The window no longer scrolls on a desktop width — the pane does — and a
   crumb click that silently failed to scroll leaves the reader at the bottom of
   the previous level wondering where the new one went. Both are called because
   which one is the scroller depends on the viewport. */
function toTop() {
  window.scrollTo({ top: 0, behavior: 'instant' });
  const pane = $('sr-scroll');
  if (pane) pane.scrollTo({ top: 0, behavior: 'instant' });
}

function drill(level, key) {
  if (level === 'unit') return;
  if (level === 'state') S.path = { state: key, lga: '', ward: '' };
  else if (level === 'lga') S.path = { ...S.path, lga: key, ward: '' };
  else S.path = { ...S.path, ward: key };
  S.coverage = null;
  toTop();
  loadTab(true);
}

/* THE DISCLAIMER TRAVELS WITH THE FILE. A spreadsheet mailed to a party
   office arrives without the console around it, and these two sentences are
   the ones that stop a crowd-reported subtotal being read as a result. They
   are rows, not a comment prefix: a "#" line is a row to a spreadsheet anyway,
   and one that looks like an accident. */
function exportPartyCsv(t, area) {
  const counted = new Map((t.national || []).map((x) => [String(x.party).toUpperCase(), x.votes || 0]));
  const rows = (PARTIES.length
    ? PARTIES.map((p) => ({ code: p.code, name: p.name, votes: counted.get(String(p.code).toUpperCase()) || 0 }))
    : (t.national || []).map((x) => ({ code: x.party, name: '', votes: x.votes || 0 })))
    .sort((a, b) => b.votes - a.votes || String(a.code).localeCompare(String(b.code)));
  const cast = rows.reduce((a, x) => a + x.votes, 0);
  const q = (v) => JSON.stringify(String(v == null ? '' : v));
  const lines = [
    [q('Hawkeye — party totals'), q(area || '')].join(','),
    [q('Generated'), q(new Date().toISOString())].join(','),
    [q(T('situation-room.csv-disclaimer-coverage',
      'These figures are crowd-reported from the polling units Hawkeye could cover — not from every unit in this area. Export the coverage CSV to see exactly which units are included and which are still unreported.'))].join(','),
    [q(T('situation-room.csv-disclaimer-inec',
      'Official results and announcements are INEC\'s alone. Hawkeye does not declare winners and this file is not a declaration.'))].join(','),
    '',
    ['party_code', 'party_name', 'votes', 'share_pct'].join(','),
    ...rows.map((x) => [q(x.code), q(x.name), x.votes,
      cast ? ((x.votes / cast) * 100).toFixed(1) : '0.0'].join(',')),
    '',
    [q('units_counted'), t.unitsReporting || 0].join(','),
    [q('disputed_and_excluded'), t.inDispute || 0].join(','),
    [q('total_votes'), cast].join(','),
  ];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }));
  a.download = 'hawkeye-party-totals-'
    + String(area || 'area').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

function exportCsv(level, rows) {
  const head = [level, 'code', 'units', 'reported', 'coverage_pct', 'ours', 'on_unit', 'elsewhere', 'silent'];
  const lines = [head.join(',')].concat(rows.map((x) => [
    JSON.stringify(x.name), JSON.stringify(x.key), x.units, x.reported, pct(x.reported, x.units),
    x.assigned, x.on_unit, x.mismatched, Math.max(0, x.assigned - x.on_unit - x.mismatched),
  ].join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' }));
  a.download = 'hawkeye-coverage-' + level + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

/**
 * Published incidents inside this race.
 *
 * EVERY ONE OF THESE IS ALREADY PUBLIC. The tab adds one thing the public feed
 * cannot: which of them a group's own observers filed. Said on the screen,
 * because a campaign looking at an incident list needs to know — and needs its
 * rivals to be able to know — that this is the same list anyone can read.
 *
 * NOT ranked, NOT scored, NOT adjudicated. An incident here is a report someone
 * made, nothing more; the docket is where claims get weighed, and a situation
 * room that quietly graded them would be doing that job without any of its
 * safeguards.
 */
function renderIncidents() {
  const list = (S.incidents && S.incidents.incidents) || [];
  const ours = list.filter((x) => x.ours).length;
  const mine = S.incFilter === 'ours';
  const shown = mine ? list.filter((x) => x.ours) : list;

  $('sr-body').innerHTML = `
    <div class="sr-heads">
      <div class="sr-head"><b class="num">${n(list.length)}</b><span>${T('situation-room.published-in-this-race', 'Published in this race')}</span></div>
      <div class="sr-head ok"><b class="num">${n(ours)}</b><span>${T('situation-room.filed-by-your-observers', 'Filed by your observers')}</span></div>
    </div>
    <div class="sr-bar" style="border:0;padding:0 0 10px">
      <select class="sr-sel" id="inc-filter">
        <option value="all"${mine ? '' : ' selected'}>${T('situation-room.everything-published-here', 'Everything published here')}</option>
        <option value="ours"${mine ? ' selected' : ''}>${T('situation-room.only-what-your-observers-filed', 'Only what your observers filed')}</option>
      </select>
    </div>
    ${shown.length ? `<div class="sr-card">${shown.map(incidentRow).join('')}</div>` : `
    <div class="sr-empty"><h2>${list.length
      ? T('situation-room.none-from-your-observers-yet', 'None from your observers yet')
      : T('situation-room.no-incidents-published-here', 'No incidents published here')}</h2>
      <p>${list.length
        ? T('situation-room.nothing-your-own-people-filed-has', 'Nothing your own people filed has been published in this race yet.')
        : T('situation-room.nothing-has-been-published-for-this', 'Nothing has been published for this race. Incidents appear once they clear review, at the same moment the public sees them.')}</p></div>`}
    <div class="sr-note">
      ${T('situation-room.incidents-note',
    '<strong>This is the public list.</strong> Every incident here is already on Hawkeye for anyone to read — nothing is shown before it is published, and no other group’s observers are named. What this tab adds is which ones came from your people. Weighing a claim happens in the <a href="docket.html" style="color:var(--accent)">public docket</a>, not here.')}
    </div>`;

  $('inc-filter').addEventListener('change', (e) => { S.incFilter = e.target.value; renderIncidents(); });
}

function incidentRow(x) {
  const place = x.name ? `${esc(x.name)}` : x.state ? `${esc(x.state)} — no unit given` : 'Location not given';
  const sub = [x.lga, x.ward].filter(Boolean).map(esc).join(' &middot; ');
  return `<div class="sr-act">
    <span class="pill ${x.ours ? 'ok' : 'idle'}"><i>${x.ours ? '&#9679;' : '&#9633;'}</i>${esc(kindWord(x.kind))}</span>

      ${x.description ? `<span class="sr-sub">${esc(x.description)}</span>` : ''}
      ${x.ours ? `<span class="sr-sub" style="color:var(--ok)">filed by ${esc(x.ours.label || 'Observer #' + x.ours.observer_id)}</span>` : ''}
    </div>
    <span class="sr-act-w">${timeAgo(x.at)}</span>
  </div>`;
}

const kindWord = (k) => String(k || 'Incident').replace(/[_-]+/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());

name: iOS Lite release (archive → TestFlight)

# Signed App Store build of HAWKEYE LITE — bundle id ng.com.hawkeye.lite.
#
# The signed sibling of ios-lite-build.yml, which compiles unsigned and needs no
# Apple account. Everything about the toolchain is documented there; this file
# adds signing, versioning, archive/export and the TestFlight upload.
#
# WHY THE OLD ios-release.yml COULD NOT WORK, and what stops it recurring:
# it built mobile/ (appId ng.com.hawkeye.lite) and then wrote an ExportOptions
# plist keyed on ng.com.hawkeye.observer — Lite wearing the main app's identity,
# left over from when Capacitor WAS the main app. The App Store profile is an
# EXPLICIT one for …observer, so the archive failed on a bundle-id mismatch with
# an error that named neither cause. The "Profile must match the app" step below
# reads the identity out of the profile itself and fails in ten seconds with a
# sentence that says which id it found.
#
# TRIGGER: manual only. `upload: false` archives and leaves the .ipa as an
# artifact — the safe dry run. `upload: true` sends it to TestFlight. Nothing
# here ever releases to the public: that stays a human action in App Store
# Connect.
#
# REQUIRED SECRETS (Settings → Secrets and variables → Actions):
#   BUILD_CERTIFICATE_BASE64     base64 of the Apple Distribution .p12
#   P12_PASSWORD                 password used when exporting that .p12
#   PROVISIONING_PROFILE_BASE64  base64 of the App Store profile FOR LITE
#   KEYCHAIN_PASSWORD            any random string (throwaway keychain)
#   APPSTORE_KEY_ID              App Store Connect API key id
#   APPSTORE_ISSUER_ID           App Store Connect issuer id
#   APPSTORE_PRIVATE_KEY         contents of the .p8 (BEGIN PRIVATE KEY …)
#   APPLE_TEAM_ID                G99KD9RW94
#
# The distribution certificate is shared with the native app; only the PROFILE
# is Lite-specific, because a profile is bound to one App ID.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'CFBundleVersion — App Store Connect rejects a re-used one'
        required: true
        type: string
      upload:
        description: 'Upload to TestFlight (off = archive + .ipa artifact only)'
        type: boolean
        default: false

env:
  LITE_BUNDLE_ID: ng.com.hawkeye.lite

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check signing secrets are present
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        # Fail in seconds rather than after a twenty-minute build.
        run: |
          missing=0
          for v in CERT PROFILE TEAM; do
            if [ -z "${!v}" ]; then echo "::error::secret $v is not set"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1

      - name: Install JS deps
        working-directory: mobile
        run: npm ci

      - name: The Apple-frameworks plugin must be linked
        working-directory: mobile
        # Without hawkeye-vision, iOS loses BOTH the scanner and OCR and the app
        # still runs: native.js falls through to the plain camera and ocrSheet
        # returns early. Counting the swift files, not just checking the podspec
        # — a pod with no sources installs and builds perfectly while doing
        # nothing, which is how the gitignore trap nearly shipped.
        run: |
          test -d node_modules/hawkeye-vision \
            || { echo "::error::hawkeye-vision is not installed"; exit 1; }
          SWIFT=$(find node_modules/hawkeye-vision/ios -name '*.swift' | wc -l | tr -d ' ')
          [ "$SWIFT" -ge 2 ] \
            || { echo "::error::hawkeye-vision has $SWIFT swift files, expected 2"; exit 1; }
          echo "  ok: hawkeye-vision present with $SWIFT swift sources"

      - name: Import certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Xcode 16+ reads profiles from the UserData path; the older
          # MobileDevice one still works, so install to both.
          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          NAME=$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)
          cp "$PROFILE_PATH" ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/"$UUID".mobileprovision
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"
          echo "Imported profile '$NAME' ($UUID)"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | tee "$RUNNER_TEMP/ids.txt"
          # A DISTRIBUTION cert, specifically. A development certificate imports
          # cleanly, passes every check above, and then fails ten minutes later
          # inside Archive with "No signing certificate iOS Development found" —
          # an error that points at the wrong thing entirely.
          grep -q 'Apple Distribution' "$RUNNER_TEMP/ids.txt" \
            || { echo "::error::BUILD_CERTIFICATE_BASE64 is not an Apple Distribution certificate — archiving for the App Store needs one"; exit 1; }

      - name: Profile must match the app
        # THE CHECK THE DELETED WORKFLOWS DID NOT HAVE. An App Store profile is
        # bound to ONE explicit App ID; using the native app's profile for Lite
        # cannot work, and xcodebuild's failure names neither the expected nor
        # the actual id. Read it out of the profile's own entitlements and say
        # exactly what is wrong.
        run: |
          set -euo pipefail
          APPID=$(security cms -D -i "$PROFILE_PATH" \
            | plutil -extract Entitlements.application-identifier raw -)
          # Entitlement is TEAMID.bundle.id — drop the team prefix.
          GOT="${APPID#*.}"
          echo "profile '$PROFILE_NAME' is for: $GOT"
          if [ "$GOT" != "$LITE_BUNDLE_ID" ]; then
            echo "::error::PROVISIONING_PROFILE_BASE64 is a profile for '$GOT', but this workflow builds '$LITE_BUNDLE_ID'."
            echo "::error::Lite needs its OWN App ID and its OWN App Store profile — the native app's profile cannot sign it."
            exit 1
          fi
          echo "  ok: profile matches $LITE_BUNDLE_ID"

      - name: Add iOS platform (CocoaPods)
        working-directory: mobile
        run: |
          npx cap add ios --packagemanager CocoaPods || true
          test -f ios/App/Podfile || { echo "::error::Podfile was not generated"; exit 1; }

      - name: iPhone only
        working-directory: mobile
        # `cap add ios` ships Capacitor's default TARGETED_DEVICE_FAMILY = "1,2",
        # so every Lite build has silently claimed iPad support. App Store
        # Connect then refuses the submission until 13-inch iPad screenshots are
        # uploaded — which is how this surfaced, as a submission block rather
        # than as a decision anyone made.
        #
        # Lite is a phone product: its own subtitle is "For older phones and slow
        # data", and the native app already sets supportsTablet: false. Claiming
        # iPad also means Apple reviews it on one, where the injected page title
        # overlaps the nav at 1032px.
        #
        # ios/ is regenerated on every run and is gitignored, so this cannot live
        # in a committed project file — same reason the icon and the AppDelegate
        # patch are steps here.
        run: |
          PBX=ios/App/App.xcodeproj/project.pbxproj
          test -f "$PBX" || { echo "::error::$PBX not found"; exit 1; }
          # `sed -i ''` — BSD sed, because this runs on macOS. GNU's bare -i
          # takes no argument; BSD's consumes the next one as a backup suffix,
          # so the GNU spelling silently hands sed the script as a suffix and
          # the file as the script. The other two sed -i calls in this file
          # already carry the '' for the same reason.
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2"/TARGETED_DEVICE_FAMILY = "1"/g' "$PBX"
          # Verify rather than assume: a template change upstream would make the
          # sed a silent no-op and put iPad support back without anyone noticing.
          if grep -q 'TARGETED_DEVICE_FAMILY = "1,2"' "$PBX"; then
            echo "::error::TARGETED_DEVICE_FAMILY is still 1,2 — the sed did not apply"
            exit 1
          fi
          COUNT=$(grep -c 'TARGETED_DEVICE_FAMILY = "1"' "$PBX" || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::no TARGETED_DEVICE_FAMILY = \"1\" in the project — pattern changed upstream"
            exit 1
          fi
          echo "  ok: iPhone-only on $COUNT build configuration(s)"

      - name: Forward APNs registration in AppDelegate
        working-directory: mobile
        # The template AppDelegate drops the APNs device token on the floor -
        # neither push plugin hooks the app delegate itself; both wait on the
        # NotificationCenter event this patch posts. Root cause of builds 2-6
        # registering no push token, with zero errors anywhere. The script
        # verifies its own result and fails the build if the patch didn't take.
        run: bash scripts/patch_ios_appdelegate.sh ios/App/App/AppDelegate.swift

      - name: Can this build attach to an App Store version?
        working-directory: mobile
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        # Builds 6-11 all uploaded, validated and reached TestFlight while being
        # unattachable to the store listing: they declare 1.2 (from Android's
        # versionName) and the ASC version record was still Apple's default
        # 1.0.0. ASC only offers a build to a version whose number matches, so
        # none of them appeared in the build picker — and the listing showed no
        # icon, because the icon comes from the attached build. Nothing reported
        # it: altool is happy, the build reads VALID, and the two facts live on
        # different console screens. Warns rather than fails, because uploading
        # ahead of the store record is a legitimate thing to do while testing.
        run: |
          VERSION=$(grep -v '^\s*//' android/app/build.gradle | grep -m1 'versionName' | sed 's/[^"]*"\([^"]*\)".*/\1/')
          node scripts/check_asc_version.mjs "$LITE_BUNDLE_ID" "$VERSION"

      - name: Generate the iOS app icon
        working-directory: mobile
        # `cap add ios` ships CAPACITOR'S DEFAULT icon - the blue X on white that
        # turned up on the home screen in TestFlight build 3, beside the real
        # Hawkeye. Nothing here had ever replaced it: not a bug, a missing step.
        # ios/ is regenerated every run and is gitignored, so this has to happen
        # in CI rather than being committed once.
        run: |
          npx @capacitor/assets generate --ios --assetPath assets
          node scripts/check_ios_icon.mjs

      - name: Drop ML Kit from the iOS build
        working-directory: mobile
        # GoogleMLKit text recognition is a STATIC framework: it links into the
        # app binary, and measured 42 MB of a 52 MB device build. Apple's Vision
        # does the same job at zero bytes, and ML Kit's document scanner was only
        # ever an iOS stub. Android keeps ML Kit — it has no VisionKit.
        run: sed -i '' "/@capacitor-mlkit/d" ios/App/Podfile

      - name: Own the app icon manifest
        working-directory: mobile
        # `@capacitor/assets` EDITS Contents.json, it does not create one, so the
        # App Store icon entry depends on whichever template `cap add ios` shipped.
        # Xcode's single-size format derives every size - including the 1024
        # marketing icon App Store Connect displays - from the one file the
        # generator writes.
        run: |
          cp scripts/ios_appiconset.json \
             ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json
          cat ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json

      - name: Bump deployment target + pod install
        working-directory: mobile
        run: |
          set -x
          sed -i '' "s/^platform :ios.*/platform :ios, '16.0'/" ios/App/Podfile
          (cd ios/App && pod install --repo-update)

      - name: Gate on what CocoaPods actually installed
        working-directory: mobile
        # Podfile.lock is the record of what was INSTALLED, which is what ends up
        # in the binary. Editing the Podfile and never checking the result is how
        # a 42 MB regression returns unnoticed.
        run: |
          LOCK=ios/App/Podfile.lock
          if grep -qi 'MLKit' "$LOCK"; then
            echo "::error::ML Kit is back in the iOS build — roughly 42 MB"
            grep -i 'MLKit' "$LOCK" | head
            exit 1
          fi
          grep -q 'HawkeyeVision' "$LOCK" \
            || { echo "::error::HawkeyeVision did not install — iOS would have no scanner and no OCR"; exit 1; }
          echo "  ok: no ML Kit, HawkeyeVision linked"

      - name: The built app must actually be Lite
        working-directory: mobile
        # capacitor.config.json drives this, but assert it: signing the wrong
        # identity is the failure this whole workflow exists to have avoided.
        run: |
          BID=$(plutil -extract CFBundleIdentifier raw ios/App/App/Info.plist 2>/dev/null || echo '')
          echo "Info.plist CFBundleIdentifier: $BID"
          grep -q "\"appId\": \"$LITE_BUNDLE_ID\"" capacitor.config.json \
            || { echo "::error::capacitor.config.json appId is not $LITE_BUNDLE_ID"; exit 1; }
          grep -q "Hawkeye Lite" capacitor.config.json \
            || { echo "::error::appName is not Hawkeye Lite"; exit 1; }
          echo "  ok: building $LITE_BUNDLE_ID"

      - name: Stamp version and build number
        working-directory: mobile
        # Marketing version comes from the ANDROID build so the two platforms
        # never drift; the build number is the workflow input, because App Store
        # Connect rejects a re-used CFBundleVersion.
        run: |
          set -euo pipefail
          VERSION=$(grep -v '^\s*//' android/app/build.gradle | grep -m1 'versionName' | sed 's/[^"]*"\([^"]*\)".*/\1/')
          BUILD='${{ inputs.build_number }}'
          echo "Marketing version $VERSION, build $BUILD"
          plutil -replace CFBundleShortVersionString -string "$VERSION" ios/App/App/Info.plist
          plutil -replace CFBundleVersion -string "$BUILD" ios/App/App/Info.plist

      - name: Inject privacy usage strings
        working-directory: mobile
        # ios/ is regenerated from Capacitor's template on every run and carries
        # NO usage strings. Without them iOS terminates the app the instant it
        # touches the camera, and review rejects it outright (Guideline 5.1.1 —
        # purpose strings must be present AND specific about the use).
        run: |
          set -euo pipefail
          P=ios/App/App/Info.plist
          set_str() {
            plutil -replace "$1" -string "$2" "$P" 2>/dev/null \
              || plutil -insert "$1" -string "$2" "$P"
          }
          set_str NSCameraUsageDescription \
            "Hawkeye uses the camera to photograph polling unit result sheets and to capture optional photo or video evidence for incident reports."
          set_str NSMicrophoneUsageDescription \
            "Hawkeye records audio only as part of a short video you choose to attach as evidence to an incident report."
          set_str NSPhotoLibraryUsageDescription \
            "Hawkeye lets you attach a photo or video you already have as evidence for an incident or result report."
          set_str NSPhotoLibraryAddUsageDescription \
            "Hawkeye can save a copy of a result sheet you photograph to your own photo library."
          set_str NSLocationWhenInUseUsageDescription \
            "Hawkeye attaches your location to a report so it can be cross-checked against the polling unit you selected. This is optional and is only read when you submit a report."
          # ITMS-90683 on every Lite delivery so far. @capacitor/geolocation LINKS
          # requestAlwaysAuthorization, and Apple requires the purpose string for
          # any API the binary references — "your app might not use these APIs, a
          # purpose string is still required". Hawkeye never asks for always
          # authorisation, so this string will not be shown to anyone; it says so
          # plainly, because a reviewer reading it should not conclude the app
          # tracks people in the background.
          set_str NSLocationAlwaysAndWhenInUseUsageDescription \
            "Hawkeye only reads your location while you are using the app, to stamp a report with where it was filed. It never requests background or always-on location and does not track you when the app is closed."
          # Declares no non-exempt encryption, so every upload skips the export
          # compliance questionnaire instead of stalling in review.
          plutil -replace ITSAppUsesNonExemptEncryption -bool false "$P" 2>/dev/null \
            || plutil -insert ITSAppUsesNonExemptEncryption -bool false "$P"

          # THE APP STORE CONNECT ICON. Apple requires CFBundleIconName at the
          # TOP LEVEL for any app whose icon comes from an asset catalog; it
          # names the icon set App Store Connect pulls the 1024 marketing icon
          # from. Capacitor's generated Info.plist writes only the nested
          # CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName, which is enough
          # for the OS home screen and for TestFlight (they use the 60pt icon)
          # but leaves ASC with nothing to display — checked in build 8's ipa,
          # where the top-level key was absent while the nested one was present.
          # That asymmetry is exactly why the icon showed in TestFlight and not
          # on ASC.
          set_str CFBundleIconName AppIcon

          # PORTRAIT ONLY. Rotating the app exposed the WEBSITE header: the
          # app-shell CSS keys off a viewport the landscape layout falls
          # outside, so the phone showed the site's own nav inside the app.
          # Nothing in Hawkeye needs landscape — the report flow is a camera and
          # a form, and the boards are vertical lists — so the orientation is
          # closed rather than the CSS chased across every breakpoint.
          # Matches the native app, which is already "orientation": "portrait".
          #
          # THE iPAD KEY MUST LIST ALL FOUR — build 16 was rejected for this.
          # Apple error 90474: an app that supports iPad must offer every
          # orientation there, because iPad multitasking resizes the window
          # under the app. Native sidesteps the rule entirely by being iPhone
          # only ("supportsTablet": false); Lite ships to iPad as well, and
          # dropping a device family from a PUBLISHED app is a product decision,
          # not a build fix — so iPad keeps the four Apple demands and the phone
          # gets the lock the bug was actually about.
          plutil -replace UISupportedInterfaceOrientations -json \
            '["UIInterfaceOrientationPortrait"]' "$P" 2>/dev/null \
            || plutil -insert UISupportedInterfaceOrientations -json \
               '["UIInterfaceOrientationPortrait"]' "$P"
          IPAD_ALL='["UIInterfaceOrientationPortrait","UIInterfaceOrientationPortraitUpsideDown","UIInterfaceOrientationLandscapeLeft","UIInterfaceOrientationLandscapeRight"]'
          plutil -replace 'UISupportedInterfaceOrientations~ipad' -json "$IPAD_ALL" "$P" 2>/dev/null \
            || plutil -insert 'UISupportedInterfaceOrientations~ipad' -json "$IPAD_ALL" "$P"
          # Catch it here, in seconds, instead of two minutes into an upload.
          IPAD_N=$(plutil -extract 'UISupportedInterfaceOrientations~ipad' json -o - "$P" \
                   | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          [ "$IPAD_N" = "4" ] \
            || { echo "::error::iPad lists $IPAD_N orientations, Apple rejects anything but 4 (error 90474)"; exit 1; }
          echo "--- usage strings + icon name now in Info.plist ---"
          plutil -p "$P" | grep -E "UsageDescription|NonExempt|CFBundleIconName"
          # Fail loudly rather than shipping another build ASC cannot display.
          plutil -extract CFBundleIconName raw "$P" >/dev/null \
            || { echo "::error::CFBundleIconName missing — App Store Connect will show no icon"; exit 1; }

          # EVERY PURPOSE STRING AN APPLE VALIDATOR ASKS FOR.
          #
          # ITMS-90683 arrived on every Lite delivery for missing
          # NSLocationAlwaysAndWhenInUseUsageDescription and nothing in this
          # workflow noticed — the upload SUCCEEDS, the warning is an email, and
          # the next build repeats it. This list is the set the linked
          # frameworks require; a missing one now fails the build instead.
          #
          # Also rejects Apple/Expo BOILERPLATE ("Allow X to access your ..."),
          # because Guideline 5.1.1 wants a specific reason and a generic string
          # passes every automated check while being exactly what gets a human
          # rejection.
          for K in NSCameraUsageDescription NSMicrophoneUsageDescription \
                   NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription \
                   NSLocationWhenInUseUsageDescription \
                   NSLocationAlwaysAndWhenInUseUsageDescription; do
            V=$(plutil -extract "$K" raw "$P" 2>/dev/null || echo '')
            if [ -z "$V" ]; then
              echo "::error::$K is missing — Apple returns ITMS-90683 for this and the next delivery repeats it"
              exit 1
            fi
            case "$V" in
              "Allow "*|"Allow"*"access your"*)
                echo "::error::$K is boilerplate ('$V') — Guideline 5.1.1 wants a specific reason"
                exit 1 ;;
            esac
            printf '  ok  %s\n' "$K"
          done

      - name: Firebase config + push entitlement
        working-directory: mobile
        env:
          PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        # @capacitor/push-notifications returns an APNs token on iOS while the
        # backend sends via FCM — the two do not interoperate, so Lite needs
        # Firebase in the app. Without this plist Firebase never initialises and
        # push fails at runtime with the app looking perfectly healthy, so a
        # missing secret is a hard failure here rather than a warning.
        run: |
          set -euo pipefail
          [ -n "$PLIST_B64" ] \
            || { echo "::error::GOOGLE_SERVICE_INFO_PLIST_BASE64 is not set — Firebase would never initialise and push would die silently"; exit 1; }
          echo -n "$PLIST_B64" | base64 --decode -o ios/App/App/GoogleService-Info.plist
          BID=$(plutil -extract BUNDLE_ID raw ios/App/App/GoogleService-Info.plist)
          [ "$BID" = "$LITE_BUNDLE_ID" ] \
            || { echo "::error::this plist is for '$BID', not '$LITE_BUNDLE_ID' — there are two in circulation and the native app's looks identical"; exit 1; }
          echo "  ok: GoogleService-Info.plist for $BID"

          # aps-environment MUST be production, and MUST be stated rather than
          # left to a default. A development entitlement gets a SANDBOX device
          # token while the server sends to production APNs: the send reports
          # success and the phone never rings — indistinguishable from a bad
          # APNs key. This already cost a debugging cycle on the native app.
          cat > ios/App/App/App.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>aps-environment</key><string>production</string>
          </dict></plist>
          PLIST
          plutil -p ios/App/App/App.entitlements

      - name: Copy web assets
        working-directory: mobile
        # `cap copy` refreshes webDir + config only; it does NOT regenerate the
        # Podfile, so the ML Kit cut and the deployment-target bump both survive.
        run: npx cap copy ios

      - name: Strip and gate the web bundle
        working-directory: mobile
        # The same script the Android release runs. cap sync copies everything
        # under app/ — including app/download/, six ~30 MB copies of a different
        # app, which once produced a 173 MB "Lite".
        run: bash scripts/strip_web_assets.sh ios/App/App/public ios/App/Podfile

      - name: Write export options
        working-directory: mobile
        run: |
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key><dict>
              <key>${{ env.LITE_BUNDLE_ID }}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict></plist>
          PLIST
          cat ios/ExportOptions.plist

      - name: Configure signing on the App target ONLY
        working-directory: mobile
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Signing settings passed as xcodebuild ARGUMENTS apply to every target
        # in the workspace, and the ~13 Pods targets are static libraries that
        # must not be signed at all:
        #
        #   error: Capacitor does not support provisioning profiles, but
        #   provisioning profile Hawkeye Lite App Store has been manually
        #   specified.   (…and the same for all twelve others)
        #
        # So they go into the App target's own build configuration instead,
        # leaving the Pods project untouched. xcodeproj is CocoaPods' own
        # dependency, so `pod install` having succeeded means it is present.
        run: |
          set -euo pipefail
          ruby -e "require 'xcodeproj'" 2>/dev/null || sudo gem install xcodeproj --no-document
          TEAM_ID="$TEAM_ID" PROFILE_NAME="$PROFILE_NAME" ruby - <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = project.targets.find { |t| t.name == 'App' }
          abort('FAIL: no App target in the project') if target.nil?
          target.build_configurations.each do |config|
            s = config.build_settings
            s['CODE_SIGN_STYLE'] = 'Manual'
            s['DEVELOPMENT_TEAM'] = ENV['TEAM_ID']
            s['PROVISIONING_PROFILE_SPECIFIER'] = ENV['PROFILE_NAME']
            s['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            # The sdk-qualified key is the one Xcode actually consults for a
            # device build; the Capacitor template sets it, and leaving it alone
            # is what made the first run look for "iOS Development".
            s['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
            s['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements'
          end

          # GoogleService-Info.plist has to be a BUNDLE RESOURCE, not merely a
          # file sitting in the directory. Written to disk it looks present, the
          # build succeeds, and FirebaseApp.configure() then finds nothing at
          # runtime — the app runs and push never arrives.
          group = project.main_group['App'] || project.main_group
          ref = group.files.find { |f| f.display_name == 'GoogleService-Info.plist' }
          # JUST THE FILENAME. new_file resolves relative to the GROUP, and this
          # group's own path is already 'App' — passing 'App/GoogleService-Info
          # .plist' produced ios/App/App/App/... and the archive failed with
          # "Build input file cannot be found".
          ref ||= group.new_file('GoogleService-Info.plist')
          phase = target.resources_build_phase
          unless phase.files_references.include?(ref)
            phase.add_file_reference(ref)
          end
          # Resolve the reference back to a real path and confirm something is
          # actually there. A dangling reference is what the doubled path was,
          # and it survives all the way to the archive before saying so.
          abort("FAIL: reference resolves to #{ref.real_path}, which does not exist") \
            unless File.exist?(ref.real_path)
          puts "  plist reference -> #{ref.real_path}"

          project.save

          puts 'signing written to the App target:'
          target.build_configurations.each do |config|
            puts "  #{config.name}: #{config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]']} / #{config.build_settings['PROVISIONING_PROFILE_SPECIFIER']} / #{config.build_settings['CODE_SIGN_ENTITLEMENTS']}"
          end
          bundled = phase.files_references.map(&:display_name)
          puts "resources: #{bundled.join(', ')}"
          abort('FAIL: GoogleService-Info.plist is not in the resources build phase') \
            unless bundled.include?('GoogleService-Info.plist')
          RUBY

      - name: Archive
        working-directory: mobile
        # NO signing arguments here — see the step above. Only the deployment
        # target, which genuinely does belong to every pod.
        run: |
          set -euo pipefail
          WS=$(find ios -maxdepth 2 -name '*.xcworkspace' | head -1)
          xcodebuild -workspace "$WS" -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HawkeyeLite.xcarchive" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            archive

      - name: Export .ipa
        working-directory: mobile
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HawkeyeLite.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: What it weighs
        # The .ipa is the closest thing to a real answer before Apple reports a
        # download size. The unsigned CI build measured a 7.6 MB device .app
        # after ML Kit came out, against 52 MB with it — this is the check that
        # the released artifact kept that.
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          echo "ipa: $(du -sh "$IPA" | cut -f1)"
          mkdir -p "$RUNNER_TEMP/peek" && (cd "$RUNNER_TEMP/peek" && unzip -q "$IPA")
          du -sh "$RUNNER_TEMP/peek/Payload/"*.app
          du -sh "$RUNNER_TEMP/peek/Payload/"*.app/Frameworks/* 2>/dev/null | sort -rh | head -8 || true

          # THE ONLY PROOF THAT COUNTS for the Firebase config: is it inside the
          # shipped bundle? Every earlier check looked at the working tree or the
          # project file, and both can be right while the resource still fails to
          # copy. If this is missing, push is dead on arrival and nothing else
          # would have said so.
          APP=$(find "$RUNNER_TEMP/peek/Payload" -maxdepth 1 -name '*.app' | head -1)
          if [ -f "$APP/GoogleService-Info.plist" ]; then
            echo "  ok: GoogleService-Info.plist is IN the ipa ($(plutil -extract BUNDLE_ID raw "$APP/GoogleService-Info.plist"))"
          else
            echo "::error::GoogleService-Info.plist did NOT make it into the ipa — Firebase would not initialise and push would fail silently"
            exit 1
          fi

          # THE APP STORE ICON, PROVEN RATHER THAN ASSUMED. It lives inside
          # Assets.car, not as a loose file, so listing the bundle says nothing.
          # TestFlight renders from the 60pt icon and looks fine without it,
          # which is exactly how build 4 shipped looking correct and left App
          # Store Connect blank.
          echo "--- 1024 marketing icon in the asset catalog? ---"
          if xcrun assetutil --info "$APP/Assets.car" 2>/dev/null \
               | grep -qE '"(Name|RenditionName)"[^,]*AppIcon' ; then
            xcrun assetutil --info "$APP/Assets.car" 2>/dev/null \
              | grep -E '"(Name|RenditionName|SizeOnDisk|Image Type)"' | head -20
          fi
          if xcrun assetutil --info "$APP/Assets.car" 2>/dev/null | grep -q '1024'; then
            echo "  ok: a 1024 icon is in Assets.car"
          else
            echo "::warning::no 1024 found in Assets.car — App Store Connect will show no icon"
          fi

          echo "  entitlements actually signed into the binary:"
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -p - | grep -i 'aps-environment' \
            || echo "    WARNING: no aps-environment in the signed entitlements — push will not work"

      - name: Upload .ipa as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: hawkeye-lite-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Upload to TestFlight
        if: ${{ inputs.upload == true }}
        # Only when explicitly asked: uploading is outward-facing — it makes the
        # build visible to Apple and to any internal testers.
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          echo -n "$APPSTORE_PRIVATE_KEY" > ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Clean up keychain and profiles
        if: always()
        # Keychains live in RUNNER_TEMP and die with the runner, but be explicit:
        # a leaked signing identity is the worst thing this workflow could do.
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.mobileprovision || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision || true
          rm -rf ~/private_keys || true

name: Play upload (build + publish to a testing track)

# Build an Android App Bundle and publish it to a Play testing track, with NO
# service-account key anywhere.
#
# WHY KEYLESS. The organisation enforces iam.disableServiceAccountKeyCreation
# (Google's Secure-by-Default), so a downloadable key cannot be created — and
# should not be: a Play upload credential lets its holder publish to the
# listings. Instead GitHub presents an OIDC token, Google's STS exchanges it for
# credentials that expire in an hour, and the trust is pinned to THIS repository
# by an attribute condition on the provider (see scripts/setup_wif.sh).
#
# WHY THE BUILD MOVED HERE. The upload path in a browser caps at 10 MB and the
# native bundle is ~113 MB, so every release until now was a hand upload. Doing
# the build in the same place as the upload removes the file from the loop
# entirely — and these runners are free on a public repo.
#
# IT WILL NOT TOUCH PRODUCTION. The track input offers testing tracks only.
# Promotion stays a human decision in the Console, where the rollout percentage
# and any staged store-listing changes are visible. This workflow can see
# neither.
#
# REQUIRED SECRETS
#   GCP_WIF_PROVIDER            printed by scripts/setup_wif.sh
#   GCP_SERVICE_ACCOUNT         hawkeye-play-publisher@hawkeye-503910.iam.gserviceaccount.com
#   ANDROID_KEYSTORE_BASE64     base64 of the app's upload keystore
#   ANDROID_KEYSTORE_PASSWORD   store + key password
#   ANDROID_KEY_ALIAS           'hawkeye' (native) or 'hawkeye-lite' (Lite)
#   GOOGLE_MAPS_API_KEY_PROD    NATIVE ONLY. Without it the build succeeds and
#                               every user sees a blank grey map, so the native
#                               branch refuses to start rather than ship that.
#   ANDROID_KEYSTORE_LITE_BASE64 / ANDROID_KEYSTORE_LITE_PASSWORD  — Lite signs
#                               with its OWN keystore, a different certificate.
#                               Using the wrong one produces a bundle Play
#                               rejects for a mismatched signature.

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app'
        required: true
        type: choice
        options: [native, lite]
      track:
        description: 'Track. production requires rollout below.'
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      rollout:
        description: 'production ONLY: "full", or a fraction like 0.1 for a staged release'
        required: false
        type: string
      notes:
        description: 'Release notes. Leave blank to publish without any.'
        required: false
        type: string
      dry_run:
        description: 'Build and verify only — do not publish'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write        # REQUIRED: this is what mints the OIDC token. Without
                         # it the auth step fails with a confusing 403.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Which app, and which keystore
        id: cfg
        run: |
          set -euo pipefail
          if [ "${{ inputs.app }}" = native ]; then
            echo "dir=native/android"                                        >> "$GITHUB_OUTPUT"
            echo "aab=native/android/app/build/outputs/bundle/release/app-release.aab" >> "$GITHUB_OUTPUT"
            echo "pkg=ng.com.hawkeye.observer"                               >> "$GITHUB_OUTPUT"
          else
            echo "dir=mobile/android"                                        >> "$GITHUB_OUTPUT"
            echo "aab=mobile/android/app/build/outputs/bundle/release/app-release.aab" >> "$GITHUB_OUTPUT"
            echo "pkg=ng.com.hawkeye.lite"                                   >> "$GITHUB_OUTPUT"
          fi

      - name: Install JS deps
        run: |
          set -euo pipefail
          if [ "${{ inputs.app }}" = native ]; then npm ci --prefix native
          else npm ci --prefix mobile || npm install --prefix mobile
          fi

      # THE TWO APPS TAKE THEIR SIGNING CONFIG IN COMPLETELY DIFFERENT WAYS, and
      # they sign with different certificates. Native reads gradle properties
      # (HAWKEYE_UPLOAD_*, see native/android/app/build.gradle:110). Lite reads a
      # keystore.properties FILE (mobile/android/app/build.gradle:52) which is
      # gitignored and therefore absent on a fresh runner — build_aab_lite.sh
      # only gates on it existing, it never creates one.
      #
      # Passing native's password or alias to Lite produces a bundle Play
      # rejects for a certificate mismatch, which for a published app is not
      # something you can undo yourself. Hence one branch per app, and a keytool
      # check with THAT app's own password before any build time is spent.
      - name: Restore the upload keystore
        env:
          KS_NATIVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_LITE: ${{ secrets.ANDROID_KEYSTORE_LITE_BASE64 }}
          PW_NATIVE: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PW_LITE: ${{ secrets.ANDROID_KEYSTORE_LITE_PASSWORD }}
          AL_NATIVE: ${{ secrets.ANDROID_KEY_ALIAS }}
          AL_LITE: ${{ secrets.ANDROID_KEY_ALIAS_LITE }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.app }}" = native ]; then
            B64="$KS_NATIVE"; PW="$PW_NATIVE"; AL="$AL_NATIVE"; WANT='CN=Hawkeye,'
          else
            B64="$KS_LITE";   PW="$PW_LITE";   AL="$AL_LITE";   WANT='CN=Hawkeye Lite'
          fi
          [ -n "$B64" ] || { echo "::error::keystore secret empty for ${{ inputs.app }}"; exit 1; }
          [ -n "$PW"  ] || { echo "::error::keystore password empty for ${{ inputs.app }}"; exit 1; }
          [ -n "$AL"  ] || { echo "::error::key alias empty for ${{ inputs.app }}"; exit 1; }

          KS="$RUNNER_TEMP/upload.keystore"
          printf '%s' "$B64" | base64 -d > "$KS"

          # A truncated secret still base64-decodes to something. Prove it opens
          # with this app's own password AND carries this app's own certificate,
          # before spending build time or signing anything.
          keytool -list -keystore "$KS" -storepass "$PW" -alias "$AL" > /dev/null 2>&1 \
            || { echo "::error::keystore will not open with the ${{ inputs.app }} password/alias"; exit 1; }
          OWNER=$(keytool -list -v -keystore "$KS" -storepass "$PW" -alias "$AL" | grep -i '^Owner:' | head -1)
          echo "$OWNER"
          echo "$OWNER" | grep -q "$WANT" \
            || { echo "::error::this is the WRONG certificate for ${{ inputs.app }} — expected $WANT"; exit 1; }

          # Lite's gradle wants a properties file, not -P properties.
          if [ "${{ inputs.app }}" != native ]; then
            cat > mobile/android/keystore.properties <<EOF
          storeFile=$KS
          storePassword=$PW
          keyAlias=$AL
          keyPassword=$PW
          EOF
            grep -q 'storeFile=' mobile/android/keystore.properties \
              || { echo "::error::failed to write mobile/android/keystore.properties"; exit 1; }
          fi
          echo "keystore ok for ${{ inputs.app }}"

      # ASK PLAY WHAT THE HIGHEST VERSION CODE IS, rather than trusting the file.
      # A code is consumed the moment a bundle is uploaded to ANY track, and Play
      # only says otherwise by rejecting the upload — after the build has run.
      # This runs before the build so a duplicate costs seconds, not 40 minutes,
      # and it leaves the file alone if it is already ahead.
      - name: Authenticate to Google — no key, short-lived credentials
        id: auth
        if: ${{ !inputs.dry_run }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Set the next versionCode from Play
        if: ${{ !inputs.dry_run }}
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node scripts/play_next_version.mjs --app "${{ inputs.app }}" --write

      # THE TWO APPS BUILD BY COMPLETELY DIFFERENT ROUTES.
      #
      # Lite is a committed Capacitor project: mobile/android is in git, so
      # gradle can be invoked directly once the web assets are synced in.
      #
      # Native is not. native/android is GENERATED by expo prebuild and
      # gitignored, so there is nothing to cd into on a fresh runner — and
      # prebuild on its own is still not the build. The production bundle needs
      # APP_VARIANT=production (which switches the package and the Maps key
      # together), the prod Maps key, and four guards that have each caught a
      # real failure. native/scripts/build_play_aab.sh already does all of it and
      # has produced every native release to date, so it is called here rather
      # than reimplemented — one build path, not two that can drift.
      - name: Build the bundle
        env:
          MAPS_PROD: ${{ secrets.GOOGLE_MAPS_API_KEY_PROD }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.app }}" != native ]; then
            # FROM mobile/, not from the repo root with --prefix. npm's --prefix
            # moves where packages are INSTALLED, not the working directory, so
            # Capacitor looked for capacitor.config.json in the root, did not
            # find it, and reported "android platform has not been added yet" —
            # which reads as a missing platform and is a missing config.
            cd mobile
            npx cap sync android || { echo "::error::cap sync failed"; exit 1; }

            # @capacitor-firebase/messaging IS FOR iOS ONLY - CUT IT HERE TOO.
            #
            # This is why versionCode 8 was rejected for broken functionality.
            # The cut lived ONLY in scripts/build_aab_lite.sh, so every bundle
            # built by this workflow shipped the plugin: it and
            # @capacitor/push-notifications both register a service for
            # com.google.firebase.MESSAGING_EVENT, Firebase delivers to one,
            # and app/native.js listens to the other. Silent push loss on a
            # shipping app, invisible in a green run and invisible in the .aab.
            #
            # The native branch below calls its build script rather than
            # reimplementing it, for exactly this reason. Until the Lite script
            # can run on a runner this stays a faithful copy, and the
            # assertions after it are what stop the copy drifting again.
            node -e '
              const fs = require("fs");
              const p = "android/app/src/main/assets/capacitor.plugins.json";
              const before = JSON.parse(fs.readFileSync(p, "utf8"));
              const keep = (x) => !String(x.pkg).startsWith("@capacitor-firebase/");
              const after = before.filter(keep);
              const NL = String.fromCharCode(10);
              fs.writeFileSync(p, JSON.stringify(after, null, 2) + NL);
              console.log("  android plugins: " + before.length + " -> " + after.length);
            ' || { echo "::error::could not rewrite capacitor.plugins.json"; exit 1; }
            sed -i "/^include ':capacitor-firebase-messaging'/,+2d" android/capacitor.settings.gradle
            sed -i "/capacitor-firebase-messaging/d" android/app/capacitor.build.gradle

            # Written as `if`, not `grep && { exit 1; }`: under `set -e` a
            # short-circuited && list returns non-zero and would abort the
            # step on the PASSING path.
            for f in android/capacitor.settings.gradle android/app/capacitor.build.gradle android/app/src/main/assets/capacitor.plugins.json; do
              if grep -qi "capacitor-firebase" "$f"; then
                echo "::error::@capacitor-firebase survived in $f - Android push would break silently"
                exit 1
              fi
            done
            # ...and the one that must still be there, so the cut above cannot
            # take the wrong plugin and pass by removing everything.
            if ! grep -q "pushnotifications.PushNotificationsPlugin" android/app/src/main/assets/capacitor.plugins.json; then
              echo "::error::@capacitor/push-notifications is gone - Android would have no push at all"
              exit 1
            fi
            echo "  ok: firebase messaging excluded from android, push-notifications intact"


            # NOT `|| true`. This script is the only thing that keeps the web
            # assets out of the bundle, and swallowing its exit code is exactly
            # how the APK once shipped 18 MB of them. It also has to run from
            # mobile/, because two of its gates read capacitor.config.json.
            bash scripts/strip_web_assets.sh android/app/src/main/assets/public \
              android/app/src/main/assets/capacitor.plugins.json \
              || { echo "::error::strip_web_assets failed — refusing to ship the web tree"; exit 1; }

            cd android
            chmod +x ./gradlew
            # --max-workers=2: the bundle task OOMs a 2-core runner otherwise.
            ./gradlew --no-daemon --no-watch-fs --console=plain --max-workers=2 bundleRelease
            exit 0
          fi

          # A native build WITHOUT the production Maps key still succeeds, still
          # signs, still uploads — and shows every real user a blank grey map.
          # That is invisible in the .aab and invisible in a green run, so it is
          # refused here rather than discovered in the store.
          [ -n "$MAPS_PROD" ] || {
            echo "::error::GOOGLE_MAPS_API_KEY_PROD is not set. A native build without it"
            echo "::error::ships a blank map to every user. Add it as a repository secret"
            echo "::error::(the same value as GOOGLE_MAPS_API_KEY_PROD in native/.env.local)."
            exit 1; }
          printf 'GOOGLE_MAPS_API_KEY_PROD=%s\n' "$MAPS_PROD" > native/.env.local

          # The script reads its credentials from a note file, the same shape as
          # the one in ~/hawkeye-secrets. Written under RUNNER_TEMP, never the
          # workspace, so it cannot be picked up by the upload-artifact step.
          mkdir -p "$RUNNER_TEMP/secrets"
          {
            echo "file: $RUNNER_TEMP/upload.keystore"
            echo "alias: $KS_ALIAS"
            echo "password: $KS_PW"
          } > "$RUNNER_TEMP/secrets/keystore-password.txt"

          HAWKEYE_SECRETS="$RUNNER_TEMP/secrets" bash native/scripts/build_play_aab.sh

      - name: The bundle must not carry a debug certificate
        run: |
          set -euo pipefail
          AAB="${{ steps.cfg.outputs.aab }}"
          [ -f "$AAB" ] || { echo "::error::no bundle produced at $AAB"; exit 1; }
          D=$(mktemp -d); unzip -q -o "$AAB" -d "$D" 'META-INF/*'
          SIG=$(find "$D/META-INF" -iname '*.RSA' -o -iname '*.DSA' -o -iname '*.EC' | head -1)
          keytool -printcert -file "$SIG" | grep -i 'Owner:' || true
          keytool -printcert -file "$SIG" | grep -qi 'Android Debug' \
            && { echo "::error::this bundle is signed with the DEBUG key"; exit 1; }
          echo "size: $(( $(stat -c%s "$AAB") / 1048576 )) MB"

      - name: Publish to ${{ inputs.track }}
        if: ${{ !inputs.dry_run }}
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          NOTES_ARG=""
          if [ -n "${{ inputs.notes }}" ]; then
            printf '%s' "${{ inputs.notes }}" > "$RUNNER_TEMP/notes.txt"
            NOTES_ARG="--notes-file $RUNNER_TEMP/notes.txt"
          fi
          # production is allowed here, but only with the rollout stated — the
          # percentage is the one thing the Console shows and the API does not,
          # and it cannot be taken back from people who already have the build.
          # play_upload.mjs refuses production without it; this just passes it.
          ROLLOUT_ARG=""
          if [ -n "${{ inputs.rollout }}" ]; then
            ROLLOUT_ARG="--rollout ${{ inputs.rollout }}"
          fi
          node scripts/play_upload.mjs \
            --app "${{ inputs.app }}" \
            --track "${{ inputs.track }}" \
            $ROLLOUT_ARG \
            $NOTES_ARG

      - name: Keep the bundle as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-aab
          path: ${{ steps.cfg.outputs.aab }}
          retention-days: 14

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- REQUIRED. This page is served at /room/<slug> as well as
       /situation-room.html, and at the two-segment path every relative href
       resolves under /room/ — styles.css, native.js, the crest and the logo
       manifest all 404 silently, leaving an unstyled wall of text. -->
  <base href="/" />
  <meta name="theme-color" content="#00482b" />
  <meta name="description" content="Situation room for campaigns and civil-society groups: coverage by LGA, ward and unit, and where your own observers have reported from." />
  <title>Hawkeye Election Monitor</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg?v=101" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <!-- THE ROOM'S OWN MANIFEST. The site's manifest starts at /observe.html, so
       "Install" from this page would have installed the observer app. Scope
       stays "/" because a room lives at /room/<slug> as well as here, and a
       manifest takes one scope, not two. -->
  <link rel="manifest" href="room.webmanifest?v=1" />
  <script>/*hk-theme-init*/(function(){try{var t=localStorage.getItem("hawkeye_theme");if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";}document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme="dark";}})();</script>
  <link rel="stylesheet" href="styles.css?v=182" />
  <script src="native.js?v=116"></script>
  <meta name="robots" content="noindex" />
  <script src="authgate.js?v=3"></script>
  <script src="ward-map.js?v=1"></script>
  <script src="/i18n.js?v=10"></script>
  <script src="/lang.js?v=9"></script>
<style>
/* Situation room — an operator console, not a reading page. Everything below is
   scoped to .sr so it cannot leak into the public pages that share styles.css.

   FOUR STATES, NOT TWO, and none of them is the brand accent. Gold means "this
   is Hawkeye" everywhere else on the site; if it also meant "covered" here, the
   one colour a manager scans for would be the one colour already on every
   chrome element. Red is reserved for something genuinely wrong — a red screen
   at 08:00 teaches managers that red means nothing, and then it cannot warn
   them at 16:00. Every state carries a WORD and a GLYPH as well as a hue:
   colour alone fails for colourblind users and in direct Nigerian sun. */
.sr {
  --ok:      #17914c;   /* reported from the assigned unit — the only green */
  --off:     #2f6fed;   /* reported, but from a different unit */
  --wait:    #b8791a;   /* assigned and silent — the actionable one */
  --idle:    var(--muted);
  --sr-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
}
:root[data-theme="dark"] .sr { --ok: #3ecf80; --off: #6fa4ff; --wait: #e0a341; }

.sr { max-width: 1180px; margin: 0 auto; padding: 0 16px 64px; }
/* A DASHBOARD SHOULD USE THE MONITOR IT IS GIVEN. 1180px is right for an
   article and wrong for a wall display: on a 27" screen the coverage table was
   a narrow column with two feet of empty green beside it. The cap lifts with
   the viewport rather than disappearing, so line lengths stay readable. */
@media (min-width: 1400px) { .sr { max-width: 1340px; } }
@media (min-width: 1700px) { .sr { max-width: 1560px; } }
/* Installed, there is no browser chrome above the header — so the header is
   the window's top edge and should not also carry a gap for one. */
@media (display-mode: standalone) {
  .gov-header .brand-row { padding-top: 10px; }
  .sr { padding-bottom: 32px; }
}

/* styles.css sets a GLOBAL button rule — display:block, width:100%, a green
   block with a 16px top margin. That is right for the public pages, where a
   button is a full-width call to action; it is wrong for every control on a
   console, where buttons sit in rows, in table cells and inside breadcrumbs.
   Neutralised once here rather than fought in each rule below. */
.sr button { display: inline-block; width: auto; margin: 0; box-shadow: none; }
.sr button:hover { filter: none; }
.sr button:active { transform: none; }
.sr .num { font-variant-numeric: tabular-nums; font-family: var(--sr-mono); }

/* --- console bar --- */
.sr-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
  padding: 14px 0 12px; border-bottom: 1px solid var(--line);
}
.sr-bar h1 { font-size: 1.15rem; margin: 0; font-family: var(--display); letter-spacing: -0.01em; }

/* The console actions live in the GREEN HEADER BAR, not in the page. They are
   chrome — always the same four, never scrolled to — and putting them in the
   viewport cost a row of vertical space on every tab for no gain. */
.sr-hdr-actions { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; align-items: center; }
.sr-hdr-actions button {
  display: inline-block; width: auto; margin: 0; box-shadow: none;
  background: rgba(255, 255, 255, 0.10); color: #eaf5ee; border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 8px; padding: 6px 11px; font: inherit; font-size: 0.8rem; cursor: pointer;
}
.sr-hdr-actions button:hover { filter: none; border-color: var(--accent); color: #fff; }
.sr-hdr-actions button:active { transform: none; }
.sr-hdr-actions button[disabled] { opacity: 0.4; cursor: not-allowed; }
/* `display: inline-block` above is an AUTHOR rule and beats the user agent's
   [hidden] { display: none }, so a hidden button still drew its box: in the
   installed app — where beforeinstallprompt never fires — the Install button
   sat in the header as an empty pill, pushing the language button off the
   group it belongs to. */
.sr-hdr-actions button[hidden] { display: none; }
/* Installed, there is nothing to install. appinstalled fires for the session
   that did it; a later launch of the installed app never sees that event, so
   the display mode is what answers the question. */
@media (display-mode: standalone), (display-mode: window-controls-overlay) {
  #install-btn { display: none !important; }
}
/* THE HEADER ROW DOES NOT WRAP by default (.brand-row is a plain flex row), so
   giving the actions width:100% inside it did not move them to a line of their
   own — it made them claim the whole line while the brand was still on it, and
   the language button printed itself across "Situation Room". Let the row wrap
   first; then full width genuinely means a second line, right-aligned, which is
   where these belong. */
@media (max-width: 700px) {
  .gov-header .brand-row { flex-wrap: wrap; row-gap: 8px; }
  .sr-hdr-actions { margin-left: 0; width: 100%; justify-content: flex-end; padding-top: 0; }
  /* The brand keeps the first line to itself rather than being squeezed to an
     ellipsis by a group of buttons it is no longer sharing the line with. */
  .gov-header .brand-row .brand { flex: 1 0 100%; }
}

/* Even spacing, one rule. The separators used to be their own flex children, so
   a 10px gap landed on BOTH sides of every dot while "8" and "observers" got the
   same 10px between them — three different-looking gaps in one line. The dot is
   now part of the item that follows it, so every gap is the same gap. */
.sr-bar .meta { gap: 0; }
.sr-bar .meta > span + span::before { content: '·'; padding: 0 9px; opacity: 0.55; }
/* The party emblem, on a white plate. Party logos are supplied as opaque JPEGs
   and PNGs designed for paper, and several are white-on-white or near it — a
   logo dropped straight onto the dark console loses its outline entirely. */
.sr-emblem { width: 34px; height: 34px; border-radius: 8px; background: #fff; padding: 3px;
  display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.sr-emblem img { max-width: 100%; max-height: 100%; display: block; }
.sr-party-pick { display: flex; align-items: center; gap: 10px; }
.sr-party-pick select { flex: 1 1 auto; }
.sr-party-mark { width: 38px; height: 38px; border-radius: 8px; flex: 0 0 auto; display: flex;
  align-items: center; justify-content: center; }
.sr-party-mark:has(img) { background: #fff; padding: 3px; }
.sr-party-mark img { max-width: 100%; max-height: 100%; display: block; }
.sr-fine { color: var(--muted); font-size: 0.74rem; margin: 5px 0 0; line-height: 1.45; }
/* Stacked, not a flex row. The row fought .sr-form's `select { width: 100% }`:
   the first select claimed the full width and the second was squeezed to a bare
   chevron hanging off the edge of the panel. */
.sr-chain { display: grid; gap: 8px; margin-top: 8px; }
.sr-chain select { width: 100%; }
.sr-bar .meta { color: var(--muted); font-size: 0.8rem; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.sr-bar .spacer { flex: 1 1 auto; }
/* The filter row under the coverage cards. Its own class rather than .sr-bar:
   that is the page header's spacing (12px) and its own justification, and this
   row wants the cards' 10px and no auto margin pushing anything. */
/* THE PARTY BOARD. Its own table rather than .sr-tbl: that one is built for
   coverage rows (dense, numeric, many columns), and this is four columns where
   the middle one is an identity — emblem, name and code together, because a
   manager knows their code, a reader knows the name, and the emblem is what
   the ballot shows. */
.sr-parties { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.sr-parties thead th {
  position: sticky; top: 0; z-index: 1; background: var(--card);
  text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line);
}
.sr-parties td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.sr-parties tr:last-child td { border-bottom: 0; }
.sr-parties .rank { width: 34px; color: var(--muted); font-size: 0.8rem; }
.sr-parties .num { text-align: right; font-family: var(--sr-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sr-parties th.num { text-align: right; }
.sr-parties .num.z { color: var(--muted); }
.sr-parties .party { display: flex; align-items: center; gap: 9px; }
.sr-parties .sr-plogo { width: 22px; height: 22px; flex: none; display: inline-flex; }
.sr-parties .sr-plogo img { width: 22px; height: 22px; object-fit: contain; border-radius: 4px; }
.sr-parties .pname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* The code is the short name a manager actually says out loud, so it stays
   legible rather than becoming a footnote. */
.sr-parties .pcode {
  flex: none; font-size: 0.68rem; letter-spacing: 0.06em; color: var(--muted);
  border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px;
}
.sr-parties .sr-own td { background: rgba(212, 175, 55, 0.10); }
.sr-parties .sr-own .pname { font-weight: 600; }
/* THE LINE BETWEEN COUNTED AND NOT. Without it the zeros read as last place
   rather than as "no figure yet", which on a campaign console is the whole
   difference. */
.sr-parties .sr-divider td {
  padding: 10px 10px 4px; font-size: 0.66rem; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--muted); border-bottom: 0;
}

/* The party card's last row: the footnote on the left, the download on the
   right, the card's closing rule under both. .sr-count keeps its own rule, so
   it is lifted onto the row instead of drawn twice. */
.sr-foot {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; padding-top: 8px; margin-top: 8px;
  border-top: 1px solid var(--line);
}
.sr-foot .sr-count { flex: 1 1 240px; border-top: 0; margin-top: 0; padding-top: 0; }
.sr-foot .sr-btn { flex: none; }

/* WRAPS. Three of the four labels here are longer in Hausa, Igbo and Yoruba
   than in English — "Import roster (CSV)" is "Shigo da jeri (CSV)" — and a
   nowrap row squeezed them past the card edge on a narrow window. */
.sr-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 0 0 10px; }
.sr-tools .sr-sel { flex: 1 1 auto; min-width: 0; text-overflow: ellipsis; }
.sr-tools .sr-btn { flex: none; }
/* The spacer rule below is scoped to .sr-bar, so inside .sr-tools it was an
   inert div and the download button sat hard against the left edge. */
.sr-tools .spacer { flex: 1 1 auto; }
.sr-sel {
  background: var(--card); color: var(--ink); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 0.85rem;
}
.sr-btn {
  background: var(--card); color: var(--ink); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 12px; font: inherit; font-size: 0.85rem; cursor: pointer;
}
.sr-btn:hover { border-color: var(--accent); }
.sr-btn.primary { background: var(--accent); border-color: var(--accent); color: #06231a; font-weight: 600; }
.sr-btn.mini { padding: 3px 9px; font-size: 0.76rem; }
.sr-acts { display: flex; gap: 6px; justify-content: flex-end; }

/* --- tabs --- */
.sr-tabs { display: flex; gap: 4px; margin: 14px 0 0; border-bottom: 1px solid var(--line); }
.sr-tabs button {
  background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
  padding: 9px 14px; font: inherit; font-size: 0.9rem; cursor: pointer;
}
.sr-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

/* --- headline strip --- */
/* The confirm dialog. The browser's own is grey, says "hawkeye.com.ng says"
   and speaks the platform's language; this is the page's card on the page's
   scrim, and its buttons are ours to translate. */
.sr-ask { position: fixed; inset: 0; z-index: 200; background: rgba(0, 18, 12, 0.72);
  display: flex; align-items: center; justify-content: center; padding: 20px; }
.sr-ask-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 18px 18px 14px; max-width: 420px; width: 100%; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45); }
.sr-ask-card p { margin: 0 0 14px; line-height: 1.45; }
.sr-ask-btns { display: flex; gap: 10px; justify-content: flex-end; }
.sr-ask-input {
  width: 100%; box-sizing: border-box; margin: 0 0 16px; padding: 10px 12px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 9px; font: inherit; font-size: 0.95rem;
}
.sr-ask-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(11, 107, 58, 0.25); }
.sr-ask-input.num { font-family: var(--sr-mono); letter-spacing: 0.04em; }
/* A real dialog, for flows too big for a one-line prompt. The same ground and
   card as .sr-ask so it reads as the same family; the BODY scrolls, never the
   page behind it. */
.sr-sheet { max-width: 520px; padding: 0; display: flex; flex-direction: column;
  max-height: calc(100vh - 40px); max-height: calc(100dvh - 40px); }
.sr-sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 12px 12px 18px; border-bottom: 1px solid var(--line); }
.sr-sheet-head h2 { margin: 0; font-size: 1.02rem; line-height: 1.3; }
/* The close button is a DEFINED control, drawn like the dialog's own fields.
   Measured before: the global `button` rule gave it a soft box-shadow over a
   transparent background — a box you could almost see — and 13px/16px of
   padding that pushed the glyph 4px right and 4px down. Every property it
   inherits that matters is set here, and the x is an SVG drawn about its own
   centre: a text x sits wherever the font's baseline puts it. */
.sr-sheet-x { flex: none; width: 36px; height: 36px; margin: 0; padding: 0;
  display: grid; place-items: center; cursor: pointer; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: none; }
.sr-sheet-x svg { display: block; width: 16px; height: 16px; }
.sr-sheet-x:hover { border-color: var(--accent); }
.sr-sheet-x:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-sheet-body { padding: 16px 18px 18px; overflow-y: auto; overscroll-behavior: contain; }
/* INSIDE A DIALOG, THE DIALOG DOES THE SPACING. Measured, not guessed: the
   global button margin (16px) sat the close x below the title and opened a gap
   above every button row; the form's own 20px plus the first label's 14px left
   50px between the title rule and "Role"; and the coordinator fine print sat
   flush on the last dropdown with 40px under it. Scoped to .sr-sheet so the
   same classes elsewhere in the room do not move. */
.sr-sheet-x, .sr-sheet-body button { margin-top: 0; }
.sr-sheet:focus { outline: none; }
.sr-sheet-body .sr-form { margin-top: 0; }
.sr-sheet-body .sr-form > div:first-child > label:first-child { margin-top: 0; }
.sr-sheet-body .sr-form > div:last-child { margin-top: 6px; }
.sr-sheet-body .sr-fine { margin: 10px 0 2px; }
/* Invite link: the URL gets its own line, the count and the actions the next.
   One flex row squeezed a 94px column and wrapped the URL onto four lines. */
.sr-sheet-body .sr-link { display: grid; grid-template-columns: 1fr auto auto; gap: 8px 10px; align-items: center; }
.sr-sheet-body .sr-link code { grid-column: 1 / -1; word-break: break-all; }
.sr-inv-note { margin-top: 12px; font-size: 0.86rem; line-height: 1.45; opacity: 0.8; }
.sr-sheet-body #inv-new { margin-top: 12px; width: 100%; }
/* A new step in the area picker arrives rather than blinks in. Only the NEW
   select animates; the ones already answered never move. */
.sr-chain-in { animation: sr-chain-in 0.16s ease-out; }
@keyframes sr-chain-in { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .sr-chain-in { animation: none; } }
/* Tap, not just hover: a phone has no pointer to hover with, so a <title>
   tooltip is invisible there. The picked shape is outlined and its numbers are
   written out under the map. */
.sr-map path, .sr-map circle { cursor: pointer; }
.sr-map .is-picked { stroke: var(--accent); stroke-width: 2.6; stroke-opacity: 1; }
/* Zoom controls, over the map's top-right corner. 40px so a thumb can hit
   them on the phone this exists for. */
.sr-zoomable { position: relative; }
.sr-zoom { position: absolute; top: 10px; right: 10px; z-index: 2; display: flex; flex-direction: column; gap: 6px; }
.sr-zoom button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); font-size: 1.25rem; line-height: 1; cursor: pointer;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25); }
.sr-zoom button:disabled { opacity: 0.4; cursor: default; }
.sr-zoom button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-map.is-zoomed { cursor: grab; }
.sr-map-info { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px;
  background: var(--surface); font-size: 0.88rem; line-height: 1.4; flex: none; }
/* The install dialog is the same card wearing the crest: it is the first thing
   a manager sees before the browser's own prompt, and an unbranded box asking
   to install software is what people are taught to refuse. */
.sr-install { padding: 0; overflow: hidden; }
.sr-install-head {
  display: flex; align-items: center; gap: 12px;
  background: var(--header-bg); color: var(--header-ink);
  padding: 14px 18px; margin: 0 0 14px;
}
.sr-install-head img { border-radius: 10px; flex: none; }
.sr-install-head h3 { margin: 0; font-family: var(--display); font-size: 1.02rem; letter-spacing: -0.01em; }
.sr-install-head .sr-sub { margin: 2px 0 0; color: var(--header-sub); }
.sr-install > p { margin: 0 18px 14px; }
.sr-install .sr-ask-btns { padding: 0 18px 16px; }

.sr-heads { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 10px; margin: 16px 0; }
.sr-head { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; }
.sr-head b { display: block; font-size: 1.5rem; font-family: var(--sr-mono); font-variant-numeric: tabular-nums; line-height: 1.1; }
.sr-head span { display: block; color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 3px; }
.sr-head.ok b { color: var(--ok); } .sr-head.off b { color: var(--off); } .sr-head.wait b { color: var(--wait); }

/* --- crumbs + controls --- */
.sr-crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 0.86rem; margin: 4px 0 12px; }
.sr-crumbs button { background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer; padding: 2px 0; }
.sr-crumbs span { color: var(--muted); }
.sr-crumbs .now { color: var(--ink); font-weight: 600; }

/* --- table --- */
.sr-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.sr-tbl { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 720px; }
.sr-tbl th {
  text-align: right; padding: 9px 12px; color: var(--muted); font-weight: 600; font-size: 0.7rem;
  text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--line); white-space: nowrap;
}
.sr-tbl th:first-child, .sr-tbl td:first-child { text-align: left; }
.sr-tbl td { padding: 9px 12px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.sr-tbl tr:last-child td { border-bottom: 0; }
.sr-tbl tbody tr:hover { background: rgba(127, 127, 127, 0.06); }
.sr-tbl .drill { background: none; border: 0; color: var(--ink); font: inherit; cursor: pointer; text-align: left; padding: 0; }
.sr-tbl .drill:hover { color: var(--accent); text-decoration: underline; }
.sr-tbl .z { color: var(--idle); }
/* The team table holds no quantities — right-aligning place names against
   place names is a habit borrowed from the number columns next door. */
.sr-tbl.text th, .sr-tbl.text td { text-align: left; }
.sr-tbl .ok-t { color: var(--ok); }
.sr-tbl .off-t { color: var(--off); }
.sr-tbl .wait-t { color: var(--wait); }
/* The reader's own patch, in a standings table where every other row is
   somebody else's. A left rail rather than a fill: it has to survive a row that
   is already carrying four coloured numbers. */
.sr-tbl tr.mine td { background: rgba(127, 127, 127, 0.07); }
.sr-tbl tr.mine td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.sr-who { color: var(--muted); font-size: 0.72rem; }
.sr-who b { color: var(--ink); font-weight: 600; }

/* Coverage bar — the percentage AND the counts, because 8/10 and 8,000/10,000
   are the same percentage and only one of them needs people moved. */
.sr-bar-cell { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.sr-track { width: 66px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.sr-fill { height: 100%; background: var(--ok); border-radius: 3px; }

/* --- status pills --- */
.pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 7px; border-radius: 999px;
  font-size: 0.74rem; font-weight: 600; border: 1px solid currentColor; white-space: nowrap;
}
.pill i { font-style: normal; font-size: 0.8em; }
.pill.ok { color: var(--ok); } .pill.off { color: var(--off); }
.pill.wait { color: var(--wait); } .pill.idle { color: var(--idle); }

/* --- overview --- */
.sr-two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .sr-two { grid-template-columns: minmax(0, 1fr); } }
.sr-h2 { font-family: var(--display); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--muted); margin: 4px 0 9px; font-weight: 600; }
.sr-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 13px; margin-bottom: 20px; }
/* One panel height for both columns, so the map and the gap list read as a pair
   rather than two cards that happen to sit side by side. The lists scroll INSIDE
   it: truncating to the worst six hid the rest of the election, and "most
   missing" is exactly the list a manager needs to reach the bottom of. */
.sr-panel { height: 340px; display: flex; flex-direction: column; }
.sr-scroll { overflow-y: auto; flex: 1 1 auto; margin: -2px -4px 0; padding: 2px 4px 0; }
.sr-scroll::-webkit-scrollbar { width: 8px; }
.sr-scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
.sr-count { color: var(--muted); font-size: 0.72rem; padding-top: 8px; border-top: 1px solid var(--line); margin-top: 8px; }
.sr-card .sr-tbl td { padding: 7px 6px; }
.sr-map { width: 100%; height: auto; flex: 1 1 auto; min-height: 0; display: block; color: var(--ink); }
.sr-act { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--line); }
.sr-act:last-child { border-bottom: 0; }
.sr-act-t { flex: 1 1 auto; min-width: 0; font-size: 0.84rem; line-height: 1.35; }
.sr-act-t b { font-weight: 600; }
.sr-act-w { color: var(--muted); font-size: 0.74rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
/* Party totals. The own-party row is OUTLINED, not filled: the four coverage
   states already own filled colour, and a fifth filled meaning would make the
   accent stop meaning anything. */
.sr-mine { display: flex; align-items: center; gap: 11px; padding: 2px 2px 12px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.sr-mine b { font-size: 1.35rem; }
.sr-plogo { width: 18px; height: 18px; border-radius: 4px; background: #fff; object-fit: contain; vertical-align: -4px; margin-right: 7px; }
.sr-tbl tr.sr-own td { box-shadow: inset 0 1px 0 var(--accent), inset 0 -1px 0 var(--accent); }
.sr-tbl tr.sr-own td:first-child { box-shadow: inset 1px 1px 0 var(--accent), inset 0 -1px 0 var(--accent); }
.sr-tbl tr.sr-own td:last-child { box-shadow: inset -1px 1px 0 var(--accent), inset 0 -1px 0 var(--accent); }

/* --- panels, notes, empty states --- */
.sr-note {
  background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--accent);
  border-radius: 8px; padding: 12px 14px; margin: 14px 0; font-size: 0.85rem; color: var(--muted); line-height: 1.55;
}
.sr-note strong { color: var(--ink); }
.sr-empty { text-align: center; padding: 44px 20px; }
.sr-empty h2 { font-family: var(--display); font-size: 1.25rem; margin: 0 0 8px; }
.sr-empty p { color: var(--muted); max-width: 46ch; margin: 0 auto 8px; font-size: 0.9rem; line-height: 1.6; }
.sr-form { max-width: 420px; margin: 20px auto 0; display: grid; gap: 10px; text-align: left; }
.sr-form label { font-size: 0.76rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.sr-form input, .sr-form select {
  width: 100%; background: var(--card); color: var(--ink); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 11px; font: inherit; font-size: 0.9rem;
}
.sr-link {
  display: flex; gap: 8px; align-items: center; margin-top: 10px;
  background: var(--bg); border: 1px dashed var(--line); border-radius: 8px; padding: 9px 11px;
}
.sr-link code { flex: 1 1 auto; font-family: var(--sr-mono); font-size: 0.78rem; overflow: hidden; text-overflow: ellipsis; }
.sr-legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 12px 0 0; font-size: 0.76rem; color: var(--muted); }
/* Full-height column: header, then everything else scrolling under it.
   POINTER-COARSE SCREENS ARE LEFT ALONE. On a phone the header hides itself on
   scroll-down (menu.js toggles .hdr-hidden from the window's scroll), and that
   listener never fires once the document stops scrolling — so a phone would
   trade a vanishing header for a permanent one and lose a header's worth of
   vertical space on the smallest screens. The gain here is a desktop window's
   chrome; the cost lands somewhere else entirely. */
@media (min-width: 701px) {
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  /* Sticky was doing the work the flex column now does, and a sticky element
     inside a flex column still reserves its own space — it has to go static or
     the header would scroll away under itself. */
  .gov-header { position: static; flex: 0 0 auto; }
  #sr-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  /* A dialog locks the PANE now. body already has overflow:hidden here, so the
     inline style the dialogs used to set had nothing left to do. */
  html.modal-open #sr-scroll { overflow: hidden; }
}

/* SCROLLBARS THAT GET OUT OF THE WAY.
   Installed as a desktop app this is a window of its own, and the platform's
   grey trough down the right-hand side is the one part of it that still reads
   as a browser. The thumb is transparent at rest and appears while the pane is
   being scrolled or hovered.

   IT IS HIDDEN, NOT REMOVED: the gutter stays reserved (the thumb is
   transparent rather than zero-width), so nothing reflows as it fades in, and a
   pane that can scroll still SAYS so the moment you touch it — a scrollbar that
   never appeared at all would leave a long roster looking like a short one.
   .scrolling is set on <html> for ~900ms after any scroll, capture-phase so
   inner panes count too. */
* { scrollbar-width: thin; scrollbar-color: transparent transparent; }
*:hover { scrollbar-color: color-mix(in srgb, var(--muted) 55%, transparent) transparent; }
html.scrolling, html.scrolling * { scrollbar-color: color-mix(in srgb, var(--muted) 55%, transparent) transparent; }
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb {
  background: transparent; border-radius: 10px;
  border: 3px solid transparent; background-clip: content-box;
  transition: background-color 0.18s ease;
}
*:hover::-webkit-scrollbar-thumb,
html.scrolling::-webkit-scrollbar-thumb,
html.scrolling *::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--muted) 55%, transparent); background-clip: content-box;
}
*::-webkit-scrollbar-thumb:hover { background: var(--muted); background-clip: content-box; }
/* Touch already hides its scrollbars and has no hover to bring them back, so
   the reveal would never fire — leave those alone entirely. */
@media (hover: none) {
  * { scrollbar-color: auto; }
  ::-webkit-scrollbar-thumb { background: initial; }
}

.sr-msg { padding: 26px; text-align: center; color: var(--muted); font-size: 0.88rem; }
.sr-sub { color: var(--muted); font-size: 0.75rem; display: block; margin-top: 2px; }
@media (max-width: 640px) { .sr-bar h1 { width: 100%; } }
</style>
</head>
<body>
  <header class="gov-header">
    <div class="wrap brand-row">
      <!-- THE CREST REFRESHES. On every other page it goes home; here home is
           the public site and a manager watching a live room who taps the logo
           lost the room. Reload is what they meant. -->
      <a class="brand" href="" id="sr-brand">
        <span class="crest" aria-hidden="true"><img src="icon-192.png?v=hawk2" alt="" width="30" height="30" style="display:block;border-radius:7px" /></span>
        <div class="brand-text">
          <strong>HAWKEYE</strong>
          <span data-i18n="nav.situation-room">Situation Room</span>
        </div>
      </a>
      <!-- The language button is STATIC and the painted actions sit beside it in
           a display:contents wrapper, so it survives every repaint of
           #sr-actions. That block is filled only once a room has loaded, so a
           button inside it would leave a manager with no room — the setup
           screen — unable to change language at all. First in the group, so it
           reads immediately before Invite observers. -->
      <div class="sr-hdr-actions">
        <button id="lang-btn" type="button" title="Language">EN</button>
        <!-- Hidden until the browser says the app is installable: a button that
             does nothing when pressed is worse than no button, and Firefox and
             most in-app browsers never fire the event. -->
        <button id="install-btn" type="button" hidden></button>
        <div id="sr-actions" style="display:contents"></div>
      </div>
    </div>
  </header>

  <!-- THE PAGE SCROLLS BELOW THE HEADER, NOT BESIDE IT. The scrollbar used to
       belong to the document, so it ran the full height of the window and cut
       the green bar short — the one element that should read as edge-to-edge
       chrome had a grey strip beside it. This pane owns the scrolling instead;
       the header is a flex sibling above it and spans the whole width.
       A wrapper rather than scrolling .sr itself, because .sr is centred at a
       max-width and its scrollbar would have appeared in the middle of the
       page rather than at the edge of the window. -->
  <div id="sr-scroll">
    <main class="sr" id="sr">
      <div class="sr-msg" data-i18n="index.loading">Loading…</div>
    </main>
  </div>

<script>
/**
 * Situation room — the read console for a campaign or CSO group.
 *
 * THE SENTENCE THIS SCREEN HAS TO KEEP TRUE: a group never gains visibility
 * into the count. Everything here comes off the same public feed everybody
 * else reads; the group layer only says which of those public reports came
 * from its own people. That is printed in the UI, not just in the code — it is
 * what a rival campaign is owed when they ask what this dashboard can see.
 */
const API = '';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const n = (v) => Number(v || 0).toLocaleString('en-NG');
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);

/**
 * Every screen here is painted by script, so translation runs through T() and
 * the page REPAINTS on 'hawkeye-lang' — dispatched by i18n.js on `document`,
 * not window, and as a NON-BUBBLING CustomEvent, so a window listener never
 * hears it (that is exactly how join.html kept rendering English under Hausa).
 * render() is the whole console's entry point, so one listener covers every tab.
 */
const T = (k, en, vars) => {
  let s = window.HawkeyeI18n ? window.HawkeyeI18n.t(k, en) : en;
  for (const [a, b] of Object.entries(vars || {})) s = s.split('{' + a + '}').join(b);
  return s;
};
/* REPAINT ON A LANGUAGE CHANGE, AND SAY SO WHEN IT FAILS. The header actions
   are painted by render(), so a throw in here leaves them in the old language
   while the rest of the page changes under them. Swallowed, that looked like
   "the buttons need a reload" for as long as it went unnoticed. */
/* The party card is rewritten on every render, so the button is bound by
   delegation rather than by id -- and there are two cards on screen when a
   manager has an area of their own. */
document.addEventListener('click', (e) => {
  const b = e.target && e.target.closest && e.target.closest('[data-party-csv]');
  if (!b) return;
  const area = b.getAttribute('data-party-csv');
  const t = (S.areaTally && area && area.indexOf('(') > 0) ? S.areaTally : S.tally;
  if (t) exportPartyCsv(t, area);
});

/* INSTALL, WHEN THE BROWSER OFFERS IT. Chrome and Edge fire this instead of
   showing their own prompt; we keep the event and spend it on a real button.
   Nothing here runs on a browser that does not fire it, which is the point of
   binding the button's visibility to the event rather than to a user agent. */
let installPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  installPrompt = e;
  const b = $('install-btn');
  if (!b) return;
  b.textContent = T('situation-room.install', 'Install');
  b.title = T('situation-room.install-title', 'Install the situation room as a desktop app');
  b.hidden = false;
});
window.addEventListener('appinstalled', () => {
  installPrompt = null;
  const b = $('install-btn');
  if (b) b.hidden = true;
});
document.addEventListener('click', async (e) => {
  if (!e.target || !e.target.closest || !e.target.closest('#install-btn') || !installPrompt) return;
  const yes = await askInstall();
  if (!yes || !installPrompt) return;   // "not now" keeps the prompt for later
  const p = installPrompt;
  installPrompt = null;
  $('install-btn').hidden = true;
  p.prompt();
});

/* The branded half of the install. The browser's dialog follows this one and
   is not ours to style; this is where the room gets to say what the thing is. */
function askInstall() {
  return new Promise((resolve) => {
    const box = document.createElement('div');
    box.className = 'sr-ask';
    box.innerHTML = `<div class="sr-ask-card sr-install" role="alertdialog" aria-modal="true"
        aria-labelledby="sr-install-title">
      <div class="sr-install-head">
        <img src="icon-192.png?v=hawk3" alt="" width="44" height="44" />
        <div>
          <h3 id="sr-install-title">${esc(T('situation-room.install-heading', 'Install the Situation Room'))}</h3>
          <p class="sr-sub">${esc(T('situation-room.install-sub', 'Hawkeye · for this computer'))}</p>
        </div>
      </div>
      <p>${esc(T('situation-room.install-body',
      'It opens in its own window instead of a tab, keeps its place in your task switcher, and stays signed in. Remove it later like any other app.'))}</p>
      <div class="sr-ask-btns">
        <button type="button" class="sr-btn" data-no>${esc(T('lang.later', 'Not now'))}</button>
        <button type="button" class="sr-btn primary" data-yes>${esc(T('situation-room.install', 'Install'))}</button>
      </div></div>`;
    const done = (v) => { box.remove(); document.documentElement.classList.remove('modal-open'); resolve(v); };
    box.addEventListener('click', (ev) => { if (ev.target === box) done(false); });
    box.querySelector('[data-no]').addEventListener('click', () => done(false));
    box.querySelector('[data-yes]').addEventListener('click', () => done(true));
    document.addEventListener('keydown', function esc2(ev) {
      if (ev.key === 'Escape') { document.removeEventListener('keydown', esc2); done(false); }
    });
    document.body.appendChild(box);
    document.documentElement.classList.add('modal-open');
    box.querySelector('[data-yes]').focus();
  });
}

/* B. KEYBOARD, BECAUSE THIS IS A DESK. A dashboard watched for twelve hours is
   worked with both hands; these are the four things a manager does over and
   over. Ignored while typing, so a search box never eats a shortcut — and no
   modifier keys, which belong to the browser and the OS. */
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const el = document.activeElement;
  const tag = el && el.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (el && el.isContentEditable)) return;
  const tabs = [...document.querySelectorAll('.sr-tabs [role="tab"]')];
  if (e.key >= '1' && e.key <= String(Math.min(9, tabs.length)) && tabs.length) {
    tabs[Number(e.key) - 1].click();
    return;
  }
  if (e.key === 'r' || e.key === 'R') { const b = $('refresh-btn'); if (b) b.click(); }
  else if (e.key === 'i' || e.key === 'I') { const b = $('invite-btn'); if (b) b.click(); }
  else if (e.key === 'Escape') { const d = document.querySelector('.sr-ask [data-no]'); if (d) d.click(); }
});

document.addEventListener('hawkeye-lang', () => {
  try { render(); } catch (e) { console.error('[room] repaint after a language change failed', e); }
});

/* The room has its own header, so menu.js never runs here — this is the same
   one-tap-next-language button it injects everywhere else, wired by hand. It
   lives in the static header, so it works on every state of the page including
   the setup screen, and it repaints its own code on every language change. */
(function langButton() {
  const b = $('lang-btn');
  if (!b) return;
  const paint = () => {
    b.textContent = (window.HawkeyeI18n ? window.HawkeyeI18n.current : 'en').toUpperCase();
    b.title = T('lang.current', 'Language');
  };
  b.addEventListener('click', () => {
    if (window.HawkeyeLang) (window.HawkeyeLang.cycle || window.HawkeyeLang.open)();
  });
  document.addEventListener('hawkeye-lang', paint);
  paint();
})();
/* Rounding 4 units in 13,327 to "0%" tells a manager the night has not started
   when in fact it has. Below 1% the first significant digit is the whole
   message, so keep it. */
const finePct = (a, b) => {
  if (!b) return '0%';
  const p = (a / b) * 100;
  return (p > 0 && p < 1 ? p.toFixed(p < 0.1 ? 2 : 1) : Math.round(p)) + '%';
};

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      'content-type': 'application/json',
      authorization: 'Bearer ' + (localStorage.getItem('hawkeye_token') || ''),
      ...(opts.headers || {}),
    },
  });
  const body = await res.json().catch(() => ({}));
  if (res.status === 401) { location.replace('observe.html?intent=signin&next=' + encodeURIComponent(
    URL_SLUG ? 'situation-room.html?room=' + URL_SLUG : 'situation-room.html')); throw new Error('signed out'); }
  return { status: res.status, body };
}

const S = {
  groups: [], gid: null, group: null, tab: 'overview',
  path: { state: '', lga: '', ward: '' },
  filter: 'all', incFilter: 'all', sort: 'status', coverage: null, team: null, invites: [],
};

/* --- shell ------------------------------------------------------------- */

/**
 * WHAT THIS READER MAY DO, as one number — the same ladder the server keeps in
 * routes/groups.js. Held in both places on purpose: the server's copy is the
 * rule, this one only decides which buttons are worth drawing. A screen that
 * offers an action the server will refuse teaches people the room is broken.
 */
const RANKS = { zone: 2, state: 3, lga: 4, ward: 5 };
const rankOfRow = (r) => (!r ? 99
  : r.role === 'owner' ? 0 : r.role === 'manager' ? 1 : (RANKS[r.scope_kind] ?? 99));
const myRank = () => rankOfRow((S.group || {}).me);
const iAmOwner = () => myRank() === 0;
/* A plain member of the roster reads the room and changes nothing in it. */
const iManage = () => myRank() < 99;
/* Nothing sits below a ward, so a ward coordinator appoints nobody. */
const iDelegate = () => myRank() <= 4;
const roleRowOf = (obsId) => ((S.group || {}).managers || []).find((x) => x.observer_id === obsId) || null;
/* Strictly below me, and never the owner — see canActOn() on the server. */
const iOutrank = (obsId) => {
  const t = roleRowOf(obsId);
  if (!t) return true;
  if (t.role === 'owner') return false;
  return rankOfRow(t) > myRank();
};

function render() {
  if (!S.groups.length) return renderWelcome();
  const g = S.group || {};
  const scope = g.scope || T('situation-room.nationwide', 'Nationwide');
  $('sr').innerHTML = `
    <div class="sr-bar">
      ${g.party && LOGOS[g.party] ? `<span class="sr-emblem"><img src="${esc(LOGOS[g.party])}" alt="${esc(g.party)}" /></span>` : ''}
      <h1>${esc(g.name || '')}</h1>
      <div class="meta">
        ${[
          g.kind === 'cso' ? T('situation-room.civil-society', 'Civil society')
            : T('my-groups.kind-campaign', 'Campaign'),
          g.party || '',
          g.contest || '',
          scope,
          g.members === 1
            ? T('situation-room.n-observer', '{v0} observer', { v0: n(g.members) })
            : T('situation-room.n-observers', '{v0} observers', { v0: n(g.members) }),
        ].filter(Boolean).map((x) => `<span>${esc(x)}</span>`).join('')}
      </div>
      <div class="spacer"></div>
      ${S.groups.length > 1 ? `<select class="sr-sel" id="gpick">${S.groups.map((x) =>
        `<option value="${x.id}"${x.id === S.gid ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}</select>` : ''}
    </div>
    <div class="sr-tabs" role="tablist">
      <button role="tab" aria-selected="${S.tab === 'overview'}" data-tab="overview" title="1">${T('situation-room.overview', 'Overview')}</button>
      <button role="tab" aria-selected="${S.tab === 'coverage'}" data-tab="coverage" title="2">${T('situation-room.coverage', 'Coverage')}</button>
      <button role="tab" aria-selected="${S.tab === 'team'}" data-tab="team" title="3">${T('situation-room.team', 'Team')}</button>
      <button role="tab" aria-selected="${S.tab === 'incidents'}" data-tab="incidents" title="4">${T('situation-room.incidents', 'Incidents')}</button>
    </div>
    <div id="sr-body"><div class="sr-msg">${T('index.loading', 'Loading…')}</div></div>`;

  /* The four console actions live in the green header bar. Painted here rather
     than in the static markup because two of them depend on the group: only a
     non-owner can sign out, and the tooltip has to say which case this is. */
  const owner = iAmOwner();
  /* An observer on the roster gets the room and none of its levers: no invite
     link to hand out, no room to create, nothing to leave (leaving the campaign
     is on their own groups page, where joining it was). Refresh and the address
     are reading, so they keep those. */
  $('sr-actions').innerHTML =
    (iManage() ? `<button id="invite-btn">${T('situation-room.invite-observers', 'Invite observers')}</button>`
      + `<button id="new-btn" title="${T('situation-room.title-set-up-another-room', 'Set up another situation room')}">${T('situation-room.new-room', 'New room')}</button>` : '')
    + `<button id="refresh-btn" title="${T('situation-room.title-reload-from-the-live-feed', 'Reload from the live feed')}">${T('situation-room.refresh', 'Refresh')}</button>`
    + `<button id="link-btn" title="${T('situation-room.title-copy-this-rooms-address', 'Copy this room’s address')}">${T('situation-room.copy-link', 'Copy link')}</button>`
    + (owner ? `<button id="rename-btn" title="${T('situation-room.title-rename-this-campaign', "Change what this campaign is called")}">${T('situation-room.rename-campaign', "Rename")}</button>` : '')
    + (owner ? `<button id="del-btn" title="${T('situation-room.title-delete-this-room', 'Delete this room')}">${T('situation-room.delete', 'Delete')}</button>` : '')
    + (iManage() ? `<button id="leave-btn"${owner ? ' disabled' : ''} title="${owner
      ? T('situation-room.title-owner-cannot-step-back', 'The owner cannot step back from their own room')
      : T('situation-room.title-stop-managing-this-room', 'Stop managing this room')}">${T('situation-room.sign-out', 'Sign out')}</button>` : '');
  $('gpick') && $('gpick').addEventListener('change', (e) => { pickGroup(Number(e.target.value)); });
  if ($('invite-btn')) $('invite-btn').addEventListener('click', () => showInvite());
  if ($('rename-btn')) $('rename-btn').addEventListener('click', renameRoom);
  /* The actions are painted once per render, so a language change left them in
     the old language until the next reload -- the one part of the page that
     did not follow the button next to it. */
  $('refresh-btn').addEventListener('click', () => loadTab(true));
  /* "New room", not a wizard — a manager who runs a campaign AND a state
     watchdog needs two rooms, and the switcher above already handles having
     them. This just gets back to the setup form. */
  /* KEEP THE ROOMS. Clearing the list was how the form knew to show, but it
     also stranded a manager on it with no way back. Held aside instead, and
     the form offers Cancel while they are. */
  if ($('new-btn')) $('new-btn').addEventListener('click', () => { S.groupsHeld = S.groups; S.groups = []; renderWelcome(); });
  if ($('leave-btn')) $('leave-btn').addEventListener('click', leaveRoom);
  $('link-btn').addEventListener('click', () => {
    // The room's address, not the current tab's URL — a manager who arrived at
    // /situation-room.html would otherwise copy a link that opens whichever
    // room the RECIPIENT happens to have first.
    navigator.clipboard.writeText(location.origin + '/room/' + (g.slug || ''))
      .then(() => { $('link-btn').textContent = T('support.copied', 'Copied'); });
  });
  if ($('del-btn')) $('del-btn').addEventListener('click', deleteRoom);
  document.querySelectorAll('.sr-tabs button').forEach((b) =>
    b.addEventListener('click', () => { S.tab = b.dataset.tab; render(); loadTab(); }));
  loadTab();
}

/* THE EMPTY STATE IS DESIGNED FIRST, on purpose. A manager opens this weeks
   before polls with every number at zero, and that is exactly when they decide
   whether this product is worth funding. Show them the plan, not a void. */
/* CONTEST NAMES ARE DATA, and the API sends them in English. The five standing
   races are held as keys; a by-election is "<race> By-Election (<place>)",
   where the place is a proper noun that must survive verbatim. */
const CONTEST_KEY = {
  Presidential: 'contest.presidential',
  Presidency: 'contest.presidential',
  Senate: 'contest.senate',
  'House of Representatives': 'contest.house-of-representatives',
  Governorship: 'contest.governorship',
  'State House of Assembly': 'contest.state-house-of-assembly',
};
function contestName(en) {
  const s = String(en || '');
  const m = s.match(/^(.*?) By-Election(.*)$/);
  if (m) {
    return T('contest.by-election',
      '{v0} By-Election{v1}', { v0: T(CONTEST_KEY[m[1]] || 'x', m[1]), v1: m[2] });
  }
  return T(CONTEST_KEY[s] || 'x', s);
}

/**
 * The setup form, which has to land on exactly ONE race.
 *
 * "Governorship" is not a race — twenty-eight of them are held that day, and
 * the first version asked for a contest and then a free-text state, which is
 * naming a race in two halves with no way to be told you got it wrong. A typo
 * returned an empty coverage tree that looked exactly like an election nobody
 * had reported yet.
 *
 * So the controls appear as the answer narrows, and what appears depends on
 * what the race is drawn on: the presidency needs nothing, a governorship needs
 * its state, a Senate seat needs a state and then its senatorial district.
 * The server decides which — see /group-races — because the register is what
 * knows, and a race offered here has to be one the tree can actually count.
 */
function bindSetupCancel() {
  const b = $('mk-cancel');
  if (!b) return;
  b.addEventListener('click', () => { S.groups = S.groupsHeld; S.groupsHeld = null; render(); });
}

async function setupForm() {
  bindSetupCancel();
  const { body } = await api('/api/contests');
  const list = Array.isArray(body) ? body : [];
  $('mk-contest').innerHTML = list.map((c) =>
    `<option value="${esc(c.code)}">${esc(contestName(c.name || c.label || c.code))}</option>`).join('')
    || `<option value="PRES">${T('situation-room.presidential', 'Presidential')}</option>`;

  // Party emblems, from the manifest the ballot boards already use.
  const logos = await (window.fetchData ? window.fetchData('logos/manifest.json') : fetch('logos/manifest.json'))
    .then((r) => r.json()).catch(() => ({}));
  $('mk-party').innerHTML = `<option value="">${T('situation-room.not-saying', 'Not saying')}</option>`
    + Object.keys(logos).sort().map((k) => `<option value="${esc(k)}">${esc(k)}</option>`).join('');
  const paintMark = () => {
    const p = $('mk-party').value;
    $('mk-party-mark').innerHTML = p && logos[p] ? `<img src="${esc(logos[p])}" alt="" />` : '';
  };
  $('mk-party').addEventListener('change', paintMark);
  $('mk-kind').addEventListener('change', () => {
    $('mk-party-row').hidden = $('mk-kind').value !== 'campaign';
    if ($('mk-party-row').hidden) { $('mk-party').value = ''; paintMark(); }
  });

  const LABEL = {
    senatorial: T('situation-room.senatorial-district', 'Senatorial district'),
    federal_constituency: T('situation-room.federal-constituency', 'Federal constituency'),
  };
  let shape = { kind: 'national' };

  async function loadRaces(state) {
    const q = '?contest=' + encodeURIComponent($('mk-contest').value) + (state ? '&state=' + encodeURIComponent(state) : '');
    shape = (await api('/api/group-races' + q)).body;
    const twoStep = shape.kind === 'senatorial' || shape.kind === 'federal_constituency';

    $('mk-state-row').hidden = shape.kind === 'national';
    $('mk-race-row').hidden = !twoStep || !state;
    $('mk-race-label').textContent = LABEL[shape.kind] || T('situation-room.seat', 'Seat');

    if (!state) {
      $('mk-state').innerHTML = `<option value="">${T('situation-room.choose-a-state', 'Choose a state…')}</option>`
        + (shape.states || []).map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
    }
    if (twoStep && state) {
      $('mk-race').innerHTML = `<option value="">${T('situation-room.choose-a-seat', 'Choose a seat…')}</option>`
        + (shape.races || []).map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
    }
    $('mk-race-note').textContent = shape.kind === 'national'
      ? T('situation-room.note-national', 'One nationwide race — every polling unit in the country.')
      : twoStep
        ? T('situation-room.note-seat-is-the-race', 'A {v0} is the race here, not the whole state.',
          { v0: (LABEL[shape.kind] || T('situation-room.seat', 'Seat')).toLowerCase() })
        : T('situation-room.note-state-is-the-race', 'The state is the race.');
  }

  $('mk-contest').addEventListener('change', () => { $('mk-state').value = ''; loadRaces(''); });
  $('mk-state').addEventListener('change', () => {
    if (shape.kind === 'senatorial' || shape.kind === 'federal_constituency') loadRaces($('mk-state').value);
  });
  await loadRaces('');

  $('mk').addEventListener('submit', async (e) => {
    e.preventDefault();
    const twoStep = shape.kind === 'senatorial' || shape.kind === 'federal_constituency';
    const scope = shape.kind === 'national' ? '' : twoStep ? $('mk-race').value : $('mk-state').value;
    if (shape.kind !== 'national' && !scope) return alert(T('situation-room.pick-the-race-this-room-is-watching', 'Pick the race this room is watching.'));
    const { status, body } = await api('/api/groups', {
      method: 'POST',
      body: JSON.stringify({
        name: $('mk-name').value.trim(), kind: $('mk-kind').value,
        party: $('mk-party').value, contest: $('mk-contest').value, scope,
      }),
    });
    if (status !== 201) return alert(body.error === 'unknown_scope' ? 'That race is not in the register.' : (body.error || 'Could not create the group.'));
    await boot(body.id);
  });
}

/** Printed on screen, not just in the source. See the header comment. */
function disclosureHtml() {
  /* ONE key for the whole disclosure, markup travelling inside it. Keying the
     lead and leaving the rest gave a Hausa heading over an English paragraph,
     and keying `already-public` alone would ask a translator for a fragment
     whose place in the sentence is not an invariant across languages. */
  return `<div class="sr-note" style="max-width:560px;margin:24px auto 0;text-align:left">
    ${T('situation-room.disclosure',
    '<strong>What this can and cannot see.</strong> Every figure here comes from the same public feed as the rest of Hawkeye — this room gets no early access, no unpublished numbers, and no sight of any other group’s observers. It shows which of the <em>already-public</em> reports came from your people, and only from the moment they joined: their earlier reports are not yours to see.')}
  </div>`;
}

/* --- coverage ---------------------------------------------------------- */

async function loadTab(force) {
  const body = $('sr-body');
  if (!body) return;
  if (S.tab === 'overview') {
    /* The ROOT level, always — Overview answers "where do I stand", and a
       manager who drilled into one ward an hour ago did not mean to make that
       the definition of standing. Cached apart from S.coverage for that reason. */
    if (force || !S.overview) {
      /* The tally is counted by services/tally.js — the SAME function the
         public board uses — never by a second query of our own. It carries a
         rule that is easy to miss: disputed results are excluded from the
         headline and judged separately on the docket. A separate tally would
         drift the first time that rule changed, and a campaign would believe
         its own screen. The room endpoint only crops: to this race (the public
         board can crop to a state, not a Senate district) and, with ?mine=1, to
         a coordinator's own area. */
      const me = S.group.me || {};
      const [cov, act, nat, own] = await Promise.all([
        api('/api/groups/' + S.gid + '/coverage'),
        api('/api/groups/' + S.gid + '/activity'),
        api('/api/groups/' + S.gid + '/tally'),
        me.scope_kind && me.scope_value ? api('/api/groups/' + S.gid + '/tally?mine=1') : null,
      ]);
      S.overview = cov.body;
      S.activity = act.body;
      S.tally = nat.status === 200 ? nat.body : null;
      S.areaTally = own && own.status === 200 ? own.body : null;
    }
    return renderOverview();
  }
  if (S.tab === 'incidents') {
    if (force || !S.incidents) S.incidents = (await api('/api/groups/' + S.gid + '/incidents')).body;
    return renderIncidents();
  }
  if (S.tab === 'coverage') {
    if (force || !S.coverage) {
      const q = new URLSearchParams();
      for (const k of ['state', 'lga', 'ward']) if (S.path[k]) q.set(k, S.path[k]);
      const { body: c } = await api('/api/groups/' + S.gid + '/coverage' + (q.toString() ? '?' + q : ''));
      S.coverage = c;
    }
    renderCoverage();
  } else {
    if (force || !S.team) S.team = (await api('/api/groups/' + S.gid + '/team')).body;
    /* The rooms this owner could lift a roster FROM, fetched beside the team
       because that is the only tab that offers it. Owner-only on the server
       too; a non-owner asking gets a 403 and an empty list here, which is
       exactly what the block wants. */
    if (iAmOwner() && (force || !S.sources)) {
      const r = await api('/api/groups/' + S.gid + '/sources');
      S.sources = r.status === 200 ? (r.body.sources || []) : [];
    }
    renderTeam();
  }
}

/* --- overview ----------------------------------------------------------- */

const timeAgo = (ms) => {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 90) return 'just now';
  const m = Math.round(s / 60);
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  return h < 24 ? h + ' hr ago' : Math.round(h / 24) + ' d ago';
};

/**
 * The screen a manager opens first, answering one question: where do I stand,
 * and where do I send the next person.
 *
 * NOT a second copy of Coverage. The tree is for working a specific place; this
 * is for deciding which place. So the gap list is ranked by UNREPORTED UNITS,
 * not by percentage — a 60%-covered LGA with 700 units has more of the election
 * missing than a 0%-covered one with 12, and sorting by percentage puts the
 * small one on top every time.
 */
function renderOverview() {
  const c = S.overview || { nodes: [] };
  const nodes = c.nodes || [];
  const tot = nodes.reduce((a, x) => ({
    units: a.units + x.units, reported: a.reported + x.reported,
    assigned: a.assigned + x.assigned, on_unit: a.on_unit + x.on_unit, mismatched: a.mismatched + x.mismatched,
  }), { units: 0, reported: 0, assigned: 0, on_unit: 0, mismatched: 0 });
  const silent = Math.max(0, tot.assigned - tot.on_unit - tot.mismatched);
  /* Worst first, and ALL of them. Truncating to six hid most of the election
     behind a list that looked complete — and "most missing" is precisely the
     list a manager needs to reach the bottom of. Ranked by unreported UNITS,
     not percentage: a 60%-covered LGA with 700 units has more of the election
     missing than a 0%-covered one with twelve. Units another observer has
     saved (`watched`) rank below the ones nobody is standing at. */
  const open = (x) => x.units - x.reported - (x.watched || 0);
  const gaps = nodes.slice()
    .sort((a, b) => open(b) - open(a) || (b.units - b.reported) - (a.units - a.reported) || a.name.localeCompare(b.name));
  const reports = (S.activity && S.activity.reports) || [];

  /**
   * A coordinator's own area, beside the campaign's total.
   *
   * THE CONFUSION THIS FIXES: scoped to one state, a coordinator saw "12%
   * covered" and had no way to tell whether that was ahead or behind. A number
   * with no denominator a person recognises is not information. Their patch and
   * the whole race, side by side, and the gap between them named.
   */
  const mineNodes = c.mine ? nodes.filter((x) => isMine(c, x.key)) : [];
  const mineTot = mineNodes.reduce((a, x) => ({ units: a.units + x.units, reported: a.reported + x.reported }),
    { units: 0, reported: 0 });
  const minePct = mineTot.units ? (mineTot.reported / mineTot.units) * 100 : 0;
  const allPct = tot.units ? (tot.reported / tot.units) * 100 : 0;
  const delta = Math.round((minePct - allPct) * 10) / 10;

  $('sr-body').innerHTML = `
    ${mineNodes.length ? `<div class="sr-note" style="border-left-color:var(--ok)">
      ${T('situation-room.my-area-line', '<strong>{area}</strong> — <span class="num">{rep}</span> of <span class="num">{units}</span> units (<span class="num">{pct}</span>).', {
    area: esc(c.my_scope ? c.my_scope.value : T('situation-room.your-area', 'Your area')),
    rep: n(mineTot.reported),
    units: n(mineTot.units),
    pct: finePct(mineTot.reported, mineTot.units),
  })}
      ${T('situation-room.my-area-vs-race', 'The whole {race} race is at <span class="num">{pct}</span>, so you are {delta}.', {
    race: esc(S.group.contest),
    pct: finePct(tot.reported, tot.units),
    delta: delta === 0
      ? T('situation-room.level-with-it', 'level with it')
      : delta > 0
        ? `<b style="color:var(--ok)">${delta === 1
          ? T('situation-room.point-ahead', '{n} point ahead', { n: delta })
          : T('situation-room.points-ahead', '{n} points ahead', { n: delta })}</b>`
        : `<b style="color:var(--wait)">${Math.abs(delta) === 1
          ? T('situation-room.point-behind', '{n} point behind', { n: Math.abs(delta) })
          : T('situation-room.points-behind', '{n} points behind', { n: Math.abs(delta) })}</b>`,
  })}
      ${T('situation-room.you-manage-the-observers-in-your-area', 'You manage the observers in your area; the totals are the campaign’s.')}
    </div>` : ''}
    <div class="sr-heads">
      <div class="sr-head"><b class="num">${n(tot.reported)}</b><span>${T('situation-room.of-units-reported', 'of {n} units reported', { n: n(tot.units) })}</span></div>
      <div class="sr-head"><b class="num">${finePct(tot.reported, tot.units)}</b><span>${T('situation-room.coverage', 'Coverage')}</span></div>
      <div class="sr-head ok"><b class="num">${n(tot.on_unit)}</b><span>${T('situation-room.on-their-unit', 'On their unit')}</span></div>
      <div class="sr-head off"><b class="num">${n(tot.mismatched)}</b><span>${T('situation-room.filed-elsewhere', 'Filed elsewhere')}</span></div>
      <div class="sr-head wait"><b class="num">${n(silent)}</b><span>${T('situation-room.yet-to-report', 'Yet to report')}</span></div>
    </div>
    <div class="sr-two">
      <div>
        <h2 class="sr-h2">${T('situation-room.place-at-a-glance', '{place} at a glance', { place: esc(homeArea().name) })}</h2>
        <div class="sr-card sr-panel" id="sr-map"><div class="sr-msg">${T('situation-room.drawing-the-map', 'Drawing the map…')}</div></div>
      </div>
      <div>
        <h2 class="sr-h2">${T('situation-room.where-the-election-is-most-missing', 'Where the election is most missing')}</h2>
        <div class="sr-card sr-panel">${gaps.length ? `<div class="sr-scroll">
          <table class="sr-tbl" style="min-width:0">
          <tbody>${gaps.map((x) => `<tr${isMine(c, x.key) ? ' class="mine"' : ''}>
            <td><button class="drill" data-key="${esc(x.key)}">${esc(x.name)}</button>
              ${x.assigned ? `<span class="sr-sub">${n(x.assigned)} of ours here</span>`
                : `<span class="sr-sub" style="color:var(--wait)">${T('situation-room.nobody-assigned', 'nobody assigned')}</span>`}</td>
            <td class="num">${n(x.units - x.reported)}<span class="sr-sub">${T('situation-room.unreported', 'unreported')}</span>${x.watched
              ? `<span class="sr-sub">${n(x.watched)} watched by others</span>` : ''}</td>
            <td style="width:80px"><div class="sr-bar-cell"><span class="num">${pct(x.reported, x.units)}%</span>
              <span class="sr-track"><span class="sr-fill" style="width:${pct(x.reported, x.units)}%"></span></span></div></td>
          </tr>`).join('')}</tbody></table></div>
          <div class="sr-count">${T('situation-room.n-places-worst-first', '{v0} {v1}, worst first — scroll for the rest',
    { v0: n(gaps.length), v1: esc((LEVEL_WORD[c.level] || T('situation-room.places', 'places')).toLowerCase()) })}</div>`
          : `<div class="sr-msg">${T('situation-room.nothing-to-show-yet', 'Nothing to show yet.')}</div>`}</div>

      </div>
    </div>
    ${/* The reader's OWN area first: it is the one they can act on, and the race-wide
         figure is the context for it, not the headline. The CSV buttons pick
         their card by label (data-party-csv), not position, so order is free. */ ''}
    ${S.areaTally ? partiesHtml(S.areaTally, T('situation-room.your-area',
    '{v0} (your area)', { v0: S.group.me.scope_value })) : ''}
    ${partiesHtml(S.tally, raceArea())}
    <h2 class="sr-h2">${T('situation-room.reports-coming-in', 'Reports coming in')}</h2>
    <div class="sr-card${reports.length > 4 ? ' sr-panel' : ''}">${reports.length
          ? `<div class="sr-scroll">${reports.map(activityRow).join('')}</div>`
            + (reports.length > 4 ? `<div class="sr-count">${n(reports.length)} most recent</div>` : '')
          : `<div class="sr-msg">${T('situation-room.no-reports-from-your-observers-yet', 'No reports from your observers yet.')}<br />
             ${T('situation-room.they-will-appear-the-moment-one-is-published', 'They will appear here the moment one is published.')}</div>`}</div>
`;

  document.querySelectorAll('#sr-body .drill').forEach((b) =>
    b.addEventListener('click', () => { S.tab = 'coverage'; S.filter = 'all'; render(); drill(c.level, b.dataset.key); }));
  drawMap(nodes);
}

/**
 * Party totals, honestly ordered.
 *
 * DESCENDING BY VOTES, never the campaign's party first. Their own row is
 * outlined and lifted into a line above the table, which answers "where am I"
 * without reordering what is true — and this table WILL be screenshotted. A
 * table that puts your party on top regardless of standing is a propaganda
 * asset the moment it leaves the room, and the neutrality claim has to survive
 * a rival seeing this screen. A second reason: an order that depends on who is
 * looking is one two coordinators cannot compare.
 *
 * THE DENOMINATOR IS PART OF THE NUMBER. A total from 9% of units is not a
 * standing, and a campaign console is exactly where someone reads it as one —
 * so the unit count sits in the heading, positions are written "4th of 18 so
 * far", and nothing here says leading or winning. A percentage is shown only
 * when the crop matches the area this console is about; otherwise the
 * denominator would come from a different scope than the votes.
 */
function partiesHtml(t, area) {
  if (!t) return '';
  /* EVERY PARTY, NOT ONLY THE SCORING ONES. The tally names whoever has votes;
     the catalogue names the field. Merged, so a campaign finds its own row on
     day one and watches it move, rather than waiting for it to appear. */
  const counted = new Map((t.national || []).map((x) => [String(x.party).toUpperCase(), x.votes || 0]));
  const all = (PARTIES.length
    ? PARTIES.map((p) => ({ party: p.code, name: p.name, votes: counted.get(String(p.code).toUpperCase()) || 0 }))
    : (t.national || []).map((x) => ({ party: x.party, name: '', votes: x.votes || 0 })));
  /* Counted parties are RANKED. The rest are the field, alphabetical and
     unnumbered: a position among parties that all have nothing is alphabetical
     luck, and on a campaign console it would be read as a standing. */
  const scored = all.filter((x) => x.votes > 0).sort((a, b) => b.votes - a.votes
    || String(a.party).localeCompare(String(b.party)));
  const rest = all.filter((x) => !x.votes).sort((a, b) => String(a.party).localeCompare(String(b.party)));
  const rows = scored.concat(rest);
  const cast = scored.reduce((a, x) => a + x.votes, 0);
  const mine = (S.group.party || '').toUpperCase();
  const minePos = scored.findIndex((x) => String(x.party).toUpperCase() === mine);
  const mineRow = all.find((x) => String(x.party).toUpperCase() === mine);
  const share = (v) => (cast ? ((v / cast) * 100).toFixed(1) : '0.0') + '%';
  const areaNote = esc(area);

  if (!rows.length) {
    return `<h2 class="sr-h2">${T('situation-room.party-totals', 'Party totals')}</h2>
      <div class="sr-card"><div class="sr-msg">${T('situation-room.no-results-published-yet-for',
    'No results published yet for {v0}.', { v0: areaNote })}</div></div>`;
  }

  /* "so far" is a claim about progress, and with nothing counted there is no so
     far to speak of — the heading would be describing a table of zeroes. */
  return `<h2 class="sr-h2">${cast
    ? T('situation-room.party-totals-so-far', 'Party totals so far — {v0}', { v0: areaNote })

    <div class="sr-card">
      ${mine && mineRow ? `<div class="sr-mine">
        <span class="sr-emblem">${LOGOS[mine] ? `<img src="${esc(LOGOS[mine])}" alt="" />` : ''}</span>
        <div><b class="num">${n(mineRow.votes)}</b> <span class="num">${share(mineRow.votes)}</span>
          <span class="sr-sub">${esc(mineRow.name || mine)} &middot; ${minePos >= 0
    ? esc(T('situation-room.nth-of-m-so-far', '{v0} of {v1} counted so far',
      { v0: minePos + 1, v1: n(scored.length) }))
    : esc(T('situation-room.no-votes-counted-yet', 'no votes counted yet'))}</span></div>
      </div>` : ''}
      <div class="sr-scroll" style="max-height:300px">
      <table class="sr-parties">
        <thead><tr>
          <th class="rank">#</th>
          <th>${T('results.party', 'Party')}</th>
          <th class="num">${T('situation-room.votes', 'Votes')}</th>
          <th class="num">${T('situation-room.share', 'Share')}</th>
        </tr></thead>
        <tbody>
        ${rows.map((x, i) => {
    const code = String(x.party).toUpperCase();
    const own = code === mine;
    const first = i === scored.length && rest.length;
    return `${first ? `<tr class="sr-divider"><td colspan="4">${
      T('situation-room.yet-to-be-counted', 'Yet to be counted')}</td></tr>` : ''}
          <tr${own ? ' class="sr-own"' : ''}>
            <td class="rank num">${x.votes > 0 ? i + 1 : '·'}</td>
            <td class="party">
              <span class="sr-plogo">${LOGOS[code]
      ? `<img src="${esc(LOGOS[code])}" alt="" />` : ''}</span>
              <span class="pname">${esc(x.name || code)}</span>
              <span class="pcode">${esc(code)}</span>
            </td>
            <td class="num${x.votes ? '' : ' z'}">${n(x.votes)}</td>

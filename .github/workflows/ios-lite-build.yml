name: iOS Lite build (unsigned)

# Unsigned compile check for HAWKEYE LITE on iOS — proves the Capacitor project
# builds for iPhone WITHOUT any Apple account, and reports what it weighs.
#
# This is the restored, retargeted descendant of the deleted ios-build.yml
# (recoverable at `git show 6648cc2^:.github/workflows/ios-build.yml`). The old
# pair was deleted because they built mobile/ — appId ng.com.hawkeye.lite — and
# then exported it signed as ng.com.hawkeye.observer, which could never succeed.
# Lite is the app this one is FOR, so the identity finally matches.
#
# TRIGGER: manual only (Actions -> this workflow -> Run workflow). The repo is
# public, so GitHub's macOS runners cost nothing — unlike the EAS free tier's
# 15 builds/month, which is reserved for the native app.
#
# ---------------------------------------------------------------------------
# THE TOOLCHAIN BELOW WAS DERIVED THE HARD WAY ACROSS SEVEN FAILED RUNS.
# Do not "simplify" any of the four without re-testing:
#   * macos-26 + latest-stable Xcode — Ionic ships ION* XCFrameworks built with
#     Swift 6.2.3; older toolchains REFUSE them (macos-15's Xcode 16.4 is 6.1.2)
#   * Node 22                        — the Capacitor 8 CLI requires >=22
#   * CocoaPods, not SPM             — Cap 8's SPM core regressed APIs the
#     official plugins still call (ionic-team/capacitor#8333)
#   * iOS deployment target 16.0     — GoogleMLKit 8 (via @capacitor-mlkit/*)
#     needs >=15.5, above Capacitor's default 14.0
# ---------------------------------------------------------------------------
#
# KNOWN AND EXPECTED on iOS, not a fault of this build:
#   @capacitor-mlkit/document-scanner is an iOS STUB — its scanDocument calls
#   rejectCallAsUnimplemented, and the two module-install methods app/native.js
#   calls are not registered at all. native.js already treats any non-cancel
#   scanner error as "fall through to the plain camera", so sheet capture
#   degrades rather than breaking. The real fix is a VisionKit plugin
#   (VNDocumentCameraViewController), which is what the native app uses.

on:
  workflow_dispatch: {}

jobs:
  compile:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JS deps
        working-directory: mobile
        # postinstall runs patch-package, which is what keeps ML Kit latin-only.
        run: npm ci

      - name: The Apple-frameworks plugin must be linked
        working-directory: mobile
        # If hawkeye-vision is missing, iOS loses BOTH the scanner and OCR and
        # the app still runs perfectly — native.js falls through to the plain
        # camera and ocrSheet returns early. Exactly the shape that hides.
        run: |
          test -d node_modules/hawkeye-vision \
            || { echo "GATE_FAIL: hawkeye-vision is not installed"; exit 1; }
          test -f node_modules/hawkeye-vision/HawkeyeVision.podspec \
            || { echo "GATE_FAIL: hawkeye-vision has no podspec — it cannot link"; exit 1; }
          # A pod with NO SOURCES builds perfectly and does nothing. mobile/
          # .gitignore's pathless `ios/` rule matched plugins/hawkeye-vision/ios/
          # and kept both Swift files out of the first commit — CocoaPods would
          # have installed an empty pod, the compile would have passed, and iOS
          # would have shipped with no scanner and no OCR. Count them.
          SWIFT=$(find node_modules/hawkeye-vision/ios -name '*.swift' | wc -l | tr -d ' ')
          [ "$SWIFT" -ge 2 ] \
            || { echo "GATE_FAIL: hawkeye-vision has $SWIFT swift files, expected 2 — sources missing from the checkout"; exit 1; }
          echo "  ok: hawkeye-vision present with $SWIFT swift sources"

      - name: Add iOS platform (CocoaPods)
        working-directory: mobile
        # `cap add` runs pod install internally, which fails because the ML Kit
        # pods need a higher iOS target than Capacitor's default 14.0 — tolerate
        # it; the target is bumped and re-podded in the next step.
        run: |
          npx cap add ios --packagemanager CocoaPods || true
          test -f ios/App/Podfile || { echo "Podfile was not generated"; exit 1; }

      - name: Drop ML Kit from the iOS build
        working-directory: mobile
        # GoogleMLKit's text-recognition framework is STATIC, so it links
        # straight into the app binary: 42 MB of a 52 MB device build, measured.
        # Apple's Vision framework does the same job at zero bytes, and the ML
        # Kit document scanner was never more than a stub on iOS. Android keeps
        # ML Kit — it has no VisionKit and the scanner works there.
        #
        # Removed at the Podfile rather than by dropping the npm dependency,
        # because the same package.json builds both platforms.
        run: |
          sed -i '' "/@capacitor-mlkit/d" ios/App/Podfile
          echo "--- capacitor_pods after the cut ---"
          sed -n '/def capacitor_pods/,/^end/p' ios/App/Podfile

      # CONTROL RUN: the modular-headers step is REMOVED here on purpose.
      #
      # It was added pre-emptively from the React Native experience, where
      # FirebaseCoreInternal (Swift) importing the module-map-less Objective-C
      # GoogleUtilities made CocoaPods refuse static linkage. The build passed
      # with it — which proves nothing about whether Capacitor needs it, since a
      # fix that is not required also passes. If pod install succeeds without
      # this, the workaround is cargo and must not be carried into main.

      - name: Bump iOS deployment target + pod install
        working-directory: mobile
        run: |
          set -x
          sed -i '' "s/^platform :ios.*/platform :ios, '16.0'/" ios/App/Podfile
          grep -n "platform :ios" ios/App/Podfile
          (cd ios/App && pod install --repo-update)
          find ios -maxdepth 2 -name '*.xcworkspace' -print

      - name: Gate on what CocoaPods actually installed
        working-directory: mobile
        # Podfile.lock, not the Podfile: the lock is the record of what was
        # installed, which is the thing that ends up in the binary. Editing the
        # Podfile and never checking the result is how a 42 MB regression comes
        # back without anyone noticing.
        run: |
          LOCK=ios/App/Podfile.lock
          if grep -qi 'MLKit' "$LOCK"; then
            echo "GATE_FAIL: ML Kit is back in the iOS build — that is ~42 MB"
            grep -i 'MLKit' "$LOCK" | head
            exit 1
          fi
          grep -q 'HawkeyeVision' "$LOCK" \
            || { echo "GATE_FAIL: HawkeyeVision did not install — iOS would have no scanner and no OCR"; exit 1; }
          echo "  ok: no ML Kit, HawkeyeVision linked"

      - name: Info.plist usage strings
        working-directory: mobile
        # `cap add ios` generates a bare Info.plist. Without these the app does
        # not fail to build — it CRASHES the first time an observer taps the
        # camera, which is the one moment it must not. Set here because ios/ is
        # generated fresh each run and is gitignored.
        run: |
          PL=ios/App/App/Info.plist
          set_str() {
            /usr/libexec/PlistBuddy -c "Delete :$1" "$PL" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PL"
          }
          set_str NSCameraUsageDescription "Hawkeye uses the camera to photograph result sheets and polling-unit surroundings for your report."
          set_str NSLocationWhenInUseUsageDescription "Hawkeye records where a report was filed so results can be matched to the right polling unit."
          set_str NSPhotoLibraryAddUsageDescription "Hawkeye can save a copy of a sheet you photographed to your photo library."
          /usr/libexec/PlistBuddy -c "Print" "$PL" | grep -iE 'UsageDescription' || {
            echo "GATE_FAIL: usage strings were not written"; exit 1; }

      - name: Copy web assets
        working-directory: mobile
        # `cap copy` only refreshes webDir + config; it does NOT regenerate the
        # Podfile, so the deployment-target bump above survives. Explicit rather
        # than relying on the copy `cap add` did before its pod install failed.
        run: npx cap copy ios

      - name: Strip and gate the web bundle
        working-directory: mobile
        # The SAME script the Android release uses. cap sync copies everything
        # under app/ — including app/download/, six ~30 MB copies of a different
        # app, which once produced a 173 MB "Lite". iOS syncs from the identical
        # webDir, so it needs the identical strip; a second copy of this list
        # would drift by the next release.
        run: bash scripts/strip_web_assets.sh ios/App/App/public ios/App/Podfile

      - name: Unsigned compile (simulator)
        working-directory: mobile
        run: |
          set -o pipefail
          WS=$(find ios -maxdepth 2 -name '*.xcworkspace' | head -1)
          echo "Building workspace: $WS"
          xcodebuild -workspace "$WS" -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 CODE_SIGNING_ALLOWED=NO build

      - name: Device build (unsigned) — the size that actually matters
        working-directory: mobile
        # The simulator build is the correctness gate; THIS is the measurement.
        # A simulator .app carries x86_64/arm64-sim slices and is not what a
        # phone downloads, so it cannot answer "is Lite still lite on iOS".
        # continue-on-error, because an unsigned device build is the step most
        # likely to be refused by a toolchain change — and a warning in the UI
        # is visible, where swallowing the failure would not be.
        continue-on-error: true
        run: |
          set -o pipefail
          WS=$(find ios -maxdepth 2 -name '*.xcworkspace' | head -1)
          xcodebuild -workspace "$WS" -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/dd-device \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -20

      - name: What it weighs
        working-directory: mobile
        if: always()
        # A `du -sh Pods/*` total is NOT a store size — an XCFramework carries
        # device AND simulator slices, and only the device one ships. Run 1
        # reported MLKitTextRecognitionCommon at 103 MB on that basis, which
        # overstates it; the ios-arm64 slice below is the honest figure to
        # reason about before App Store thinning and compression.
        #
        # The .app lookup here previously found nothing and printed nothing
        # while the step still went green — measuring zero and reporting
        # success. It now says so out loud.
        run: |
          echo "--- packaged web assets ---"
          du -sh ios/App/App/public

          echo "--- pods by total on disk (both slices, NOT a store size) ---"
          du -sh ios/App/Pods/* 2>/dev/null | sort -rh | head -10

          echo "--- how ML Kit is actually laid out (the ios-arm64 probe missed it) ---"
          # A `-name ios-arm64` search found only IONGeolocationLib, so the
          # GoogleMLKit pods do not use that XCFramework slice layout. Print the
          # real shape rather than reporting a number for one pod and calling it
          # the device total.
          find ios/App/Pods/MLKitTextRecognitionCommon -maxdepth 3 -type d 2>/dev/null | head -8
          find ios/App/Pods -maxdepth 3 -name '*.xcframework' 2>/dev/null | head -8

          echo "--- built .app for DEVICE (Release, arm64) — the real figure ---"
          DEV=$(find /tmp/dd-device -type d -name 'App.app' 2>/dev/null | head -1)
          if [ -n "$DEV" ]; then
            du -sh "$DEV"
            echo "  its frameworks:"
            du -sh "$DEV"/Frameworks/* 2>/dev/null | sort -rh | head -8 || echo "    (none — statically linked)"
            echo "  its main binary:"
            du -sh "$DEV/App" 2>/dev/null || true
          else
            echo "  NOT FOUND — the device build step did not produce a product."
          fi

          echo "--- built .app (simulator Debug, NOT a store size) ---"
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name 'App.app' 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            du -sh "$APP"
          else
            # Loudly, because a silent nothing here is indistinguishable from a
            # build that produced no product at all.
            echo "  NOT FOUND — no App.app under DerivedData. The compile step"
            echo "  said BUILD SUCCEEDED, so this is a measurement fault, not a"
            echo "  build fault; find the real product path before trusting it."
            find ~/Library/Developer/Xcode/DerivedData -maxdepth 3 -type d 2>/dev/null | head -5
          fi

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-lite-podfile-and-plugins
          path: |
            mobile/ios/App/Podfile
            mobile/ios/App/Podfile.lock
          if-no-files-found: warn

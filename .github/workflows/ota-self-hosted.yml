name: OTA update (self-hosted, 1.0.9+)

# Publish a JavaScript update to phones on 1.0.9 and later through our own
# update server (R2 + the hawkeye-ota-manifest Worker), not EAS. Wraps
# scripts/ota_publish_self.sh; runbook: docs/OTA-SELF-HOSTED.md.
#
#   check    signing key matches native/certs/expo-updates-certificate.crt, and
#            the R2 keys can read the bucket. Writes NOTHING. Names the secret
#            to re-set when one is wrong.
#   publish  build, sign and verify. A dry run unless "apply" is ticked.
#   status   fetch the live manifest as a phone does and verify it.
#   history  list published updates for one platform.
#
# Phones on 1.0.8 and earlier read EAS; the script refuses their runtime.
#
# REQUIRED SECRETS
#   EXPO_UPDATES_PRIVATE_KEY   the PEM (its certificate ships inside 1.0.9)
#   OTA_R2_ACCESS_KEY_ID       R2 Account API token: Access Key ID (32 hex)
#   OTA_R2_SECRET_ACCESS_KEY   the same token's Secret Access Key (64 hex)
#   OTA_R2_ENDPOINT            https://<account-id>.r2.cloudflarestorage.com
# VARIABLE
#   OTA_R2_BUCKET              hawkeye-updates

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [check, publish, status, history]
        default: check
      platform:
        description: Platform (history needs one)
        type: choice
        options: [all, ios, android]
        default: all
      message:
        description: What changed (publish only)
        type: string
        default: ''
      apply:
        description: Publish for real (unticked = dry run)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ota-self-hosted
  cancel-in-progress: false

jobs:
  ota:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_UPDATES_PRIVATE_KEY: ${{ secrets.EXPO_UPDATES_PRIVATE_KEY }}
      OTA_R2_ACCESS_KEY_ID: ${{ secrets.OTA_R2_ACCESS_KEY_ID }}
      OTA_R2_SECRET_ACCESS_KEY: ${{ secrets.OTA_R2_SECRET_ACCESS_KEY }}
      OTA_R2_ENDPOINT: ${{ secrets.OTA_R2_ENDPOINT }}
      OTA_R2_BUCKET: ${{ vars.OTA_R2_BUCKET }}
      ACTION: ${{ inputs.action }}
      PLATFORM: ${{ inputs.platform }}
      MESSAGE: ${{ inputs.message }}
      APPLY: ${{ inputs.apply }}
      # The Maps key lives in the store build's manifest, not the JS; tell the
      # exported config it is there, or the map is hidden (native/app.config.js).
      OTA_MAPS_KEY_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Signing key matches the certificate in the app
        run: |
          set +x
          [ -n "$EXPO_UPDATES_PRIVATE_KEY" ] || { echo "::error::EXPO_UPDATES_PRIVATE_KEY is not set"; exit 1; }
          key="$(printf '%s\n' "$EXPO_UPDATES_PRIVATE_KEY" | openssl pkey -pubout 2>/dev/null)" \
            || { echo "::error::EXPO_UPDATES_PRIVATE_KEY is not a readable private key. Re-set it from the .pem file."; exit 1; }
          cert="$(openssl x509 -in native/certs/expo-updates-certificate.crt -pubkey -noout)"
          [ "$key" = "$cert" ] || { echo "::error::EXPO_UPDATES_PRIVATE_KEY does not match native/certs/expo-updates-certificate.crt. Re-set it from the .pem file."; exit 1; }
          echo "EXPO_UPDATES_PRIVATE_KEY: OK (matches the certificate inside 1.0.9)"

      - name: R2 keys can read the bucket
        run: |
          set +x
          ok=1
          for v in OTA_R2_ACCESS_KEY_ID OTA_R2_SECRET_ACCESS_KEY OTA_R2_ENDPOINT OTA_R2_BUCKET; do
            [ -n "${!v}" ] || { echo "::error::$v is not set"; ok=0; }
          done
          [ "$ok" = 1 ] || exit 1
          [[ "$OTA_R2_ENDPOINT" =~ ^https://[0-9a-f]{32}\.(eu\.)?r2\.cloudflarestorage\.com/?$ ]] \
            || { echo "::error::OTA_R2_ENDPOINT must be exactly https://<32 characters>.r2.cloudflarestorage.com (nothing after .com)"; exit 1; }
          echo "OTA_R2_ENDPOINT: OK (format)"
          [[ "$OTA_R2_ACCESS_KEY_ID" =~ ^[0-9a-f]{32}$ ]] \
            || echo "::warning::OTA_R2_ACCESS_KEY_ID is not 32 hex characters. Is it the Access Key ID (the shorter one)?"
          [[ "$OTA_R2_SECRET_ACCESS_KEY" =~ ^[0-9a-f]{64}$ ]] \
            || echo "::warning::OTA_R2_SECRET_ACCESS_KEY is not 64 hex characters. Is it the Secret Access Key (the longer one)?"
          # Read-only. The error text is matched, never printed.
          if err="$(env AWS_ACCESS_KEY_ID="$OTA_R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$OTA_R2_SECRET_ACCESS_KEY" \
                AWS_DEFAULT_REGION=auto aws --endpoint-url "${OTA_R2_ENDPOINT%/}" --no-cli-pager \
                s3api list-objects-v2 --bucket "$OTA_R2_BUCKET" --max-items 1 2>&1 >/dev/null)"; then
            echo "OTA_R2_ACCESS_KEY_ID + OTA_R2_SECRET_ACCESS_KEY: OK (can read $OTA_R2_BUCKET)"
          else
            case "$err" in
              *InvalidAccessKeyId*|*"Access Key Id"*) echo "::error::R2 does not know OTA_R2_ACCESS_KEY_ID. Re-set it with the token's Access Key ID." ;;
              *SignatureDoesNotMatch*) echo "::error::OTA_R2_SECRET_ACCESS_KEY is wrong for that Access Key ID. Re-set it with the token's Secret Access Key." ;;
              *NoSuchBucket*) echo "::error::No bucket named '$OTA_R2_BUCKET' at OTA_R2_ENDPOINT. Check the endpoint's account ID." ;;
              *AccessDenied*|*Forbidden*|*403*) echo "::error::The keys work but the token cannot read '$OTA_R2_BUCKET'. It needs Object Read & Write on that bucket." ;;
              *) echo "::error::R2 check failed for another reason (network?). Re-run." ;;
            esac
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: inputs.action != 'check'
        with:
          node-version: 22

      - name: Install native dependencies
        if: inputs.action != 'check'
        working-directory: native
        run: npm ci

      - name: Run ota_publish_self.sh
        if: inputs.action != 'check'
        run: |
          set +x
          args=(--platform "$PLATFORM")
          case "$ACTION" in
            publish)
              [ -n "$MESSAGE" ] || { echo "::error::publish needs a message (what changed)"; exit 1; }
              args+=(--message "$MESSAGE")
              [ "$APPLY" = true ] && args+=(--apply) || echo "DRY RUN: nothing is written to R2 (tick 'apply' to publish)"
              ;;
            status) args+=(--status) ;;
            history) args+=(--history) ;;
          esac
          bash scripts/ota_publish_self.sh "${args[@]}"
          # STILL-LIVE OLDER RUNTIMES. runtimeVersion = appVersion, so the run
          # above reaches only the CURRENT app version. Phones on an older
          # binary with the same native code keep getting updates while their
          # runtime is listed in native/ota-extra-runtimes.json — empty it once
          # the new binary has replaced the old one on both stores.
          if [ "$ACTION" = publish ]; then
            for rt in $(node -e 'console.log((require("./native/ota-extra-runtimes.json")||[]).join(" "))'); do
              echo "::group::also runtime $rt"
              bash scripts/ota_publish_self.sh "${args[@]}" --runtime "$rt"
              echo "::endgroup::"
            done
          fi

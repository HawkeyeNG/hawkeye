<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hawkeye — Election-Day Map Preview (mock data)</title>
  <script>/*hk-theme-init*/(function(){try{var t=localStorage.getItem("hawkeye_theme");if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";}document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme="dark";}})();</script>
  <link rel="stylesheet" href="styles.css?v=168" />
  <script src="native.js?v=114"></script>
  <style>
    /* Awaiting reports = neutral grey. A region that has reported takes its
       leading party's OWN colour: one pale green for every winner told the
       reader nothing, which is the whole point of a results map. */
    .state-shape{fill:#e9e9e7;stroke:#fff;stroke-width:.8}
    /* White ring behind each flag so it stays legible on a saturated fill. */
    .flag-disc{fill:#fff;stroke:rgba(0,0,0,.25);stroke-width:.8}
    svg{width:100%;height:auto}
  </style>
  <script src="authgate.js?v=2"></script>
  <script src="map-label.js?v=2"></script>
</head>
<body>
  <header class="gov-header"><div class="wrap brand-row"><a class="brand" href="index.html"><span class="crest">🦅</span><div class="brand-text"><strong>HAWKEYE</strong><span>Map Preview</span></div></a></div></header>
  <main class="wrap">
    <h1>Presidential Map — Election-Day Preview</h1>
    <p class="unofficial" style="background:var(--tint-danger);border-left:6px solid #b3261e;padding:12px">MOCK DATA — random winners, for layout preview only. On election day each state fills with the leading party's official emblem as reports arrive.</p>
    <div class="card"><div id="map">Loading…</div></div>
    <button class="secondary" onclick="draw()">Randomise Winners</button>
  </main>
  <script>
    // Same palette as the seat arch on political.html — one party, one colour,
    // everywhere. LP is #8bc34a, NOT the #388e3c it used to be here: against
    // APC's #2e7d32 that older green was indistinguishable on a small map.
    const PC={APC:'#2e7d32',PDP:'#c62828',LP:'#8bc34a',NNPP:'#1565c0',APGA:'#f9a825',
      SDP:'#5e35b1',ADC:'#00897b',YPP:'#ef6c00',A:'#00838f',ADP:'#455a64',NDC:'#2e3192',
      PRP:'#6d4c41',AA:'#3e2723',NRM:'#827717'};
    let R=10;    // recomputed per render from the svg's on-screen scale
    let GEO,LOGOS={};
    // Party emblems are WIDE rectangles, not square icons, so a circular clip
    // would slice the artwork. A rounded plate behind them, with the image
    // letterboxed inside it (preserveAspectRatio default), keeps every emblem
    // whole and gives the flags one consistent silhouette across the map.
    function badge(p,x,y){
      const w=R*2, h=R*1.45;
      const plate=`<rect class="flag-disc" x="${x-w/2-1}" y="${y-h/2-1}" width="${w+2}" height="${h+2}" rx="2.5"/>`;
      return LOGOS[p]
        ? `<g>${plate}<image href="${LOGOS[p]}" x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}"/></g>`
        : `<g>${plate}<rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="2" fill="${PC[p]||'#546e7a'}"/>
             <text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central"
               fill="#fff" font-size="7" font-weight="700">${p}</text></g>`;
    }
    function draw(){
      // Only parties we can BOTH colour and badge. The manifest carries every
      // registered party (BOOT, NRM, DA…), and drawing those left states filled
      // with the fallback grey — which is exactly the "no party colours" look
      // this is meant to demonstrate away from.
      const withLogo=Object.keys(PC).filter((p)=>LOGOS[p]);
      const pool=withLogo.length?withLogo:Object.keys(PC);
      const won=[];
      let s='';
      for(const st of GEO.states){
        const p=pool[Math.floor(Math.random()*pool.length)];
        won.push(p);
        s+=`<path class="state-shape" style="fill:${PC[p]||'#9aa7a0'}" d="${st.path}"><title>${st.name}: ${p} leads</title></path>`;
      }
      const map=document.getElementById('map');
      // Shapes FIRST: the label point is measured off the rendered path, so the
      // geometry has to exist in the document before the flags are placed.
      map.innerHTML=`<svg viewBox="${GEO.viewBox}">${s}<g class="badges"></g></svg>`;
      const svg=map.querySelector('svg');
      R=window.HAWKEYE_MAP.badgeScale(svg);   // constant on-screen size at any viewport
      const layer=svg.querySelector('g.badges');
      const paths=svg.querySelectorAll('path.state-shape');
      let b='';
      paths.forEach((path,i)=>{
        const pt=window.HAWKEYE_MAP.labelPoint(path);
        b+=badge(won[i],pt.x,pt.y);
      });
      layer.innerHTML=b;
    }
    (async()=>{[GEO,LOGOS]=await Promise.all([fetch('states_geo.json').then(r=>r.json()),fetch('logos/manifest.json').then(r=>r.json()).catch(()=>({}))]);draw();})();
  </script>
</body>
</html>

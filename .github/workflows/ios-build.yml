name: iOS build (Capacitor)

# Builds the Hawkeye iOS app from the shared app/ bundle via Capacitor on a
# GitHub-hosted macOS runner — no Mac needed locally. The ios/ project is
# gitignored, so it is regenerated fresh each run with `npx cap add ios`
# (which also runs `pod install`).
#
# TRIGGER: manual only (Actions tab -> "iOS build (Capacitor)" -> Run workflow),
# so routine app/ pushes never spend runner minutes.
#
# STATUS: unsigned compile check — proves the iOS app builds WITHOUT an Apple
# account. Once the Apple Developer Program membership exists, add the signing
# secrets listed at the bottom and enable the archive/TestFlight job.

on:
  workflow_dispatch: {}

jobs:
  compile:
    runs-on: macos-26   # newest image. Ionic's prebuilt XCFrameworks (e.g. IONGeolocationLib) are compiled with Swift 6.2.3 and reject older compilers (macos-15's Xcode 16.4 = Swift 6.1.2).
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable   # newest Xcode on the image (Swift >= 6.2.3)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # Capacitor 8 CLI requires Node >=22
      - name: Install JS deps
        working-directory: mobile
        run: npm ci
      - name: Add iOS platform (CocoaPods)
        working-directory: mobile
        # Capacitor 8 defaults to Swift Package Manager, whose distributed core
        # regressed APIs the official plugins still use, breaking every SPM build
        # (ionic-team/capacitor#8333 — e.g. push-notifications
        # "CAPPluginCall has no member 'reject'"). Force the CocoaPods template.
        # cap add runs pod install internally, which fails because the ML Kit pods
        # (GoogleMLKit 8) need a higher iOS target than Capacitor's default 14.0 —
        # tolerate it; we bump the target and re-pod in the next step.
        run: |
          npx cap add ios --packagemanager CocoaPods || true
          test -f ios/App/Podfile || { echo "Podfile was not generated"; exit 1; }
      - name: Bump iOS deployment target + pod install
        working-directory: mobile
        run: |
          set -x
          # GoogleMLKit 8 (via @capacitor-mlkit/*) requires iOS >= 15.5; use 16.0.
          sed -i '' "s/^platform :ios.*/platform :ios, '16.0'/" ios/App/Podfile
          grep -n "platform :ios" ios/App/Podfile
          (cd ios/App && pod install --repo-update)
          find ios -maxdepth 2 -name '*.xcworkspace' -print
      - name: Unsigned compile (simulator)
        working-directory: mobile
        run: |
          set -o pipefail
          WS=$(find ios -maxdepth 2 -name '*.xcworkspace' | head -1)
          echo "Building workspace: $WS"
          xcodebuild -workspace "$WS" -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 CODE_SIGNING_ALLOWED=NO build

# ---------------------------------------------------------------------------
# ENABLE AFTER APPLE DEVELOPER PROGRAM ENROLLMENT ($99/yr)
# ---------------------------------------------------------------------------
# 1. In the Apple Developer portal, register the App ID `ng.com.hawkeye.observer`
#    and create an App Store distribution certificate + provisioning profile.
# 2. In App Store Connect, create an API key (for TestFlight upload).
# 3. Add these repo secrets (Settings > Secrets and variables > Actions):
#      BUILD_CERTIFICATE_BASE64     base64 of the distribution .p12
#      P12_PASSWORD                 password for that .p12
#      PROVISIONING_PROFILE_BASE64  base64 of the App Store provisioning profile
#      KEYCHAIN_PASSWORD            any random string (temporary keychain)
#      APPSTORE_KEY_ID / APPSTORE_ISSUER_ID / APPSTORE_PRIVATE_KEY
#                                   App Store Connect API key for the upload
# 4. Add an `archive` job: import the cert into a temp keychain, `npx cap add ios`,
#    `xcodebuild -workspace ios/App/App.xcworkspace -scheme App archive` ->
#    `xcodebuild -exportArchive` (app-store method) -> `xcrun altool`/notary upload
#    to TestFlight. Known iOS caveat to verify on the first run: the ML Kit
#    document scanner (@capacitor-mlkit/document-scanner) is Android-only; on iOS
#    native.js already falls back to the plain camera, so the sheet-capture flow
#    degrades gracefully (no auto-flatten) rather than breaking the build.
